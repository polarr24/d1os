function developmentSessionPreview(p){const b=p.development;return `<span class="eyebrow">Development / preview only</span><h1>${esc(b.phase?.name||'Review required')}</h1><p>Preview never authorizes a workout. Today’s decision and actual coach-supervised warm-up control the runner. Main loads stay unknown until a current coach-reviewed working load is recorded.</p>${['block-a','block-b'].map(k=>section(k==='block-a'?'Full-body A':'Full-body B',window.D1DEV.exercises(b,k,'standard',{bench:workingLoad('bench')?.lb,trap:workingLoad('trap')?.lb}).map(e=>`<div class="history"><b>${esc(e.name)}</b><p>${e.sets} × ${e.reps} · ${e.load===null?'coach selects familiar load':e.load===0?'bodyweight':e.load+' lb reported working load'} · ${e.rest}s rest</p><p class="small">${esc(e.why)} ${esc(e.tempo)}</p></div>`).join('')||'<p>No active phase to preview.</p>')).join('')}${btn('Back to today’s training','go:train','wide')}${evidence('YOUTH AAPFULL DESIGN')}`;}
function developmentPage(){const D=window.D1DEV,b=D.block(S,now()),p=C.plan(S,now());return `<span class="eyebrow">Development / coach-reviewed context</span><h1>Build in blocks.<br>Measure the transfer.</h1><p>The 24-month map provides direction. An eight-week block adapts the next work to the actual calendar; it is not a promise of muscle gain, speed or a scholarship.</p><div class="status"><b>${esc(C.titles[p.code])}</b><p>${esc(p.reason)} ${p.notes.map(esc).join(' ')}</p></div>${b&&!b.invalid?section('Current eight-week block',`<p><b>${esc(b.mode)} · ${esc(b.goal)} · ${b.planned?'planned start '+b.startDate:b.expired?'ended':'week '+b.week+'/8'}</b></p><p>Coach: ${esc(b.coach)} · athlete-entered, not independently verified. ${b.contextChanged?'Calendar changed; a new review is required.':''} ${b.reviewDue?'Two-week review is due or training held.':''}</p>${b.phase?`<h3>${esc(b.phase.name)}</h3><p>${esc(b.phase.purpose)}</p><p><b>Speed:</b> ${esc(b.phase.speed)}</p><p><b>Power:</b> ${esc(b.phase.power)}</p><p><b>Review:</b> ${esc(b.phase.review)}</p>`:''}<p>Chosen strength days: ${b.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' / ')}. Sprint/power approval never overrides today’s gates.</p>${btn('Open current session','go:train','primary wide')}${btn('Measured performance dashboard','go:performance','wide')}${details('Record the actual coach review',`<form data-form="development-review" data-context="${esc(b.blockId)}">${input('devReviewCoach','Coach who reviewed this block','text','','maxlength="100" required')}${select('devReviewDecision','Actual decision',[['continue','Continue the reviewed block'],['revise','Revise / hold until new block'],['hold','Hold extra training']])}${area('devReviewEvidence','Actual field outputs, movement, recovery and schedule evidence')}${check('devReviewConfirmed','This decision actually occurred; an app checkbox is not medical clearance')}<button class="wide">Save coach review</button></form>`)}${btn('End this ther-sport context','go:sports','wide')}`)}${details('Eight-week progression and deloads',D.PHASES.map(x=>`<div class="history"><b>Week ${x.weeks.join(', ')} · ${esc(x.name)}</b><p>${esc(x.purpose)}</p><p class="small">Main lift: ${x.sets} set(s) × ${x.reps} reps at ${x.rir} reserve. Coach chooses familiar loads. ${esc(x.review)}</p></div>`).join(''))}${section('24-month direction · review-driven',D.ROADMAP.map(([time,title,text])=>details(time+' · '+title,`<p>${esc(text)}</p><p class="small">Advance by comfortable technique, recovery, actual calendar and coach review—not the month alone. Growth spurts can require temporary reductions and relearning. Goals overlap; muscle → strength → power is not a rigid biological conveyor.</p>`)).join(''))}${section('Sprint and power transfer rules',`<ul><li>Speed before fatiguing lifting; full recovery between high-quality efforts. Conditioning is a different task.</li><li>Acceleration starts and resisted/hill work require a coach-selected familiar surface, load and projection cue. No sled percentage is inferred from bodyweight.</li><li>Maximum-velocity exposure develops progressively with qualified observation and hamstring tolerance. No first-time flying sprint is assigned from a checkbox.</li><li>Low-volume landings/jumps/throws can precede strength when familiar and approved. Advanced depth jumps, loaded jumps and Olympic derivatives are optional and need instruction.</li><li>Maintain RB ball security, cuts/receiving and LB recognition/pursuit during appropriate practice. No extra collision exposure to complete a plan.</li></ul><p class="small">The exact eight-week layout, set counts and two-week review cadence are coaching/product choices. Youth resistance training and progressive motor development have supporting evidence; this exact app program has not been clinically validated.</p>${evidence('YOUTH AAPFULL SPEED DESIGN')}<a href="https://www.nsca.com/about-us/position-statements/youth-training-and-long-term-athletic-development/" target="_blank" rel="noopener noreferrer">NSCA: youth development ↗</a>`)}${details('Block and review history',history('development-block')+history('development-review'))}${btn('Back to Train','go:train','wide')}`;}

function researchTrial(t){return details(t.name,`<dl class="audit-grid">${[['Population / age / sex',t.population],['Design / duration',t.design],['Intervention / comparator',t.intervention],['Endpoints',t.primary],['Actual results',t.results],['Not measured / not extracted',t.notMeasured],['Limitations',t.limits],['Safety observations',t.safety],['Translation decision',t.translation]].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>${researchSources([t.source])}`);}
function researchCard(c){const R=window.D1RESEARCH;return details(c.name,`<span class="tag">${esc(c.group)}</span><div class="status"><b>${esc(R.outcomes.find(x=>x[0]===researchOutcome)?.[1])}</b><p>${esc(R.verdict(c,researchOutcome))}</p></div><dl class="audit-grid"><dt>S · Structural evidence</dt><dd>${esc(c.status)}<br>${esc(c.human)}</dd><dt>E · Effect pathway</dt><dd>${esc(c.path)}. A mechanism is not proof.</dd><dt>E · Emergent risks</dt><dd>${esc(c.risk)}</dd><dt>D · Decision</dt><dd>${esc(c.translation)} No enhancement recommendation.</dd><dt>HUMAN PERFORMANCE EVIDENCE</dt><dd>${c.trials.some(id=>['gh2010','ghacl','epo2017','aas1996','col2003','ash2015'].includes(id))?'Endpoint-specific controlled evidence described below; population limits apply.':esc(R.NONE)} ${esc(c.human)}</dd><dt>ATHLETIC TRANSLATION</dt><dd>${esc(c.translation)}</dd><dt>SAFETY CERTAINTY</dt><dd>${esc(c.risk)}</dd><dt>ADOLESCENT EVIDENCE</dt><dd>${esc(c.pediatric)}</dd><dt>WHAT THE INTERNET CLAIMS</dt><dd>${esc(c.claims)}</dd><dt>WHAT THE DATA ACTUALLY SHOW</dt><dd>${esc(c.reality)}</dd><dt>2026 WADA status</dt><dd>${esc(c.wada)}. Prohibition is separate from effectiveness; sport-specific rules may differ.</dd><dt>FDA / EMA scope</dt><dd>US source status above. EMA/national authorizations have not been independently audited for every product; no worldwide approval is implied.</dd></dl>${c.trials.map(id=>researchTrial(R.study(id))).join('')}${researchSources(c.sources)}`);}
function researchPage(){const R=window.D1RESEARCH,list=R.find(researchQuery,researchGroup);return `${btn('Inspect published study data','go:ped-data','primary wide')}<span class="eyebrow">HELIX / human evidence before mechanism</span><h1>Audit the claim.<br>Measure the sport.</h1><div class="status"><b>${R.compounds.length} compounds / distinctions · ${R.trials.length} study extractions</b><p>Reality Lock ON. No best PED, stack, dosing, cycles, sourcing or self-experiment protocol. Clinic availability is not evidence of added athletic benefit.</p></div><form data-form="research-filter">${input('researchQuery','Search compound / alias / claim','search',researchQuery,'maxlength="100"')}${select('researchGroup','Research category',[['all','All categories'],...[...new Set(R.compounds.map(c=>c.group))].map(g=>[g,g])],researchGroup)}${select('researchOutcome','Judge a specific outcome',R.outcomes,researchOutcome)}<button class="primary wide">Apply evidence filters</button></form><p class="small">${list.length} matching entries. Results are alphabetical, never ranked as choices. “Not identified” describes this audit, not proof that an effect is impossible.</p>${list.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(researchCard).join('')}${btn('Testosterone claims · independent review','go:testosterone','wide')}${details('Evidence ladder and missing endpoints',`<ol><li>Multiple replicated human RCTs directly measuring the athletic outcome.</li><li>Human RCTs of related physiological outcomes. A single direct trial is described explicitly; it does not earn replicated Level 1 evidence.</li><li>Human clinical mechanisms / uncontrolled clinical reports.</li><li>Animal intervention evidence.</li><li>Cell / theoretical mechanisms.</li><li>Anecdote / marketing.</li></ol><p>Evidence level applies to the exact outcome and intervention. A growth trial can be strong evidence for disease treatment and still provide no sprint evidence. Reaction time, football decisions, RFD, repeated-running sprint capacity, injury rates and session recovery have not been established by most cited peptide trials.</p><p>Study amounts and administration instructions are intentionally not reproduced. Missing age, sex, duration or sample details are marked as not extracted rather than invented; follow the source for independent review.</p>`)}${details('GH / IGF-1 axis · mechanism versus reality',`<div class="scroll"><table><thead><tr><th>Intervention</th><th>Where it acts</th><th>What needs separate proof</th></tr></thead><tbody><tr><td>GH</td><td>GH receptor directly</td><td>Contractile tissue vs water; healthy strength and running outcomes</td></tr><tr><td>Mecasermin</td><td>IGF-1 receptor directly</td><td>Enhancement despite normal development; hypoglycemia risk</td></tr><tr><td>GHRH analogues</td><td>Pituitary GHRH receptor</td><td>Hormone exposure vs performance; exact formulation</td></tr><tr><td>GHS / MK-677</td><td>Ghrelin-related receptor</td><td>Appetite, fluid, glycemia and sport output separately</td></tr></tbody></table></div><p>Combining upstream and downstream agents may increase overlapping exposure without demonstrated additional athletic benefit. Opposing glucose effects do not cancel safely; monitoring cannot turn an untested combination into established adolescent care.</p><p><b>HALT: CONTRADICTION</b> when a claim calls disease growth, fat loss, water gain, cycling work or biomarker changes proof of teenage sprint improvement. A before/after training log cannot isolate a drug effect from maturation, training, expectation or measurement variation.</p>${researchSources(['gh','mk','igf'])}`)}${details('Injury-healing audit',`<p>BPC-157: small uncontrolled clinical reports are not structural-healing trials. TB-500: do not borrow full-length Tβ4 ocular trials. GH: adult ACL rehabilitation has a small positive strength pilot; tissue collagen findings alone do not prove tendon repair. IGF-1: disease growth and tissue mechanisms do not establish athletic return-to-sport.</p><p>Animal tendon/muscle repair and cell survival remain preclinical. Faster pain relief, improved tissue biomarkers and earlier safe collision return are different endpoints. Clearance remains with the treating professional.</p>`)}${section('Independent paper / clinic review',`<p>Save a question and document reference, not a drug experiment. Remove names/contact information and identifying medical records from these notes. This record never modifies readiness or training permission.</p><form data-form="research-review">${select('researchCompound','Exact compound being reviewed',R.compounds.map(c=>[c.id,c.name]))}${select('researchKind','What is being audited',[['paper','Published paper'],['clinic','Clinic claim / written rationale'],['trial','Registered formal trial']])}${area('researchClaim','Exact claim and athletic endpoint')}${area('researchDocument','Paper DOI / trial ID / redacted document reference')}${area('researchGap','Population mismatch, missing endpoint or independent specialist question')}<button class="wide">Save evidence question</button></form>${details('Clinic / formal-trial verification checklist',`<p>Request the professional title and specialty/board certification, exact products/formulations, written indication/rationale, monitoring domains and lab schedule, stopping criteria, emergency/contact process, cited papers and financial conflicts.</p><p>If it is a trial: registry/registration ID, sponsor, principal investigator, phase, inclusion/exclusion criteria, ethics/IRB approval, parent consent/adolescent assent and independent safety-monitoring structure. Registry listing alone does not validate a clinic’s product or establish approval.</p><p>Independent pediatric sports-medicine/endocrinology questions: Is there a diagnosed condition? Do pubertal stage and age-specific reference ranges change interpretation? What glucose, IGF-1, growth, orthopedic, BP and symptom domains need clinical assessment? What evidence supports this exact population and sport endpoint? What would make the specialist stop treatment?</p>`)}${details('Saved evidence questions',history('research-review'))}`)}${section('Benchmark the fundamentals',`<p>Progressive supervised strength and motor development, fresh sprint practice, suitable food and sleep have direct relevance to the athlete’s task. No valid trial here quantifies a peptide’s extra effect on top of this app’s complete 24-month adolescent program.</p><p>Creatine is a separate sports-supplement question: adult benefits do not establish optimal adolescent dosing or long-term safety. Review medical suitability and the exact product with a parent/professional; the app assigns no amount.</p>${researchSources(['youth','creatine','sleep'])}`)}${btn('Football / wrestling / track transfer','go:sports','wide')}${btn('Measured performance dashboard','go:performance','wide')}${btn('Back to Lab','go:lab','wide')}`;}
function testosteronePage(){return `<span class="eyebrow">Testosterone / developmental context</span><h1>Judge the output.<br>Interpret the hormone.</h1><p>A developing athlete’s hormone result needs age, pubertal stage, symptoms, sampling context, assay and an independent clinician’s interpretation. There is no “high testosterone” score, target or booster stack here.</p>${section('What “boosting test” can actually mean',`<div class="scroll"><table><thead><tr><th>Claim</th><th>What the evidence supports</th></tr></thead><tbody><tr><td>Correct a diagnosed deficiency</td><td>Specialist disease treatment; separate from enhancement</td></tr><tr><td>Support normal development</td><td>Food access, sleep and recoverable training; no promised hormone rise</td></tr><tr><td>Oral colostrum = injected IGF-1</td><td>Different intervention; cited trial’s circulating IGF-1 did not rise</td></tr><tr><td>Herbal testosterone change = speed</td><td>Adult preparation-specific biomarker/gym findings; teen running transfer unproven</td></tr><tr><td>Adult testosterone RCT = teen regimen</td><td>Adult muscle/strength data cannot establish healthy-teen safety or D1 odds</td></tr></tbody></table></div>`)}${['testosterone','ash','colostrum'].map(id=>researchCard(window.D1RESEARCH.compounds.find(c=>c.id===id))).join('')}${section('Normal-development priorities',`<p>Record actual sleep, fuel availability, total football/wrestling/track load and growth-related coordination changes. Frequent hunger, persistent fatigue, falling performance, recurrent focal pain or impaired recovery call for workload and clinical review—not an automatic hormone supplement.</p><p>Micronutrient deficiency requires assessment; extra vitamins/minerals are not established boosters when status is already adequate. No endocrine diagnosis is made from appearance, gym progress or one result.</p>${btn('Food and sleep framework','go:fuel','wide')}${btn('Shared sport workload','go:sports','wide')}`)}${btn('Full research library','go:research','wide')}`;}
async function researchSubmit(form){const R=window.D1RESEARCH;if(form.dataset.form==='research-filter'){researchQuery=value('researchQuery').trim().slice(0,100);researchGroup=value('researchGroup');researchOutcome=value('researchOutcome');if(!['all',...[...new Set(R.compounds.map(c=>c.group))]].includes(researchGroup)||!R.outcomes.some(x=>x[0]===researchOutcome))throw Error('Choose the listed evidence filters');return true;}if(form.dataset.form==='research-review'){await log('research-review',R.reviewPayload({compound:value('researchCompound'),kind:value('researchKind'),claim:value('researchClaim'),document:value('researchDocument'),gap:value('researchGap')}));return true;}return false;}

r">FDA current testosterone information ↗</a><p><a href="https://www.fda.gov/consumers/consumer-updates/fda-warns-use-selective-androgen-receptor-modulators-sarms-among-teens-young-adults" target="_blank" rel="noopener noreferrer">FDA SARMs warning ↗</a></p>`)}`;}
function pedConflicts(){const E=window.D1EVIDENCE;const cards=[

function pedAxes(){return `${section('GH / IGF-1: related does not mean interchangeable',pedDataTable(['Class','Pathway','Evidence boundary / risk'],[['GH','GH receptor → direct effects + IGF-1','Water / collagen / fat changes differ from contractile-muscle gain; glycemic and fluid risks'],['Mecasermin','IGF-1 receptor → growth signaling','Pediatric disease-growth treatment is not healthy-teen enhancement; severe hypoglycemia'],['Tesamorelin / GHRH','Pituitary GHRH receptor → GH → IGF-1','HIV visceral-fat evidence, not athletic output; prolonged IGF-1 exposure uncertain'],['GHS / MK-677','Ghrelin-related receptor → GH + appetite','Hormones and FFM do not prove functional benefit; insulin sensitivity can worsen'],['Androgens / SARMs','Androgen receptor → tissue signaling','Adult strength evidence differs by exact agent; reproductive/endocrine and lipid risks']])+`<p>HALT: CONTRADICTION — overlapping endocrine pathways are not proof of synergy. Opposing glucose effects do not safely cancel. Blood tests cannot establish safety for an untested combination.</p>`)}${section('Injury claims: four separate questions',`<p>Pain relief, collagen synthesis, structural healing and safe return to collision are different endpoints. An injured adult rehabilitation trial cannot be merged with an uninjured tissue experiment.</p>${pedDataTable(['Intervention','What must not be borrowed'],[['BPC-157','Animal healing or uncontrolled human reports → proven human tendon recovery'],['TB-500 fragment','Full-length thymosin-beta-4 eye studies → injected fragment sports recovery'],['GH','Collagen synthesis → fewer injuries or faster safe football return'],['IGF-1','Growth-failure treatment → healed athletic injury']])}<p>No controlled human performance evidence was identified for BPC-157 or TB-500 in this curated audit. This is a bounded search finding, not proof that research can never show an effect.</p>${researchSources(['bpc','tb','collagen','acl','igf'])}`)}${section('Muscle-growth and metabolic research',`<p>Follistatin gene therapy is not an interchangeable bottled peptide. Myostatin/activin antibodies, GDF-15 blockade, GDF-15 agonism, PEG-MGF, MOTS-c and humanin analogs act differently. Disease weight change, endogenous peptide measurement and cell survival must not be relabeled as athlete intervention trials.</p><p>For wrestling, added total weight also changes weight-class demands. For track and football, relative force and actual timed running remain separate tests. No extracted trial predicts recruiting probability, cognitive football decisions or faster recovery after every workout.</p>${researchSources(['foll','bima','gdf','mots','cells','endogenous'])}`)}${section('Pediatric reality & independent review',`<p>Normally developing adolescents are not miniature older adults or patients with endocrine deficiency. Growth plates, puberty, orthopedic symptoms, reproductive development and age-specific hormone ranges change the risk question. Disease-treatment experience does not supply healthy-athlete enhancement safety.</p><p>Ask an independent pediatric sports-medicine or endocrinology specialist: Is there a diagnosed condition? Which exact product and indication? Which direct adolescent endpoint supports the claim? What is unknown about development, glucose, IGF-1 exposure and long-term follow-up? Who oversees adverse events and stopping decisions?</p>${researchSources(['tesa','igf','ghlabel','fda'])}`)}`;}
function pedMethods(){const d=window.D1EVIDENCE.difference(1.1,-0.5);return `${section('Study-reading rules',`<ol><li>Declare the endpoint before reading the result: running time is not cycling work, VAT is not total fat, DXA lean mass is not pure contractile protein.</li><li>Inspect randomization, comparator, blinding, attrition, training and exact population.</li><li>Separate within-arm change from between-group effect. An active-plus-training change does not isolate the drug.</li><li>Read intervals and prespecified endpoints. A p-value does not measure sporting importance; many tested outcomes raise multiplicity concerns.</li><li>Record null and missing results separately. A short underpowered null does not prove equivalence.</li><li>Audit sponsor ties, missing tables and unpublished studies. A registry entry is not efficacy evidence.</li><li>Assess harms independently: a short trial with no severe events cannot resolve rare or delayed risk.</li></ol>`)}${section('Worked example: MK-677 mass arithmetic',`<p>Published FFM arm changes: +1.1 and −0.5 kg. Difference = ${d.value.toFixed(1)} kg.</p><p>${esc(d.basis)} The original analysis and confidence intervals remain authoritative. This is not a predicted muscle gain for you. Measured strength/function did not improve.</p>${researchSources(['mk'])}`)}${section('What our own records can—and cannot—answer',`<p>The app’s preregistered training pilot can compare ordinary rest or exercise order. Workout logs can track performance, but cannot isolate endocrine-drug effects from maturation, training, diet, water, placebo effects or measurement noise.</p><p>Human drug research requires a legitimate investigational framework, independent ethics review, qualified clinical oversight, lawful product controls, consent/assent and safety monitoring. Personal self-experimentation is not a substitute. This workbench creates no drug experiment.</p>`)}${section('Evidence gaps kept open',`<p>Healthy-adolescent long-term safety; actual running acceleration and top speed; RFD; repeated-running sprint ability; injury rates; football decision-making; recovery between ordinary sessions; and incremental effect beyond a complete supervised two-year program remain unestablished for most discussed peptides.</p><p>This curated refresh inspected primary indexed abstracts, selected full articles and official labels. Access limits are named per study. It is not an exhaustive systematic search, raw-data reanalysis or a global ranking. The broader library retains its separate audit date.</p>`)}`;}

igue training is deliberately separate. Do not replace speed practice with long circuits because both feel hard.',boundary:'No first-time maximal fly, hard bounds or depth-jump dose from an app selection. Pain or changed mechanics ends the exposure and requires review.',sources:[['Haugen et al., sprint training review','https://link.springer.com/article/10.1186/s40798-019-0221-0'],['NSCA youth resistance training','https://www.nsca.com/globalassets/about/position-statements/position_stand_youth_resistance_training---2009.pdf']]},

  return {sports,playbooks,contextPayload,skillPayload,skillSeries};

on class="wide">Save sport-context review</button></form>`)}${section('Evidence and coaching choices',`<p>These playbooks are coach-discussion frameworks; their exact skill sequence has not been validated as an optimal program. Youth training, task practice and recovery guidance support the general approach; they do not quantify a D1 outcome.</p>${b.sources.map(([name,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a>`).join('')}`)}${btn('Eight-week development / 24-month direction','go:development','wide')}${btn('Ascend · whole-player routines','go:ascend','wide')}${btn('Peptide / PED evidence library','go:research','wide')}${btn('Back to Field','go:field','wide')}`;}

function preflightPage(){const p=C.plan(S,now());return `<div class="runner"><span class="eyebrow">Before working sets</span><h1>Earn the working load.</h1><p>Reported strength does not establish training experience or today’s movement quality. Warm up with a qualified coach before opening the runner.</p><ol><li>Use 5–8 minutes of easy, familiar movement; move through comfortable ranges.</li><li>Rehearse the day’s hinge/squat or press/row unloaded. Review stance, bracing and breathing with coach.</li><li>Use 2–4 short, progressively heavier practice sets of the main lift. Keep them easy; stop if technique, comfort or speed deteriorates.</li><li>Choose a load that leaves 3–4 good reps. Reduce the suggestion if warm-up quality requires it.</li></ol><p class="small">These are coaching starting steps, not a validated universal warm-up dose. If acceleration is available, do it after its field warm-up and before lower lifting. No sprints after the lower session.</p><form data-form="preflight">${input('supervisor','Coach / qualified supervisor present','text','','required')}${input('trainingMonths','Months of coached lifting (optional; unknown is okay)','number','','min="0" max="120"')}${check('familiar','Coach confirms these exercises and equipment are familiar and appropriate today')}${check('warmDone','Progressive warm-up completed; movement is comfortable and controlled')}${check('noNewPain','No new illness, focal pain or movement-changing pain since check-in')}<button class="primary wide">Confirm & open today’s session</button></form>${btn('Something hurts — stop','go:safety','danger wide')}${evidence('AAPFULL DESIGN')}</div>`;}

function workingLoad(exercise){const e=S.events.filter(e=>e.type==='working-load'&&e.payload.exercise===exercise).sort((a,b)=>Date.parse(b.ts)-Date.parse(a.ts))[0];return e&&C.live(C.fact(e.payload.lb,14,'reported','Coach working-load report',e.ts),now())?e.payload:null;}
function progressionPage(){return `<span class="eyebrow">Strength / quality before increments</span><h1>Progress with proof.</h1><p>In season, maintaining repeatable performance with manageable fatigue can be success. No automatic weekly increase, new max test or extra set.</p>${['bench','trap'].map(id=>{const r=C.strengthReview(S,id);return section(id==='bench'?'Bench working sets':'Trap-bar working sets',`<p>${r.message}</p><p class="small">${r.sessions} sessions logged. ${workingLoad(id)?'Current coach-reviewed load: '+workingLoad(id).lb+' lb.':'No current coach-reviewed working load recorded.'}</p>`)}).join('')}<form data-form="working-load">${select('workingExercise','Exercise',[['bench','Bench'],['trap','Trap bar']])}${input('workingLb','Coach-reviewed total working load, lb','number','','min="1" max="700" step="0.5" required')}${input('workingCoach','Coach who reviewed this exact working load','text','','required')}${area('workingReason','Why keep, reduce or change it? Equipment / handle notes')}<button class="primary wide">Save reported coach decision</button></form><p class="small">This is athlete-entered, expires after 14 days and does not update a max. Warm-up and stop rules still override it. Use the smallest appropriate change only if your coach selects it.</p>${details('Working-load decisions',history('working-load'))}${evidence('AAPFULL MAINT DESIGN')}`;}
function weeklySummary(){const since=C.add(day(),-6),es=S.events.filter(e=>e.payload.date>=since&&e.payload.date<=day()),loads=es.filter(e=>['practice','activity'].includes(e.type)&&e.payload.minutes>0),setDays=[...new Set(es.filter(e=>e.type==='set').map(e=>e.payload.date))],sleep=es.filter(e=>e.type==='readiness'),attempt=es.filter(e=>e.type==='mlb').reduce((n,e)=>n+e.payload.attempts,0),correct=es.filter(e=>e.type==='mlb').reduce((n,e)=>n+e.payload.correct,0);return {since,es,loads,setDays,sleep,attempt,correct,minutes:loads.reduce((n,e)=>n+e.payload.minutes,0),sleepMean:sleep.length?(sleep.reduce((n,e)=>n+e.payload.sleep,0)/sleep.length).toFixed(1):null};}
function reviewPage(){const w=weeklySummary(),c=currentCycle(),v=C.wellness(S,now());return `<span class="eyebrow">Weekly review / observed → next action</span><h1>Is the work transferring?</h1><div class="grid2"><div class="metric"><strong>${w.minutes}</strong><small>logged practice / extra activity minutes; unknown work excluded</small></div><div class="metric"><strong>${w.setDays.length}</strong><small>days with working sets</small></div></div><p>Sleep: ${w.sleepMean?w.sleepMean+' h average across '+w.sleep.length+' check-ins':'no observations'}. MLB: ${w.attempt?w.correct+'/'+w.attempt+' observed carrier IDs':'no observations'}. Different review conditions cannot prove improvement.</p>${v.review?'<div class="status"><b>Recovery conversation due</b><p>Repeated low appetite/energy or high stress was reported. Tell a parent and trainer; consider sports-dietitian/clinician review. This is not a REDs or burnout diagnosis.</p></div>':''}${details('Security evidence',ballTrend())}${details('Strength evidence',`<p>${C.strengthReview(S,'bench').message}</p><p>${C.strengthReview(S,'trap').message}</p>`)}<form data-form="cycle">${input('cycleFocus','One football correction','text',c?.focus||'Protect the ball through the finish','required')}${input('cycleMeasure','What observation would show progress?','text',c?.measure||'Same drill: record exposed-tip / elbow errors and ask your coach to observe','required')}${input('cycleSchool','One school / course / assignment action','text',c?.school||'Confirm current assignments and NCAA-approved course list with counselor','required')}${input('cycleQuestion','One question for coach','text',c?.question||'What is my assigned key, and did I identify possession before committing?','required')}${input('cycleReview','Review date','date',c?.reviewDate||C.add(day(),7),'required')}${area('cycleEvidence','What actually changed? Memory, film or coach basis')}${select('cycleDecision','Next decision',['keep focus','simplify / recover','ask coach to change focus'])}<button class="primary wide">Save next review cycle</button></form>${btn('Export coach brief · text file','coach-brief','wide')}${btn('College path & academics','go:college','wide')}<p class="small">No streaks, points for extra work or D1 probability. The review interval is an organization choice, not a training dose.</p>${details('Review history',history('cycle'))}${evidence('BURNOUT REDS DESIGN')}`;}
function collegePage(){const s=C.latest(S,'school-review')||{};return `<span class="eyebrow">College path / keep options open</span><h1>Build a record coaches can trust.</h1><p>Playing ability, game decisions, health, academics and verifiable film all matter. A gym total or an app score cannot guarantee an offer.</p>${section('Freshman actions',`<ol><li>Ask your school counselor to check each course against the NCAA-approved list. School GPA and NCAA core GPA differ.</li><li>Ask your position coach for your next observable role/skill standard.</li><li>Confirm whether game film exists; keep full-game context and accurate labels.</li><li>Review school work weekly and use teacher help early.</li><li>Plan wrestling/track transitions with coaches; do not stack their programs onto football automatically. Protect a weekly rest day and planned time away from each sport; the app does not prescribe a year-round football workload.</li></ol>`)}${details('Current NCAA reference · checked September 26, 2026',`<p>The current standard includes 16 approved core-course credits, 10 completed before the seventh semester (7 in English, math or science) and at least 2.3 core-course GPA, plus graduation and NCAA certification. This is a reference, not a transcript audit or admission/offer standard. Rules must be rechecked for your graduation class.</p>${evidence('NCAA')}`)}<form data-form="school-review">${input('schoolCourse','Course / academic question','text',s.course,'required')}${input('schoolPerson','Counselor / teacher contacted (if known)','text',s.person)}${select('schoolState','Status',['unknown / not asked','question prepared','contacted','answer received'],s.status)}${area('schoolAnswer','Actual answer / document reference',s.answer)}${input('schoolDue','Next follow-up date','date',s.due||C.add(day(),7),'required')}<button class="primary wide">Save school follow-up</button></form>${details('Academic follow-up history',history('school-review'))}<p>No GPA, eligibility certification or college interest is invented.</p>`;}

 if(f==='cycle'){const d=value('cycleReview');if(!C.validDate(d)||d<day()||C.days(day(),d)>14)throw Error('Choose a review date within the next 14 days');if(['cycleFocus','cycleMeasure','cycleSchool','cycleQuestion'].some(id=>!value(id).trim()))throw Error('Complete the focus, observation, school action and coach question');await log('cycle',{focus:value('cycleFocus'),measure:value('cycleMeasure'),school:value('cycleSchool'),question:value('cycleQuestion'),reviewDate:d,evidence:value('cycleEvidence'),decision:value('cycleDecision')},'cycle-'+day());return true;}

 return false;

function iqSelect(){const gs=window.D1PERF.field(iqData(),now()).series,g=iqGroup();return `<form data-form="intel-selection">${select('iqSeries','Exact measured setup',gs.length?gs.map(g=>[g.signature,g.setup.test+' / '+g.setup.method+' / '+g.setup.protocol]):[['','No complete measured setup']],g?.signature)}<div class="grid2">${select('iqWindow','Dates per comparison window',[3,4,5,6,8,10].map(n=>[String(n),n+' dates']),String(IQ.n))}${select('iqLag','Prior context window',[['1','1 day'],['3','3 days'],['7','7 days']],String(IQ.lag))}</div>${select('iqMetric','Context variable',[['sleep','Reported sleep hours'],['au','Reported session-RPE load']],IQ.metric)}<button class="wide">Apply analysis lens</button></form>`;}
function iqEmpty(reason){return `<div class="status"><b>Not enough evidence yet</b><p>${esc(reason)}</p><p class="small">Missing records stay unknown. Sample data is not mixed into your athlete record.</p></div>`;}
function iqTable(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
function iqSpark(points,label){if(points.length<2)return '';const values=points.map(x=>x.y),xs=points.map(x=>x.x),lo=Math.min(...values),hi=Math.max(...values),xmin=Math.min(...xs),xmax=Math.max(...xs),x=v=>32+(v-xmin)/(xmax-xmin||1)*270,y=v=>112-(v-lo)/(hi-lo||1)*76;return `<svg class="iq-chart" viewBox="0 0 330 156" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title><desc>${esc(points.map(p=>p.label+': '+p.y).join('; '))}. Axes span the observations.</desc><line x1="32" y1="112" x2="304" y2="112" stroke="var(--line)"/>${points.map(p=>`<circle cx="${x(p.x)}" cy="${y(p.y)}" r="4" fill="var(--blue)"><title>${esc(p.label)}: ${esc(p.y)}</title></circle>`).join('')}<text x="32" y="20" fill="var(--muted)" font-size="11">${iqNum(lo)}–${iqNum(hi)} · observed range</text><text x="32" y="143" fill="var(--muted)" font-size="11">${iqNum(xmin)} → ${iqNum(xmax)} · context values</text></svg>`;}
function intelligenceStrip(){return `<section class="iq-entry"><span class="eyebrow">ASCEND / Intelligence</span><h2>Find the signal.<br>Challenge the conclusion.</h2><p>Ten connected tools for performance, film and evidence.</p>${btn('Open ASCEND Intelligence →','go:intelligence','primary wide')}</section>`;}
function intelligencePage(){const I=intel(),mode=I.MODES.find(m=>m[0]===IQ.mode);return `<div class="between"><span class="eyebrow">ASCEND / Intelligence 01</span><span class="tag">LOCAL ANALYSIS</span></div><h1>${mode?esc(mode[1]):'Turn records<br>into better decisions.'}</h1><p>${mode?esc(mode[2]):'A connected performance laboratory. Inspect the evidence, test the assumptions, keep what survives.'}</p><p class="small">Transparent calculations from your records. No remote AI model, automated diagnosis or performance guarantee.</p>${['home','signal','transfer','response','dossier'].includes(IQ.mode)?btn(IQ.demo?'Return to my actual records':'Explore clearly labeled example data','intel-demo','wide'):''}${IQ.demo?'<div class="status"><b>SYNTHETIC EXAMPLE · not your results</b><p>Analysis only. No sample measurements are saved in your record, readiness or training decisions.</p></div>':''}${IQ.mode!=='home'?btn('← All ten tools','intel-mode:home','wide'):''}${IQ.mode==='home'?iqHome():`<div class="iq-workbench">${({signal:iqSignal,transfer:iqTransfer,mass:iqMass,scenarios:iqScenarios,response:iqResponse,evidence:iqEvidence,video:iqVideo,tactics:iqTactics,study:iqStudy,dossier:iqDossier}[IQ.mode])()}</div>`}${btn('Measured performance →','go:performance','wide')}`;}
function iqHome(){const a=intel().audit(S,now());return `<div class="iq-stats"><div><strong>${a.counts.fieldSetups}</strong><small>matched test setups</small></div><div><strong>${a.counts.strengthSetups}</strong><small>strength series</small></div><div><strong>10</strong><small>analysis tools</small></div></div>${a.issues.length?`<div class="status ${a.counts.activeSymptoms?'stop':''}"><b>Highest-priority uncertainty</b><p>${esc(a.issues[0].title)}</p><p class="small">${esc(a.issues[0].detail)}</p>${btn('Inspect the record','go:'+a.issues[0].route)}</div>`:'<div class="status"><b>No structural issue flagged</b><p>This is not proof of complete data, readiness or training effectiveness.</p></div>'}<div class="iq-tools">${intel().MODES.map((m,i)=>`<button data-act="intel-mode:${m[0]}" class="iq-tool"><span class="eyebrow">${String(i+1).padStart(2,'0')} / ${['OBSERVE','CONNECT','MODEL','COMPARE','INTERROGATE','TRACE','MEASURE','DECIDE','EXPERIMENT','REPRODUCE'][i]}</span><strong>${esc(m[1])}</strong><span>${esc(m[2])}</span><b aria-hidden="true">↗</b></button>`).join('')}</div>`;}
function iqSignal(){const g=iqGroup(),a=intel().signal(g,IQ.n);return `${iqSelect()}${a.ready?`${section('A trend that survives scrutiny',`<div class="iq-stats"><div><strong>${iqSigned(a.change,3)}</strong><small>${a.unit} median improvement</small></div><div><strong>${iqSigned(a.percent,1)}%</strong><small>observed change</small></div></div><div class="status"><b>${esc(a.direction)}</b><p>Remove any single session: ${iqSigned(a.low,3)} to ${iqSigned(a.high,3)} ${a.unit} improvement.</p></div><p>First-to-last day best: ${iqSigned(a.endpointChange,3)} ${a.unit}. ${a.endpointChange*a.change<0?'Endpoint and window-median directions disagree. Do not select only the favorable summary.':'Compare this with the median rather than cherry-picking a best day.'}</p>${iqTable(['Window','Date','Day best / trials'],[...a.baseline.map(d=>['Baseline',d]),...a.recent.map(d=>['Recent',d])].map(([l,d])=>`<tr><td>${l}</td><td>${d.date}</td><td>${d.result} ${a.unit} / ${d.trials}</td></tr>`))}<p class="small">${a.ignoredMiddle} middle date(s) excluded by the declared first/last-window rule. ${a.unequalTrials?'Attempt counts differ between dates. ':''}${a.duplicates?'Duplicate trial labels need review.':''}</p><p class="small">${esc(a.limits)}</p>`)}${btn('Trace strength and mass through these windows','intel-mode:transfer','wide')}`:iqEmpty(a.reason)}`;}
function iqTransfer(){const a=intel().transfer(iqData(),iqGroup(),IQ.n,now());return `${iqSelect()}${a.ready?`${section('Same period. Separate outcomes.',`<div class="iq-flow"><div>Training / mass records</div><span aria-hidden="true">↓</span><div>Repeatable strength</div><span aria-hidden="true">↓</span><div>Field performance</div></div><p class="small">Arrows are questions about transfer, not established causal links.</p><p>${a.bounds[0].join(' → ')} versus ${a.bounds[1].join(' → ')}.</p>${a.rows.map(r=>`<article class="iq-result"><h3>${esc(r.label)}</h3>${r.ready?`<strong>${iqNum(r.a.median,3)} → ${iqNum(r.b.median,3)} ${r.unit}</strong><p>${iqSigned(r.percent,1)}% ${r.label.startsWith('Reported bodyweight')?'mass change':'direction-adjusted change'} · ${r.a.days} / ${r.b.days} dates</p>`:`<p>Insufficient matched dates: ${r.a.days} / ${r.b.days}. At least two per window are needed to display a median comparison.</p>`}</article>`).join('')}<p class="small">${esc(a.limits)}</p>`)}${btn('Model mass versus relative strength','intel-mode:mass','wide')}`:iqEmpty(a.reason)}`;}
function iqMass(){return `<div class="status"><b>A transparent “what if,” not a growth forecast</b><p>Change hypothetical bodyweight and the same-rep lift. See exactly what the arithmetic requires.</p></div><form data-form="intel-mass"><div class="grid2">${input('iqWeight','Baseline bodyweight (lb)','number',IQ.mass?.weight,'min="40" max="600" step="0.1" required')}${input('iqLoad','Baseline same-rep load (lb)','number',IQ.mass?.load,'min="1" max="1500" step="0.1" required')}${input('iqNextWeight','Scenario bodyweight (lb)','number',IQ.mass?.nextWeight,'min="40" max="600" step="0.1" required')}${input('iqNextLoad','Scenario same-rep load (lb)','number',IQ.mass?.nextLoad,'min="1" max="1500" step="0.1" required')}</div><button class="primary wide">Calculate trade-off</button></form>${IQ.mass?section('What the scenario actually implies',`<div class="iq-stats"><div><strong>${iqNum(IQ.mass.requiredLoad,1)} lb</strong><small>same-rep load needed to preserve the starting ratio</small></div><div><strong>${iqSigned(IQ.mass.relativeChange,1)}%</strong><small>relative-strength change in this scenario</small></div></div><p>Load / bodyweight: ${iqNum(IQ.mass.baselineRatio,3)}× → ${iqNum(IQ.mass.scenarioRatio,3)}×.</p><p>Mass changes ${iqSigned(IQ.mass.weightChange,1)}%; the entered load changes ${iqSigned(IQ.mass.loadChange,1)}%.</p><p class="small">Formula: required load = baseline load × scenario bodyweight / baseline bodyweight.</p><p class="small">${esc(IQ.mass.limits)}</p>`):''}`;}
function iqScenarios(){const a=intel().scenarios(S,now());return `<p>Compare today’s proposed options using explicit assumptions. Team conflicts and activity holds are checked before a trade-off is shown.</p><form data-form="intel-scenario">${input('iqScenarioName','Name','text','','maxlength="80" required')}${select('iqKind','Type',['film','strength','speed','conditioning','wrestling','football','track','rest'])}<div class="grid2">${input('iqStart','Start today (Pacific time)','time','','required')}${input('iqMinutes','Planned minutes','number','','min="5" max="180" required')}${input('iqFatigue','Assumed fatigue cost (0–10)','number','','min="0" max="10" step="1" required')}${input('iqPriority','Fit with coach’s priority (0–10)','number','','min="0" max="10" step="1" required')}</div>${area('iqBasis','Where did these assumptions come from?')}<button class="primary wide">Compare this scenario</button></form>${section('Today’s comparison',a.rows.length?a.rows.map(r=>`<article class="iq-result"><h3>${esc(r.name||'Invalid scenario')}</h3><b>${r.invalid?'Excluded':r.issues.length?'Constraint review required':r.frontier?'On the stated Pareto frontier':'Dominated under the entered assumptions'}</b>${r.invalid?'':`<p>${esc(r.kind)} · ${esc(r.start)} · ${r.minutes} minutes · cost ${r.fatigue}/10 · priority ${r.priority}/10.</p><p class="small">${esc(r.basis)}</p>`}${r.issues.length?`<ul>${r.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="small">No recorded conflict found. This does not confer permission or prove the schedule is complete.</p>'}</article>`).join(''):'<p>No proposed scenarios today. Nothing is logged as completed work.</p>')}<p class="small">${esc(a.limits)}</p>`;}
function iqResponse(){const a=intel().response(iqData(),iqGroup(),IQ.lag,IQ.metric,now());return `${iqSelect()}${a.ready?section('Does the pattern survive basic challenges?',`<div class="iq-stats"><div><strong>${iqNum(a.r)}</strong><small>Pearson r</small></div><div><strong>${iqNum(a.adjusted)}</strong><small>r after removing linear calendar trend</small></div></div><p>Positive means higher ${IQ.metric==='sleep'?'sleep':'reported load'} coincided with better field results; running times are sign-reversed for this calculation.</p><p>Leave-one-pair-out r range: ${iqNum(a.low)} to ${iqNum(a.high)}. “Unknown” means there is insufficient variance after calculation.</p>${iqSpark(a.pairs.map(p=>({x:p.x,y:p.y,label:p.date})),'Context versus actual test result; lower running time is better')}`):iqEmpty(a.reason)}${a.pairs?.length?iqTable(['Test date','Prior context','Mean context','Field result'],a.pairs.map(p=>`<tr><td>${p.date}</td><td>${p.start} → ${p.end}</td><td>${iqNum(p.x)}</td><td>${p.y} ${a.unit}</td></tr>`)):''}${a.excluded?.length?details('Excluded dates and reasons',`<ul>${a.excluded.map(p=>`<li>${p.date}: ${esc(p.reason)}</li>`).join('')}</ul>`):''}<p class="small">${esc(a.limits||'A recorded field series is required. No response is predicted from a profile alone.')}</p>`;}
function iqEvidence(){const a=intel().evidence(IQ.compound,IQ.outcome);return `<form data-form="intel-evidence">${select('iqCompound','Exact intervention',D1RESEARCH.compounds.map(c=>[c.id,c.name]),IQ.compound)}${select('iqOutcome','Claimed outcome',D1RESEARCH.outcomes,IQ.outcome)}<button class="primary wide">Trace the claim</button></form>${section('Claim → study → actual endpoint',`<div class="status"><b>${esc(a.verdict)}</b><p>${esc(a.compound.translation)}</p></div><p><b>Mechanism:</b> ${esc(a.compound.path)}</p><p><b>Developmental gap:</b> ${esc(a.compound.pediatric)}</p><p><b>What would have to be established:</b> the exact intervention improving ${esc(a.label.toLowerCase())} in a relevant population, against a valid comparator, with adverse events and meaningful follow-up.</p>${a.trials.length?a.trials.map(t=>`<article class="iq-result"><span class="tag">${t.directEndpoint?'RELATED ENDPOINT MEASURED':'ENDPOINT / POPULATION BRIDGE REQUIRED'}</span><h3>${esc(t.name)}</h3><p><b>Who:</b> ${esc(t.population)}</p><p><b>Design:</b> ${esc(t.design)}</p><p><b>Measured:</b> ${esc(t.primary)}</p><p><b>Result:</b> ${esc(t.results)}</p><p><b>Not measured:</b> ${esc(t.notMeasured)}</p><p><b>Challenge:</b> ${esc(t.limits)}</p><p><b>Adverse events:</b> ${esc(t.safety)}</p>${t.source?`<a href="${esc(t.source.url)}" target="_blank" rel="noopener noreferrer">Primary source: ${esc(t.source.name)} ↗</a>`:''}</article>`).join(''):`<div class="status"><b>${esc(D1RESEARCH.NONE)}</b><p>No human trial extraction is attached to this exact compound in the curated library.</p></div>`}<p><b>Safety:</b> ${esc(a.compound.risk)}</p><p class="small">Evidence library last reviewed ${esc(a.sourceDate)}. This feature does not claim a fresh literature search.</p><p class="small">${esc(a.limits)}</p>`)}${btn('Open full compound audit','go:research','wide')}`;}
function iqVideo(){return `<p>Inspect existing footage and mark an interval. The player helps you review; timing calculations require independently verified frame numbers and frame rate.</p><label>Local video (not uploaded; reattach after reload)<input id="iqVideoFile" type="file" accept="video/*"></label>${IQ.media?`<p class="small">${esc(IQ.mediaName)}</p><video id="iqPlayer" controls playsinline preload="metadata" src="${esc(IQ.media)}"></video><div class="grid2">${btn('Back 0.1 s','intel-seek:-0.1')}${btn('Forward 0.1 s','intel-seek:0.1')}${btn('Half-speed playback','intel-rate:0.5')}${btn('Normal playback','intel-rate:1')}</div><p class="small">Seeking is approximate, not frame-accurate. Playback speed does not establish original recording frame rate.</p>${btn('Detach video','intel-detach','wide')}`:'<div class="status"><b>No local video attached</b><p>You can enter frame annotations from an editor that reports exact source-frame positions.</p></div>'}<form data-form="intel-video">${input('iqClip','Clip / interval label','text','','maxlength="120" required')}<div class="grid2">${input('iqFPS','Verified source frames/second','number','','min="1" max="480" step="any" required')}${input('iqFrameError','Uncertainty per landmark (frames)','number','1','min="0.5" max="10" step="0.5" required')}${input('iqFrameStart','Start frame','number','','min="0" step="1" required')}${input('iqFrameEnd','End frame','number','','min="1" step="1" required')}</div>${input('iqDistance','Independently calibrated distance (m), optional','number','','min="0.01" max="200" step="any"')}${area('iqVideoBasis','Landmarks, camera view, frame-rate verification and distance calibration')}${check('iqConstant','I verified constant source frame rate and the mapping to real elapsed time; this is not an unknown-speed or variable-rate clip.')}<button class="primary wide">Calculate and save annotation</button></form>${IQ.video?section('Interval with stated error',`<div class="iq-stats"><div><strong>${iqNum(IQ.video.seconds,4)} s</strong><small>frame difference / source FPS</small></div><div><strong>${iqNum(IQ.video.low,4)}–${iqNum(IQ.video.high,4)}</strong><small>seconds under entered landmark bounds</small></div></div>${IQ.video.speed===null?'':`<p>Segment-average speed ${iqNum(IQ.video.speed)} m/s; timing-only bounds ${iqNum(IQ.video.speedLow)}–${iqNum(IQ.video.speedHigh)} m/s. Not instantaneous maximum velocity.</p>`}<p class="small">${esc(IQ.video.limits)}</p>`):''}${details('Saved annotations (video bytes are not included)',history('intel-video'))}`;}
function iqCardForm(){return details('Build a coach-reviewed situation',`<p>Ask coach to prepare these before testing. If you author or already know the key, treat the result as rehearsal rather than unseen decision performance.</p><form data-form="intel-card">${select('iqCardSport','Sport',['football RB'])}${area('iqPrompt','Situation, visible cue and the decision being asked')}${input('iqA','Option A','text','','maxlength="180" required')}${input('iqB','Option B','text','','maxlength="180" required')}${input('iqC','Option C','text','','maxlength="180" required')}${select('iqAnswer','Coach-reviewed key',[[0,'A'],[1,'B'],[2,'C']])}${area('iqExplanation','Why this read fits the actual assignment')}${input('iqReviewer','Coach alias / review reference','text','','maxlength="120" required')}${check('iqReviewed','The answer and assignment were actually reviewed before this card was saved.')}<button class="wide">Save decision card</button></form>`);}
function iqChallenge(card,studyId=null,slot=null){if(!card)return iqEmpty('Create a coach-reviewed card to rehearse a decision.');const reveal=IQ.reveal?.target===card.id?IQ.reveal:null;return `<article class="iq-result"><span class="tag">${esc(card.payload.sport)}</span><h3>${esc(card.payload.prompt)}</h3>${reveal?`<div class="status ${reveal.correct?'good':''}"><b>${reveal.correct?'Matched the reviewed key':'Different from the reviewed key'}</b><p>Your choice: ${esc(card.payload.options[reveal.choice])}. Confidence: ${reveal.confidence}%.</p><p>Reviewed key: ${esc(card.payload.options[card.payload.answer])}</p><p>${esc(card.payload.explanation)}</p></div>`:`<form data-form="intel-attempt" data-target="${esc(card.id)}" data-study="${esc(studyId||'')}" data-slot="${slot??''}">${select('iqChoice','Commit your read',[['','Choose before revealing'],...card.payload.options.map((v,i)=>[i,v])])}${input('iqConfidence','Confidence your answer matches coach’s key (0–100%)','number','','min="0" max="100" step="1" required')}<button class="primary wide">Lock answer → reveal rationale</button></form>`}<p class="small">A saved answer cannot be edited here. Key agreement is not a reaction-time measure or proof of football decision improvement.</p></article>`;}
function iqTactics(){const a=intel().tactics(S,now()),reserved=new Set(intel().events(S,'intel-study',now()).flatMap(e=>e.payload.cardIds||[])),available=a.cards.filter(c=>!reserved.has(c.id)),card=available.find(c=>c.id===IQ.cardId)||available.find(c=>!a.attempts.some(e=>e.payload.target===c.id))||available[0];return `${section('Predict before the answer appears',`<p>Use a paused clip, diagram or coach’s situation. Commit your read and confidence, then compare the rationale.</p>${available.length?`<form data-form="intel-card-pick">${select('iqPick','Situation',available.map(c=>[c.id,c.payload.sport+' / '+c.payload.prompt.slice(0,70)]),card?.id)}<button class="wide">Open situation</button></form>`:''}${iqChallenge(card)}${reserved.size?'<p class="small">Cards reserved for a locked film study are only available through that study.</p>':''}`)}${section('Calibration, not a highlight reel',`<p>${a.first} distinct first answers. Key agreement: ${a.accuracy===null?'unknown':iqNum(a.accuracy*100,1)+'%'}. Mean squared confidence error: ${iqNum(a.brier,3)} (0 is best, 1 worst).</p>${iqTable(['Confidence bin','First answers','Actual key agreement'],a.bins.map(b=>`<tr><td>${b.lo}–${b.hi}%</td><td>${b.n}</td><td>${iqNum(b.accuracy,1)}${b.accuracy===null?'':'%'}</td></tr>`))}<p class="small">Only the first saved answer per unchanged card contributes. Small or authored card sets are not validated tests. Incorrect coach keys and unequal difficulty can distort the result.</p>`)}${iqCardForm()}${btn('Build a locked film-study comparison','intel-mode:study','wide')}`;}
function iqStudy(){const studies=intel().events(S,'intel-study',now()),current=studies.find(e=>e.id===IQ.studyId)||studies.at(-1),st=current?intel().studyState(S,current.id,now()):null,card=st?.next?intel().events(S,'intel-card',now()).find(c=>c.id===st.next.id):null;return `<div class="status"><b>A small, preregistered learning comparison</b><p>Eight unused coach-reviewed situations, two film routines, balanced A/B order. The question and scoring rule are locked before the first answer.</p><p class="small">This supports seated film learning only. It is not a drug, supplement, injury-rehab or physical-training experiment.</p></div>${studies.length?`<form data-form="intel-study-pick">${select('iqStudyPick','Locked study',studies.map(s=>[s.id,s.payload.question]),current.id)}<button class="wide">Open study</button></form>`:''}${st&&!st.invalid?`${section('Locked design',`<h3>${esc(current.payload.question)}</h3><p><b>A:</b> ${esc(current.payload.routines.A)}</p><p><b>B:</b> ${esc(current.payload.routines.B)}</p><p><b>Primary endpoint:</b> ${esc(current.payload.endpoint)}</p><p><b>Declared confounders:</b> ${esc(current.payload.confounds)}</p><p>Order: ${current.payload.schedule.join(' → ')}. Answers complete: ${st.slots.filter(x=>x.attempt).length}/8.</p>${IQ.reveal?.studyId===current.id?`${iqChallenge(intel().events(S,'intel-card',now()).find(c=>c.id===IQ.reveal.target))}${btn(st.complete?'Review final comparison':'Continue to the next assignment','intel-study-next','primary wide')}`:st.compromised?'<div class="status stop"><b>Comparison compromised</b><p>A card changed or was answered outside its assigned slot. Original records remain; no next assignment is generated.</p></div>':st.next?`<div class="status"><b>Next: routine ${st.next.arm}, situation ${st.next.i+1}/8</b><p>${esc(current.payload.routines[st.next.arm])}</p><p>Use similar review time and comparable source footage; record differences with coach.</p></div>${iqChallenge(card,current.id,st.next.i)}`:'<div class="status good"><b>All eight assigned answers recorded</b><p>Review the card-level record and confounders before interpreting any difference.</p></div>'}${iqTable(['Routine','Answers','Correct','Observed rate'],st.arms.map(a=>`<tr><td>${a.arm}</td><td>${a.n}/4</td><td>${a.correct}</td><td>${a.rate===null?'unknown':iqNum(a.rate*100,1)+'%'}</td></tr>`))}${details('Auditable assignment record',iqTable(['Slot','Routine','Record'],st.slots.map(x=>`<tr><td>${x.i+1}</td><td>${x.arm}</td><td>${x.changed?'Key changed':x.contaminated?'Outside-study answer':x.attempt?(x.attempt.payload.correct?'Matched key':'Different answer'):'Not recorded'}</td></tr>`)))}<p class="small">${esc(st.limits)}</p>`)}`:st?'<p>Imported study structure is invalid; original data is preserved.</p>':''}${details('Register a new comparison',`<form data-form="intel-study">${select('iqStudySport','Sport',['football RB'])}${input('iqQuestion','Question written before seeing results','text','','maxlength="500" required')}${area('iqConfounds','How will coach match difficulty? What else could explain a difference?')}${check('iqMatched','Eight unused cards have reviewed keys and comparable difficulty. I understand author familiarity limits the interpretation.')}<button class="primary wide">Lock question and balanced assignment</button></form>`)}${btn('Prepare coach-reviewed cards','intel-mode:tactics','wide')}`;}
function iqDossier(){const a=intel().audit(S,now());return `${iqSelect()}${section('What should be challenged next?',a.issues.length?a.issues.map((x,i)=>`<article class="iq-result"><span class="eyebrow">Review ${i+1}</span><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p>${btn('Inspect','go:'+x.route)}</article>`).join(''):'<p>No structural issue flagged. This does not establish complete information or meaningful improvement.</p>')}<p class="small">${esc(a.limits)}</p>${section('Reproducible analysis packet',`<p>The packet freezes the selected lens, calculations, excluded dates and the input records needed to reproduce them. It includes the algorithm version and a SHA-256 checksum.</p><div class="status"><b>Private records included</b><p>Performance, bodyweight, readiness and practice records can be sensitive. Download only when you intend to keep or review these records. The app does not send them to a coach or server.</p></div>${btn('Download analysis + source records','intel-dossier','primary wide')}<label>Verify an exported analysis packet locally<input id="iqVerifyFile" type="file" accept="application/json,.json"></label>${IQ.verification?`<div class="status"><b>${esc(IQ.verification)}</b></div>`:''}<p class="small">A matching checksum detects ordinary changes to the packet. It does not prove who recorded the data, establish truth, encrypt it or prevent a person from recomputing the checksum. Analysis packets are not full app backups.</p>`)}`;}

function rpLibrary(){const a=RP.active,m=a?.meta,card=replay().cards(S,now()).find(e=>e.id===RP.editorId&&e.payload.clip.id===m?.id)?.payload;const savedScan=m?rpEvents('replay-scan').filter(e=>e.payload.clipId===m.id&&e.payload.sha256===m.sha256).at(-1)?.payload:null,scan=RP.scan?.clipId===m?.id?RP.scan:savedScan;return `<p>Import a trimmed clip once. The original remains in this browser’s separate media vault, with a checksum and its own source ID. No footage is uploaded.</p><label>Save a local video clip (up to 50 MB)<input id="rpImport" type="file" accept="video/*"></label><div class="status"><b>Keep your original files</b><p>Standard athlete JSON backups contain coaching records, not video bytes. Clearing site data can erase the vault. Keep originals in Files/Photos and download individual clips before moving devices.</p>${btn('Request persistent browser storage','rp-persist','wide')}${RP.persistStatus?`<p class="small">${esc(RP.persistStatus)}</p>`:''}</div>${section('Saved footage',RP.clips.length?RP.clips.map(c=>`<article class="rp-clip"><div><b>${esc(c.label)}</b><small>${iqNum(c.duration,2)} s · ${rpMB(c.bytes)} · saved ${esc(C.date(c.createdAt))}</small><small>SHA-256 ${c.sha256.slice(0,12)}… · source identity, not verified game facts</small></div>${btn(m?.id===c.id?'Open':'Review','rp-open:'+c.id,m?.id===c.id?'selected':'')}</article>`).join(''):'<p>No clip saved in this workspace. Import your own footage to start.</p>')}${m?`${section('Find and annotate the moment',`<h3>${esc(m.label)}</h3><video id="rpVideoA" class="rp-video" controls muted playsinline preload="metadata" src="${esc(a.url)}"></video><p class="small">Player position: <output id="rpTime">0.000</output> s. Player positions are approximate; do not use them as gate-equivalent sprint timing.</p><div class="grid2">${btn('Step back 0.1 s','rp-step:-0.1')}${btn('Step forward 0.1 s','rp-step:0.1')}</div><form data-form="replay-scan"><div class="grid2">${input('rpScanStart','Scan from source time (s)','number',scan?.start??0,'min="0" step="0.01" required')}${input('rpScanEnd','Scan to (s), up to 20 s per scan','number',scan?.end??Math.min(20,m.duration),'min="0.1" step="0.01" required')}</div><button class="wide" ${RP.scanBusy?'disabled':''}>${RP.scanBusy?'Scanning source frames…':'Build image-change timeline'}</button></form><p class="small">Detects pixel changes, not players, ball carriers or technique faults. Camera movement, cuts and lighting can produce the same signal. Suggested moments require your review.</p>${scan?rpTimeline(scan):''}<form data-form="replay-card" data-context="${esc(m.id+'|'+m.sha256+'|'+(card?RP.editorId:'new'))}" data-clip="${esc(m.id)}" data-edit="${esc(card?RP.editorId:'')}"><h3>${card?'Revise this actual coaching key':'Turn this span into a reviewed decision'}</h3><div class="grid3">${input('rpStart','Context start (s)','number',card?.clip.start??0,'min="0" step="0.001" required')}${input('rpCue','Hide outcome at (s)','number',card?.clip.cue??'','min="0.1" step="0.001" required')}${input('rpEnd','Outcome end (s)','number',card?.clip.end??Math.min(10,m.duration),'min="0.2" step="0.001" required')}</div><div class="grid3">${btn('Mark start here','rp-mark:start')}${btn('Mark decision here','rp-mark:cue')}${btn('Mark end here','rp-mark:end')}</div>${select('rpSport','Actual coaching context',replay().SPORTS,card?.sport||'football LB')}${area('rpPrompt','What visible cue and decision does coach want you to read?',card?.prompt||'')}${input('rpA','Read A','text',card?.options[0]||'','maxlength="180" required')}${input('rpB','Read B','text',card?.options[1]||'','maxlength="180" required')}${input('rpC','Read C','text',card?.options[2]||'','maxlength="180" required')}${select('rpAnswer','Coach-reviewed key',[['0','A'],['1','B'],['2','C']],String(card?.answer??0))}${area('rpWhy','Coach’s explanation: why this key fits the actual assignment',card?.explanation||'')}${input('rpCoach','Coach alias / actual review reference','text',card?.reviewer||'','maxlength="120" required')}${check('rpConfirmed','The assignment and key were actually reviewed. Authored or already-known footage is rehearsal, not an unseen performance test.')}<button class="primary wide">${card?'Save revised key; preserve earlier answers':'Save source-linked coaching decision'}</button></form><p class="small">Changing a key or span excludes earlier answers from that card’s current score. Earlier events remain in the record/archive. It is not counted as athletic improvement.</p><div class="grid2">${btn('Download this original clip','rp-download:'+m.id)}${btn('Move clip to recoverable trash','rp-trash:'+m.id)}</div>`)}${section('Decisions from this exact source',replay().cards(S,now()).filter(e=>e.payload.clip.id===m.id).map(e=>`<article class="iq-result"><h3>${esc(e.payload.prompt)}</h3><p>${esc(e.payload.sport)} · context ${e.payload.clip.start} → decision ${e.payload.clip.cue} → outcome ${e.payload.clip.end} s.</p><div class="grid2">${btn('Prepare hidden-outcome practice','rp-practice:'+e.id)}${btn('Revise reviewed key','rp-edit:'+e.id)}</div></article>`).join('')||'<p>No reviewed decision linked to this source yet.</p>')}`:''}${RP.trash.length?details('Recoverable media trash',`<p>Bytes are retained, not permanently deleted. Trash still uses storage.</p>${RP.trash.map(c=>`<div class="rp-clip"><div><b>${esc(c.label)}</b><small>${rpMB(c.bytes)} retained</small></div>${btn('Restore','rp-restore:'+c.id)}</div>`).join('')}`):''}`;}
function rpTimeline(scan){const points=scan.points||[],peaks=replay().peaks(points);return `<div class="rp-timeline"><h3>Image-change map</h3><div class="rp-bars" role="img" aria-label="${esc(points.map(p=>iqNum(p.time,2)+' s: '+iqNum(p.energy,3)).join('; '))}">${points.map(p=>`<span style="height:${Math.max(3,(p.energy??0)*100)}%" title="${iqNum(p.time,2)} s · ${iqNum(p.energy,3)}"></span>`).join('')}</div><p class="small">${iqNum(scan.start)}–${iqNum(scan.end)} s; samples every 0.25 s at 96×54 pixels. Relative visual activity, not force, speed or reaction.</p>${peaks.length?`<p>Review these candidate moments:</p><div class="tabs">${peaks.map(p=>btn(iqNum(p.time,2)+' s','rp-seek:'+p.time)).join('')}</div>`:'<p>No strong image-change moment found under the stated display rule. This does not mean the athlete did not move.</p>'}</div>`;}
function rpCompare(){const a=RP.active,b=RP.second;if(!a)return `<p>Choose clip A from Footage first, then load a different clip B. Comparable angle, distance, effort and editing matter.</p>${btn('Choose footage','rp-view:library','wide')}`;const x=RP.compare;return `<p>Choose matching landmarks manually, then inspect repetitions side-by-side or as a transparent overlay. Audio is muted. Alignment is approximate—not a biomechanical or timing test.</p><div class="rp-pair"><div><h3>A · ${esc(a.meta.label)}</h3><video id="rpVideoA" class="rp-video" controls muted playsinline preload="metadata" src="${esc(a.url)}"></video></div>${b?`<div><h3>B · ${esc(b.meta.label)}</h3><video id="rpVideoB" class="rp-video" controls muted playsinline preload="metadata" src="${esc(b.url)}"></video></div>`:''}</div>${select('rpSecond','Clip B',RP.clips.filter(c=>c.id!==a.meta.id).map(c=>[c.id,c.label]),b?.meta.id)}${btn('Load selected clip B','rp-second','wide')}${b?`<form data-form="replay-compare" data-context="${esc(a.meta.id+'|'+b.meta.id)}"><div class="grid2">${input('rpAnchorA','A matching landmark (source seconds)','number',x?.anchorA??0,'min="0" step="0.001" required')}${input('rpAnchorB','B matching landmark (source seconds)','number',x?.anchorB??0,'min="0" step="0.001" required')}</div><div class="grid2">${btn('Use A’s current position','rp-anchor:A')}${btn('Use B’s current position','rp-anchor:B')}</div>${select('rpCompareMode','View',[['side-by-side','Side-by-side'],['ghost','Ghost overlay']],x?.mode||'side-by-side')}${select('rpCompareRate','Playback speed',[['0.25','Quarter speed'],['0.5','Half speed'],['1','Original playback speed']],String(x?.rate??.5))}${input('rpOpacity','Clip B opacity in overlay (0–1)','number',x?.opacity??.5,'min="0" max="1" step="0.05" required')}<button class="primary wide">Save alignment and prepare comparison</button></form>${x?`<div class="rp-canvas-pair ${x.mode==='ghost'?'rp-ghost':''}"><canvas id="rpCanvasA" width="384" height="216" role="img" aria-label="Aligned video ${x.mode==='ghost'?'overlay':'A'}"></canvas>${x.mode==='side-by-side'?'<canvas id="rpCanvasB" width="384" height="216" role="img" aria-label="Aligned video B"></canvas>':''}</div><p class="small" id="rpCompareStatus">Preparing source positions…</p><div class="grid2">${btn('Play aligned comparison','rp-compare-play','primary')}${btn('Pause both','rp-compare-pause')}</div><p class="small">${esc(x.limits)}</p>`:''}`:'<p>Load clip B to choose matching landmarks.</p>'}`;}
function rpQueue(x){return `<div class="iq-stats"><div><strong>${x.due}</strong><small>due with source available</small></div><div><strong>${x.firstAnswers}</strong><small>distinct first answers</small></div><div><strong>${x.firstAccuracy===null?'—':iqNum(x.firstAccuracy*100,0)+'%'}</strong><small>first-key agreement</small></div></div>${x.highConfidenceMisreads.length?`<div class="status"><b>Confidence needs a coaching check</b><p>${x.highConfidenceMisreads.length} latest high-confidence answer(s) differed from the reviewed key. Revisit the visible cue; high confidence is not evidence the assignment was correct.</p></div>`:''}${x.queue.length?x.queue.map(q=>`<article class="rp-queue-item"><span class="tag">${esc(q.card.payload.sport)} / ${q.due?'REVIEW AVAILABLE':'SCHEDULED'}</span><h3>${esc(q.card.payload.prompt)}</h3><p>${esc(q.reason)}</p><p class="small">${q.last?'First answer '+(q.first.payload.correct?'matched':'different')+'; latest '+(q.last.payload.correct?'matched':'different')+' · '+q.attempts+' answer(s). Next scheduled '+esc(C.date(q.dueAt))+'.':'No answer recorded. Key/rationale are hidden until commitment.'}</p>${q.sourceAvailable?btn(q.due?'Prepare this read':'Optional rehearsal before due date','rp-practice:'+q.card.id,'wide'): '<div class="status"><b>Original source missing or trashed</b><p>Restore the matching clip or reimport the exact original bytes. A different clip or memory answer is not substituted.</p></div>'}</article>`).join(''):'<p>Build one source-linked coaching decision from Footage. Its answer, confidence and exact clip identity drive this queue.</p>'}<p class="small">${esc(x.limits)}</p>${btn('Export private coaching discussion report','rp-report','wide')}`;}
function rpPractice(){const p=RP.practice,c=p?.card;if(!p||!c)return `<p>No clip decision prepared.</p>${btn('Open the review queue','rp-view:queue','wide')}`;const current=replay().cards(S,now()).find(x=>x.id===c.id);if(!current||replay().signature(current.payload)!==p.signature)return '<div class="status stop"><b>Coaching key changed</b><p>Reopen this decision from the queue. No answer is recorded against an outdated key.</p></div>';const done=p.result;return `<span class="tag">${esc(c.payload.sport)}</span><p>Watch the context. The canvas stops drawing before the selected outcome point. Make your read, then choose to see the continuation. All playback is muted.</p><video id="rpPracticeVideo" class="rp-source-hidden" muted playsinline preload="auto" src="${esc(p.media.url)}" aria-hidden="true" tabindex="-1"></video><canvas id="rpPracticeCanvas" width="384" height="216" role="img" aria-label="Source clip context before the coaching decision"></canvas><p id="rpPracticeStatus" class="status" role="status">${done?'Answer saved; outcome ready to review.':'Context prepared. Start when you are ready.'}</p>${done?`<div class="status ${done.correct?'good':''}"><b>${done.correct?'Matched the reviewed key':'A different read than the reviewed key'}</b><p>You chose ${esc(c.payload.options[done.choice])}, at ${done.confidence}% confidence.</p><p>Reviewed key: ${esc(c.payload.options[c.payload.answer])}</p><p>${esc(c.payload.explanation)}</p></div>${btn('Play the outcome continuation','rp-outcome','primary wide')}${btn('Back to the automatically updated review queue','rp-view:queue','wide')}`:`${btn('Play context → hide outcome','rp-context','primary wide')}<div id="rpDecision" hidden><h3>${esc(c.payload.prompt)}</h3><form data-form="replay-attempt" data-target="${esc(c.id)}" data-signature="${esc(p.signature)}">${select('rpChoice','Commit your read',[['','Choose before seeing the continuation'],...c.payload.options.map((v,i)=>[String(i),v])])}${input('rpConfidence','Confidence your read matches coach’s key (0–100%)','number','','min="0" max="100" required')}<button class="primary wide">Save read → reveal coaching key</button></form></div>`}<p class="small">Source span ${c.payload.clip.start} → ${c.payload.clip.cue} → ${c.payload.clip.end} s. Familiar/authored footage is rehearsal. Browser presentation and manually selected cues are not a validated blinded test. No reaction-time metric is collected.</p>`;}
function rpStop(){if(RP.raf)cancelAnimationFrame(RP.raf);RP.raf=0;if(RP.frameId&&RP.frameVideo?.cancelVideoFrameCallback)RP.frameVideo.cancelVideoFrameCallback(RP.frameId);RP.frameId=0;RP.frameVideo=null;for(const v of RP.players)try{v.pause();}catch{}RP.players=[];if(RP.practice&&!RP.practice.result)RP.practice.stage='ready';if(RP.compare)RP.compare.playing=false;}
function rpDraw(video,canvas,alpha=1,clear=true){if(!canvas||video.readyState<2)return;const ctx=canvas.getContext('2d');if(clear){ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);}const scale=Math.min(canvas.width/video.videoWidth,canvas.height/video.videoHeight),w=video.videoWidth*scale,h=video.videoHeight*scale;ctx.globalAlpha=alpha;ctx.drawImage(video,(canvas.width-w)/2,(canvas.height-h)/2,w,h);ctx.globalAlpha=1;}
function rpReady(v){return new Promise((resolve,reject)=>{if(v.readyState>=2&&Number.isFinite(v.duration))return resolve();let timer=setTimeout(()=>finish(Error('Video did not decode. Try a browser-supported MP4/WebM source.')),8000);const ready=()=>{if(v.readyState>=2&&Number.isFinite(v.duration))finish();},error=()=>finish(Error('This browser cannot decode the source video'));function finish(e){clearTimeout(timer);v.removeEventListener('loadeddata',ready);v.removeEventListener('error',error);e?reject(e):resolve();}v.addEventListener('loadeddata',ready);v.addEventListener('error',error);v.load();});}
function rpSeek(v,time){return new Promise((resolve,reject)=>{if(!Number.isFinite(v.duration)||time<0||time>v.duration)throw Error('Source time outside decoded clip');if(Math.abs(v.currentTime-time)<.0001&&!v.seeking)return resolve();let timer=setTimeout(()=>finish(Error('Seeking timed out; source position not confirmed')),4000);const seek=()=>finish(),error=()=>finish(Error('Source seeking failed'));function finish(e){clearTimeout(timer);v.removeEventListener('seeked',seek);v.removeEventListener('error',error);e?reject(e):resolve();}v.addEventListener('seeked',seek,{once:true});v.addEventListener('error',error,{once:true});v.currentTime=time;});}
async function rpAttach(id,slot='active'){const result=await vault().read(id,WORKSPACE.id);const prior=RP[slot];if(prior?.url)URL.revokeObjectURL(prior.url);RP[slot]={...result,url:URL.createObjectURL(result.blob)};RP.compare=null;RP.scan=null;RP.editorId='';return RP[slot];}
function replayMount(){rpStop();const generation=++RP.mount;if(page!=='replay')return;const videos=[...document.querySelectorAll('#rpVideoA,#rpVideoB,#rpPracticeVideo')];RP.players=videos;for(const v of videos){v.muted=true;v.addEventListener('error',()=>message('Source video could not be decoded. Keep the original and use a supported browser format.'));}const a=$('rpVideoA');if(a)a.addEventListener('timeupdate',()=>{const o=$('rpTime');if(o)o.textContent=iqNum(a.currentTime,3);});if(RP.view==='practice'&&RP.practice){const p=RP.practice,v=$('rpPracticeVideo');rpReady(v).then(()=>rpSeek(v,p.card.payload.clip.start)).then(()=>{if(generation!==RP.mount)return;rpDraw(v,$('rpPracticeCanvas'));p.stage=p.result?'answered':'ready';}).catch(e=>{if(generation===RP.mount)message(e.message);});}if(RP.view==='compare'&&RP.compare&&RP.second){const b=$('rpVideoB'),x=RP.compare;x.ready=false;Promise.all([rpReady(a),rpReady(b)]).then(()=>Promise.all([rpSeek(a,x.anchorA),rpSeek(b,x.anchorB)])).then(()=>{if(generation!==RP.mount)return;x.ready=true;rpPaintComparison();$('rpCompareStatus').textContent='Aligned to entered landmarks. Ready; timing remains approximate.';}).catch(e=>{if(generation===RP.mount)message(e.message);});}}
function rpPaintComparison(){const a=$('rpVideoA'),b=$('rpVideoB'),x=RP.compare;if(!a||!b||!x)return;rpDraw(a,$('rpCanvasA'));if(x.mode==='ghost')rpDraw(b,$('rpCanvasA'),x.opacity,false);else rpDraw(b,$('rpCanvasB'));}
async function rpScan(start,end){const a=RP.active,v=$('rpVideoA');if(!a||!v)throw Error('Open a source clip first');if(!Number.isFinite(start)||!Number.isFinite(end)||start<0||end> a.meta.duration||end<=start||end-start>20)throw Error('Choose a valid source interval of at most 20 seconds');await rpReady(v);const generation=RP.mount;v.pause();const original=v.currentTime,canvas=document.createElement('canvas');canvas.width=96;canvas.height=54;const ctx=canvas.getContext('2d',{willReadFrequently:true}),points=[];let previous=null;RP.scanBusy=true;try{for(let i=0;i<=Math.floor((end-start)/.25);i++){if(generation!==RP.mount||page!=='replay')throw Error('Scan interrupted by navigation. No scan was saved.');const time=Math.min(end-.001,start+i*.25);await rpSeek(v,time);ctx.drawImage(v,0,0,96,54);const current=ctx.getImageData(0,0,96,54).data;points.push({time,energy:previous?replay().energy(previous,current):null});previous=new Uint8ClampedArray(current);}await rpSeek(v,original);const scan={clipId:a.meta.id,sha256:a.meta.sha256,start,end,interval:.25,width:96,height:54,points,algorithm:'mean absolute RGB difference / 255; image activity only'};await log('replay-scan',scan,crypto.randomUUID());RP.scan=scan;}finally{RP.scanBusy=false;}}
function rpFrameLoop(v,handler){const generation=RP.mount;function frame(_,metadata){if(generation!==RP.mount||v.paused)return;const more=handler(metadata?.mediaTime??v.currentTime);if(!more)return;if(v.requestVideoFrameCallback){RP.frameVideo=v;RP.frameId=v.requestVideoFrameCallback(frame);}else RP.raf=requestAnimationFrame(frame);}if(v.requestVideoFrameCallback){RP.frameVideo=v;RP.frameId=v.requestVideoFrameCallback(frame);}else RP.raf=requestAnimationFrame(frame);}
async function replaySubmit(form){const type=form.dataset.form;if(!type.startsWith('replay-'))return false;
  if(type==='replay-scan')await rpScan(num('rpScanStart'),num('rpScanEnd'));
  else if(type==='replay-card'){if(!RP.active||form.dataset.clip!==RP.active.meta.id)throw Error('Source clip changed. Reopen the editor.');const current=await vault().read(RP.active.meta.id,WORKSPACE.id),payload=replay().card({sport:value('rpSport'),prompt:value('rpPrompt'),a:value('rpA'),b:value('rpB'),c:value('rpC'),answer:Number(value('rpAnswer')),explanation:value('rpWhy'),reviewer:value('rpCoach'),reviewed:checked('rpConfirmed'),start:num('rpStart'),cue:num('rpCue'),end:num('rpEnd')},current.meta);if(form.dataset.edit&&!replay().cards(S,now()).some(c=>c.id===form.dataset.edit&&c.payload.clip.id===current.meta.id))throw Error('Card to revise is unavailable');await log('replay-card',payload,form.dataset.edit?form.dataset.edit.slice('replay-card-'.length):crypto.randomUUID());RP.editorId='';}
  else if(type==='replay-compare'){if(!RP.active||!RP.second||value('rpSecond')!==RP.second.meta.id)throw Error('Load the selected clip B before aligning');const x=replay().alignment({anchorA:num('rpAnchorA'),anchorB:num('rpAnchorB'),rate:Number(value('rpCompareRate')),opacity:num('rpOpacity'),mode:value('rpCompareMode')},RP.active.meta,RP.second.meta);await log('replay-alignment',{...x,clipA:RP.active.meta.id,shaA:RP.active.meta.sha256,clipB:RP.second.meta.id,shaB:RP.second.meta.sha256},crypto.randomUUID());RP.compare=x;}
  else if(type==='replay-attempt'){const p=RP.practice;if(!p||p.stage!=='decision'||p.card.id!==form.dataset.target||p.signature!==form.dataset.signature||value('rpChoice')==='')throw Error('Watch the context and commit a read against this current key');const original=await vault().read(p.card.payload.clip.id,WORKSPACE.id),result=replay().attempt(S,{target:p.card.id,signature:p.signature,choice:Number(value('rpChoice')),confidence:num('rpConfidence'),cueReached:true},original.meta,now());await log('replay-attempt',result,crypto.randomUUID());p.result=result;p.stage='answered';}
  else return false;render(false);return true;
}
