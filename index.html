function preflightPage(){const p=C.plan(S,now());return `<div class="runner"><span class="eyebrow">Before working sets</span><h1>Earn the working load.</h1><p>Reported strength does not establish training experience or today’s movement quality. Warm up with a qualified coach before opening the runner.</p><ol><li>Use 5–8 minutes of easy, familiar movement; move through comfortable ranges.</li><li>Rehearse the day’s hinge/squat or press/row unloaded. Review stance, bracing and breathing with coach.</li><li>Use 2–4 short, progressively heavier practice sets of the main lift. Keep them easy; stop if technique, comfort or speed deteriorates.</li><li>Choose a load that leaves 3–4 good reps. Reduce the suggestion if warm-up quality requires it.</li></ol><p class="small">These are coaching starting steps, not a validated universal warm-up dose. If acceleration is available, do it after its field warm-up and before lower lifting. No sprints after the lower session.</p><form data-form="preflight">${input('supervisor','Coach / qualified supervisor present','text','','required')}${input('trainingMonths','Months of coached lifting (optional; unknown is okay)','number','','min="0" max="120"')}${check('familiar','Coach confirms these exercises and equipment are familiar and appropriate today')}${check('warmDone','Progressive warm-up completed; movement is comfortable and controlled')}${check('noNewPain','No new illness, focal pain or movement-changing pain since check-in')}<button class="primary wide">Confirm & open ${p.code==='lower'?'lower':'upper'} session</button></form>${btn('Something hurts — stop','go:safety','danger wide')}${evidence('AAPFULL DESIGN')}</div>`;}
function activityPage(){return `<span class="eyebrow">One recovery budget</span><h1>Count all the work.</h1><p>PE, another team, pickup, running and lifting outside D1OS still matter. Record actual work; do not duplicate a practice already logged.</p><form data-form="activity">${select('activityKind','Activity',['PE','extra lifting','pickup / other sport','conditioning','wrestling','track','other'])}${input('activityDate','When it happened (Pacific date)','date',day(),'required')}${input('activityTime','Start time (Pacific)','time','12:00','required')}<div class="grid2">${input('activityMinutes','Minutes','number','','min="1" max="360" required')}${select('activityRpe','Session effort',Array.from({length:10},(_,i)=>String(i+1)),'5')}</div>${select('activityContact','Contact',['none','light','heavy','unknown'])}${area('activityNote','What did you do? How did it feel?')}<button class="primary wide">Save actual activity</button></form>${history('activity')}${evidence('AAPFULL BURNOUT DESIGN')}`;}
function workingLoad(exercise){const e=S.events.filter(e=>e.type==='working-load'&&e.payload.exercise===exercise).sort((a,b)=>Date.parse(b.ts)-Date.parse(a.ts))[0];return e&&C.live(C.fact(e.payload.lb,14,'reported','Coach working-load report',e.ts),now())?e.payload:null;}
function progressionPage(){return `<span class="eyebrow">Strength / quality before increments</span><h1>Progress with proof.</h1><p>In season, maintaining repeatable performance with manageable fatigue can be success. No automatic weekly increase, new max test or extra set.</p>${['bench','trap'].map(id=>{const r=C.strengthReview(S,id);return section(id==='bench'?'Bench working sets':'Trap-bar working sets',`<p>${r.message}</p><p class="small">${r.sessions} sessions logged. ${workingLoad(id)?'Current coach-reviewed load: '+workingLoad(id).lb+' lb.':'No current coach-reviewed working load recorded.'}</p>`)}).join('')}<form data-form="working-load">${select('workingExercise','Exercise',[['bench','Bench'],['trap','Trap bar']])}${input('workingLb','Coach-reviewed total working load, lb','number','','min="1" max="700" step="0.5" required')}${input('workingCoach','Coach who reviewed this exact working load','text','','required')}${area('workingReason','Why keep, reduce or change it? Equipment / handle notes')}<button class="primary wide">Save reported coach decision</button></form><p class="small">This is athlete-entered, expires after 14 days and does not update a max. Warm-up and stop rules still override it. Use the smallest appropriate change only if your coach selects it.</p>${details('Working-load decisions',history('working-load'))}${evidence('AAPFULL MAINT DESIGN')}`;}
function weeklySummary(){const since=C.add(day(),-6),es=S.events.filter(e=>e.payload.date>=since&&e.payload.date<=day()),loads=es.filter(e=>['practice','activity'].includes(e.type)&&e.payload.minutes>0),setDays=[...new Set(es.filter(e=>e.type==='set').map(e=>e.payload.date))],sleep=es.filter(e=>e.type==='readiness'),attempt=es.filter(e=>e.type==='mlb').reduce((n,e)=>n+e.payload.attempts,0),correct=es.filter(e=>e.type==='mlb').reduce((n,e)=>n+e.payload.correct,0);return {since,es,loads,setDays,sleep,attempt,correct,minutes:loads.reduce((n,e)=>n+e.payload.minutes,0),sleepMean:sleep.length?(sleep.reduce((n,e)=>n+e.payload.sleep,0)/sleep.length).toFixed(1):null};}
function reviewPage(){const w=weeklySummary(),c=currentCycle(),v=C.wellness(S,now());return `<span class="eyebrow">Weekly review / observed → next action</span><h1>Is the work transferring?</h1><div class="grid2"><div class="metric"><strong>${w.minutes}</strong><small>logged practice / extra activity minutes; unknown work excluded</small></div><div class="metric"><strong>${w.setDays.length}</strong><small>days with working sets</small></div></div><p>Sleep: ${w.sleepMean?w.sleepMean+' h average across '+w.sleep.length+' check-ins':'no observations'}. MLB: ${w.attempt?w.correct+'/'+w.attempt+' observed carrier IDs':'no observations'}. Different review conditions cannot prove improvement.</p>${v.review?'<div class="status"><b>Recovery conversation due</b><p>Repeated low appetite/energy or high stress was reported. Tell a parent and trainer; consider sports-dietitian/clinician review. This is not a REDs or burnout diagnosis.</p></div>':''}${details('Security evidence',ballTrend())}${details('Strength evidence',`<p>${C.strengthReview(S,'bench').message}</p><p>${C.strengthReview(S,'trap').message}</p>`)}<form data-form="cycle">${input('cycleFocus','One football correction','text',c?.focus||'Protect the ball through the finish','required')}${input('cycleMeasure','What observation would show progress?','text',c?.measure||'Same drill: record exposed-tip / elbow errors and ask Diaz to observe','required')}${input('cycleSchool','One school / course / assignment action','text',c?.school||'Confirm current assignments and NCAA-approved course list with counselor','required')}${input('cycleQuestion','One question for coach','text',c?.question||'What is my assigned key, and did I identify possession before committing?','required')}${input('cycleReview','Review date','date',c?.reviewDate||C.add(day(),7),'required')}${area('cycleEvidence','What actually changed? Memory, film or coach basis')}${select('cycleDecision','Next decision',['keep focus','simplify / recover','ask coach to change focus'])}<button class="primary wide">Save next review cycle</button></form>${btn('Export coach brief · text file','coach-brief','wide')}${btn('College path & academics','go:college','wide')}<p class="small">No streaks, points for extra work or D1 probability. The review interval is an organization choice, not a training dose.</p>${details('Review history',history('cycle'))}${evidence('BURNOUT REDS DESIGN')}`;}
function collegePage(){const s=C.latest(S,'school-review')||{};return `<span class="eyebrow">College path / keep options open</span><h1>Build a record coaches can trust.</h1><p>Playing ability, game decisions, health, academics and verifiable film all matter. A gym total or an app score cannot guarantee an offer.</p>${section('Freshman actions',`<ol><li>Ask Basic’s counselor to check each course against the NCAA-approved list. School GPA and NCAA core GPA differ.</li><li>Ask your position coach for your next observable role/skill standard.</li><li>Confirm whether game film exists; keep full-game context and accurate labels.</li><li>Review school work weekly and use teacher help early.</li><li>Plan wrestling/track transitions with coaches; do not stack their programs onto football automatically. Protect a weekly rest day and planned time away from each sport; the app does not prescribe a year-round football workload.</li></ol>`)}${details('Current NCAA reference · checked September 26, 2026',`<p>The current standard includes 16 approved core-course credits, 10 completed before the seventh semester (7 in English, math or science) and at least 2.3 core-course GPA, plus graduation and NCAA certification. This is a reference, not a transcript audit or admission/offer standard. Rules must be rechecked for your graduation class.</p>${evidence('NCAA')}`)}<form data-form="school-review">${input('schoolCourse','Course / academic question','text',s.course,'required')}${input('schoolPerson','Counselor / teacher contacted (if known)','text',s.person)}${select('schoolState','Status',['unknown / not asked','question prepared','contacted','answer received'],s.status)}${area('schoolAnswer','Actual answer / document reference',s.answer)}${input('schoolDue','Next follow-up date','date',s.due||C.add(day(),7),'required')}<button class="primary wide">Save school follow-up</button></form>${details('Academic follow-up history',history('school-review'))}<p>No GPA, eligibility certification or college interest is invented.</p>`;}
function fuelAuditNote(){const n=C.nutrition(S,now()),v=C.wellness(S,now());return `<div class="status"><b>Growth needs food even on rest days.</b><p>Regular meals and snacks come before calorie tracking. Persistent fatigue, low appetite, recurrent illness/injury or unexpected weight loss deserve a parent/trainer conversation; they do not establish a diagnosis.</p>${v.review?'<p><b>Repeated recovery concerns were logged this week.</b> Ask for help reviewing food access, stress and recovery.</p>':''}${n.intakeMean?'<p class="small">Logged complete-day intake average: '+n.intakeMean+' kcal across '+n.foodDays+' dates. Reporting error and water/growth changes limit interpretation.</p>':''}${n.proposedFoodAddition?'<p>Stable weight plus adequate log coverage suggests discussing a small familiar snack (roughly 150 kcal) with your parent/dietitian. No automatic calorie change has been applied.</p>':''}</div>${evidence('REDS NUTRITION DESIGN')}`;}
function coachBrief(){const w=weeklySummary(),p=C.plan(S,now()),c=currentCycle();return ['D1OS 14.1 — Zayden — '+day(),'Athlete-entered report, not independently verified.','NEXT GAME: '+(p.game?p.game.opponent+' / '+p.game.kickoff:'unknown'),'CURRENT DECISION: '+C.titles[p.code]+' '+p.reason,'LOAD: '+w.minutes+' logged practice/extra-activity minutes; '+w.setDays.length+' working-set days. Missing work is unknown.','SLEEP: '+(w.sleepMean||'unknown')+' hours average; '+w.sleep.length+' reports.','FOCUS: '+(c?.focus||'Ball security; first steps; carrier recognition'),'OBSERVATION: '+(c?.measure||'No review cycle saved'),'RB: '+development().ball,'MLB: '+development().read,'COACH QUESTION: '+(c?.question||'Which movement, dose and key should I use this week?'),'SCHOOL: '+(c?.school||'Course/assignment review not recorded'),'SYMPTOM HOLD: '+(C.activeSymptoms(S,now()).length?'Yes — follow professional directions':'No unresolved record; not medical clearance'),'Strength, timing and film remain reported unless separately documented. No D1 outcome prediction.'].join('\n\n');}
async function journeySubmit(form){const f=form.dataset.form;
 if(f==='preflight'){if(!checked('familiar')||!checked('warmDone')||!checked('noNewPain')||value('supervisor').trim().length<2)throw Error('Complete the actual supervised warm-up; do not check an untrue answer');const p=C.plan(S,now());if(!p.allowed)throw Error('Training window closed. Review Today.');await log('preflight',{kind:p.code,coach:value('supervisor'),months:num('trainingMonths'),familiar:true,warm:true},'preflight-'+day()+'-'+p.code);page='train';render();$('sessionMode').value=requestedSessionMode;await action('start-session');return true;}
 if(f==='activity'){const occurredAt=C.zoned(value('activityDate'),value('activityTime'));if(Date.parse(occurredAt)>Date.now())throw Error('Log actual past/current activity, not future work');await log('activity',{kind:value('activityKind'),date:value('activityDate'),occurredAt,minutes:bounded('activityMinutes',1,360),rpe:bounded('activityRpe',1,10),contact:value('activityContact'),note:value('activityNote')});return true;}
 if(f==='working-load'){const lb=bounded('workingLb',1,700);if(value('workingCoach').trim().length<2)throw Error('Name the coach who reviewed the amount');await log('working-load',{exercise:value('workingExercise'),lb,coach:value('workingCoach'),reason:value('workingReason')});return true;}
 if(f==='day-close'){if(!value('nextAction').trim())throw Error('Name one useful next action');await log('day-close',{win:value('dayWin'),friction:value('dayFriction'),next:value('nextAction')},'day-close-'+day());return true;}
 if(f==='cycle'){const d=value('cycleReview');if(!C.validDate(d)||d<day()||C.days(day(),d)>14)throw Error('Choose a review date within the next 14 days');if(['cycleFocus','cycleMeasure','cycleSchool','cycleQuestion'].some(id=>!value(id).trim()))throw Error('Complete the focus, observation, school action and coach question');await log('cycle',{focus:value('cycleFocus'),measure:value('cycleMeasure'),school:value('cycleSchool'),question:value('cycleQuestion'),reviewDate:d,evidence:value('cycleEvidence'),decision:value('cycleDecision')},'cycle-'+day());return true;}
 if(f==='school-review'){if(!value('schoolCourse').trim()||!C.validDate(value('schoolDue')))throw Error('Enter the question and follow-up date');await log('school-review',{course:value('schoolCourse'),person:value('schoolPerson'),status:value('schoolState'),answer:value('schoolAnswer'),due:value('schoolDue')});return true;}
 return false;
}

</script><script>
'use strict';
const C=window.D1,K='d1os_v14',BK=K+'_snapshot',J=K+'_journal';
let S=C.seed(),page='today',tab='ball',notice='',storage='checking',db=null,imported=null,rawCopies={},pending=null,busy=false,runner=null,restUntil=0,timer=null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date(),day=()=>C.date(now()),value=id=>$(id)?.value??'',num=id=>value(id)===''?null:Number(value(id)),checked=id=>!!$(id)?.checked;
const btn=(t,a,cls='')=>`<button type="button" class="${cls}" data-act="${a}">${t}</button>`;
const input=(id,label,type='text',v='',extra='')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(v??'')}" ${extra}></label>`;
const select=(id,label,opts,v='')=>`<label>${label}<select id="${id}">${opts.map(o=>{const [k,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
const area=(id,label,v='')=>`<label>${label}<textarea id="${id}" maxlength="2000">${esc(v)}</textarea></label>`;
const check=(id,label,on=false)=>`<label class="check"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${label}</span></label>`;
const section=(title,body,kicker='')=>`<section class="section">${kicker?`<div class="eyebrow">${kicker}</div>`:''}<h2>${title}</h2>${body}</section>`;
const details=(title,body,open=false)=>`<details ${open?'open':''}><summary>${title}</summary>${body}</details>`;
const evidence=(ids='DESIGN')=>`<div class="source">${ids.split(/\s+/).filter(id=>CONTENT.sources.some(s=>s[0]===id)).map(id=>`<button class="link" data-act="source:${id}">${id} ↗</button>`).join('')}<div>Exact app doses and decision cutoffs are coaching choices unless stated otherwise.</div></div>`;
const history=(type,filter=()=>true)=>{const x=S.events.filter(e=>e.type===type&&filter(e)).sort((a,b)=>b.ts.localeCompare(a.ts));return x.length?x.slice(0,12).map(e=>`<div class="history"><b>${esc(e.payload.date)}</b><p>${esc(Object.entries(e.payload).filter(([k])=>k!=='date').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · '))}</p></div>`).join(''):'<p class="muted">No entries yet. Nothing has been inferred.</p>';};
function message(text){notice=text;$('toast').textContent=text;}
function download(name,data,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);}
function exportData(panic=false){if(panic){for(const key of [K,BK,J,'d1os_v13','d1os_v13_snapshot','d1os_v7']){try{const raw=localStorage.getItem(key);if(raw)rawCopies[key]=raw;}catch{}}}download(`d1os-${panic?'recovery':'record'}-${day()}.json`,JSON.stringify(panic?{app:'D1OS recovery',state:S,pending,rawCopies}:S,null,2));message('Download requested. Check Files / Downloads before deleting or replacing anything.');}
function readStored(raw,key){let parsed=JSON.parse(raw);const older=key==='d1os_v7'||key.startsWith('legacy:');if(older){if(!parsed||!Number.isInteger(parsed.v)||!parsed.profile||!Array.isArray(parsed.events)||!Array.isArray(parsed.lifts))throw Error('Unrecognized older record');parsed={app:'d1os',v:parsed.v,data:parsed};}const state=C.migrate(parsed);if(older)state.archives=[{id:'legacy-bytes-'+C.hash(raw),raw,source:key,reason:'Older app history preserved verbatim; not mapped into current charts or recommendations.'}];return state;}
function legacyRead(){return new Promise(resolve=>{if(!window.indexedDB)return resolve({});let settled=false,connection;const found={},finish=()=>{if(settled)return;settled=true;if(connection)connection.close();resolve(found);};let req;try{req=indexedDB.open('d1os-mirror');}catch{return finish();}req.onupgradeneeded=()=>req.transaction.abort();req.onerror=finish;req.onblocked=finish;req.onsuccess=()=>{connection=req.result;if(settled){connection.close();return;}if(!connection.objectStoreNames.contains('kv'))return finish();try{const tx=connection.transaction('kv','readonly');for(const key of ['state','snap:last-known-good']){const read=tx.objectStore('kv').get(key);read.onsuccess=()=>{if(typeof read.result==='string')found['legacy:'+key]=read.result;};}tx.oncomplete=finish;tx.onerror=finish;tx.onabort=finish;}catch{finish();}};setTimeout(finish,1500);});}
function dbOpen(){return new Promise(resolve=>{if(!window.indexedDB)return resolve(null);let done=false;const finish=x=>{if(!done){done=true;resolve(x);}};const r=indexedDB.open('d1os-v14',1);r.onupgradeneeded=()=>r.result.createObjectStore('records');r.onsuccess=()=>finish(r.result);r.onerror=()=>finish(null);setTimeout(()=>finish(null),1500);});}
function dbRead(){return new Promise(resolve=>{if(!db)return resolve(null);const r=db.transaction('records').objectStore('records').get(K);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);setTimeout(()=>resolve(null),1500);});}
function dbWrite(raw){return new Promise(resolve=>{if(!db)return resolve(false);try{const t=db.transaction('records','readwrite');t.objectStore('records').put(raw,K);t.oncomplete=async()=>resolve((await dbRead())===raw);t.onerror=()=>resolve(false);setTimeout(()=>resolve(false),1500);}catch{resolve(false);}});}
async function save(next){C.validate(next);if(storage==='recovery')throw Error('Original damaged records preserved. Export recovery data before restoring a valid backup.');pending=next;
 try{const existing=localStorage.getItem(K);if(existing){try{const live=C.validate(JSON.parse(existing));if(live.meta?.updated!==S.meta?.updated||C.canon(live)!==C.canon(S))next=C.merge(next,live);}catch(e){rawCopies[K]=existing;next.archives=C.union(next.archives,[{id:'unreadable-'+C.hash(existing),raw:existing,reason:'Unreadable storage bytes retained during recovery'}]);}}const raw=JSON.stringify(next);localStorage.setItem(J,raw);if(localStorage.getItem(J)!==raw)throw Error('Journal read-back failed');const prior=localStorage.getItem(K);if(prior){localStorage.setItem(BK,prior);if(localStorage.getItem(BK)!==prior)throw Error('Snapshot read-back failed');}localStorage.setItem(K,raw);if(localStorage.getItem(K)!==raw)throw Error('Primary read-back failed');S=next;pending=null;storage='local';const mirror=await dbWrite(raw);if(mirror)storage='mirrored';localStorage.removeItem(J);message('Saved on this device'+(mirror?' · secondary copy checked.':'. Export a backup regularly.'));}
 catch(e){S=next;pending=next;storage='unsaved';message('Save failed: '+e.message+'. Your pending entry is in Panic export.');throw e;}
 render(false);
}
async function log(type,payload,slot=''){await save(C.event(S,type,payload,now(),slot));}
async function init(){db=await dbOpen();let candidates=[],hadRaw=false;try{for(const k of [K,J,BK,'d1os_v13','d1os_v13_snapshot','d1os_v7']){const raw=localStorage.getItem(k);if(raw)rawCopies[k]=raw;}Object.assign(rawCopies,await legacyRead());const mirror=await dbRead();if(mirror)rawCopies.indexedDB=mirror;const damaged=[];for(const [key,raw]of Object.entries(rawCopies)){hadRaw=true;try{candidates.push(readStored(raw,key));}catch{damaged.push({id:'unreadable-'+C.hash(raw),raw,source:key,reason:'Unreadable storage bytes retained during recovery'});}}if(candidates.length){S=candidates.reduce((a,b)=>C.merge(a,b));S.archives=C.union(S.archives,damaged);storage='local';await save(S);}else if(hadRaw){storage='recovery';notice='No readable saved copy. Originals preserved; use Panic export and import a valid backup.';}else{storage='local';await save(S);}}
 catch(e){storage='unsaved';notice='Local saving unavailable. You can explore and export; do not rely on persistence.';}
 if(storage==='mirrored'||storage==='local')notice=S.archives.some(x=>x.reason?.startsWith('Older app'))?'Older app history preserved in your export archive; it is not yet mapped into current charts.':'';render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>{if($('offline'))$('offline').textContent='Offline cache ready';}).catch(()=>{if($('offline'))$('offline').textContent='Single-file core · cache unavailable';});}
}
function headerState(){const red=C.activeSymptoms(S,now()).length;return (red?`<div class="status stop"><b>Activity hold</b> · Unresolved symptom. ${btn('Open safety','go:safety','danger')}</div>`:'')+(['unsaved','recovery'].includes(storage)?`<div class="status"><b>${storage==='unsaved'?'Saving unavailable':'Recovery mode'}</b><p>Export before closing this page.</p>${btn('Panic export','panic')}</div>`:'');}
function fixtureBlock(){const g=C.nextGame(S,now());return `<div class="next"><div><span class="eyebrow">Next confirmed game · reported</span><strong>${esc(g?.opponent||'Schedule unknown')}</strong><small>${g?new Date(g.kickoff).toLocaleString('en-US',{timeZone:C.TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT':'Confirm next game or bye in Path.'}</small></div><div class="count">${g?Math.max(0,C.days(day(),C.date(g.kickoff))):'—'}<small>days out</small></div></div>`;}
function fuelAction(){const p=C.plan(S,now()),hour=Number(new Intl.DateTimeFormat('en-US',{timeZone:C.TZ,hour:'numeric',hourCycle:'h23'}).format(now()));if(p.code==='game'&&p.hours>0&&p.hours<=4)return 'Pregame: familiar carb-rich meal 3–4 hours before kickoff; small snack closer if tolerated.';if(p.code==='game'&&p.hours<=0)return 'Follow the team timetable; after play, have carbohydrate + protein and check symptoms.';if(hour<9)return 'Breakfast: oats or toast, eggs/yogurt, fruit and water.';if(hour<14)return 'Lunch: rice or potatoes + meat/eggs + fruit; include milk/yogurt if tolerated.';if(p.practice&&hour<16)return 'Before practice: familiar bagel or banana; bring fluid and your trainer’s hydration plan.';if(hour<20)return 'Recovery meal: carbohydrate + protein, fluid and ordinary salted food.';return 'Prepare breakfast and give yourself an 8–10-hour sleep opportunity.';}
function development(){
 if(!C.live(S.facts.priorities,now()))return {ball:'Coach priorities expired. Reconfirm the current correction in Path → Facts.',read:'Reconfirm your assigned key with the LB coach; old instructions are not current.',film:'Ask for the current film or memory-review question.'};
 const recent=S.events.filter(e=>['ball','mlb','film'].includes(e.type)).sort((a,b)=>b.ts.localeCompare(a.ts));
 const ball=recent.find(e=>e.type==='ball'&&e.payload.errors>0)?.payload;
 const film=recent.find(e=>e.type==='film'&&e.payload.cue)?.payload;
 const mlb=recent.find(e=>e.type==='mlb')?.payload;
 return {ball:ball?ball.error+' → '+(ball.coach||'repeat the same drill at controlled speed and ask Diaz to check it'):'Five-point check → second hand before traffic → stay secure through the finish',read:mlb?`${mlb.correct}/${mlb.attempts} carrier IDs · ${mlb.cue||'repeat the uncertain exchange with coach'}`:'Five exchanges: identify carrier before the first committed step',film:film?.cue||'Ask whether film exists; use a memory-based review until confirmed.'};
}
function todayPage(){const p=C.plan(S,now()),r=C.latest(S,'readiness',day()),practice=C.latest(S,'practice',day()),dev=development();return `<div class="between"><span class="eyebrow">${new Date().toLocaleDateString('en-US',{timeZone:C.TZ,weekday:'long',month:'short',day:'numeric'})}</span><span class="tag">BASIC / 2030</span></div>${fixtureBlock()}<section class="command"><div class="between"><span class="signal">${p.readiness==='unknown'?'CHECK-IN NEEDED':p.readiness.toUpperCase()+' READINESS'}</span><span class="small">RB + MLB</span></div><h1>${C.titles[p.code]}</h1><p>${esc(p.reason)}</p><div class="small">${p.practice?'Team: '+esc(S.facts.practice.value.start)+'–'+esc(S.facts.practice.value.end)+' · '+S.facts.practice.value.minutes+' min planned':'No team practice scheduled today'} · ${p.allowed?'Optional gym window open':'Extra gym: held'}</div><div class="brief"><b>Priority:</b> ${esc(dev.ball)}<br><b>Next fuel:</b> ${fuelAction()}</div>${btn(r?'Open today’s work →':'Check in →',r?'go:execution':'go:checkin','primary wide')}${details('Why this decision?',`<p>${p.notes.map(esc).join(' ')||'The engine uses kickoff time, practice schedule, recent load and today’s check-in.'}</p>${evidence('YOUTH MAINT TAPER DESIGN')}`)}</section>${executionStrip()}<div class="rows"><div class="row"><div><span class="eyebrow">01 / Coach Diaz</span><b>Protect the ball through the finish</b><small>${esc(dev.ball)}</small></div>${btn('RB →','tab:ball')}</div><div class="row"><div><span class="eyebrow">02 / Speed</span><b>${p.sprint?'Fresh acceleration window':'First three steps'}</b><small>${p.sprint?'4 × 10 yd; full recovery; coach-approved.':'Review mechanics. Tired running is conditioning.'}</small></div>${btn('Go →','tab:speed')}</div><div class="row"><div><span class="eyebrow">03 / MLB</span><b>Confirm the carrier before committing</b><small>${esc(dev.read)}</small></div>${btn('MLB →','tab:mlb')}</div><div class="row"><div><span class="eyebrow">Next fuel / recovery action</span><b>${fuelAction()}</b><small>Sleep: ${r?r.sleep+' h reported':'not logged'} · Practice cost: ${practice?practice.minutes*practice.rpe+' AU reported':'unknown, not zero'}</small></div></div></div>${btn('Food, sleep & hydration →','go:fuel','wide')}${btn('Game week & last-game review →','tab:game','wide')}${details('What the app knows',`<p>Current reported weight: ${esc(S.facts.weight.value)} lb; lifts: ${esc(S.facts.bench.value)} / ${esc(S.facts.squat.value)} / ${esc(S.facts.trap.value)} lb. Freshness and sources are shown in Train. Eligibility: athlete reports cleared/participating. Film and defensive terminology remain unknown.</p>${btn('Review all current facts','go:path','wide')}`)}`;}
function checkinPage(){const r=C.latest(S,'readiness',day())||{};return `<span class="eyebrow">Before extra work / today only</span><h1>How are you arriving?</h1><p>Honest answers change the plan. A score never clears an injury. Recurring pain in one joint, bone, heel or tendon deserves attention even if you can still play; distinguish this from general muscle soreness.</p><form data-form="checkin">${input('sleep','Hours actually asleep','number',r.sleep,'min="0" max="24" step="0.25" required inputmode="decimal"')}<div class="grid2">${select('fresh','Body freshness',[['','Choose'],['1','1 · exhausted / sore'],['2','2 · low'],['3','3 · okay'],['4','4 · good'],['5','5 · fresh']],String(r.fresh||''))}${select('energy','Energy',[['','Choose'],['1','1 · drained'],['2','2 · low'],['3','3 · okay'],['4','4 · good'],['5','5 · high']],String(r.energy||''))}</div>${select('pain','New injury, recurring focal pain, or pain changing movement?',[['','Choose'],['no','No'],['yes','Yes — hold activity']],r.pain)}${check('supervised','Qualified supervision and safe equipment available for optional lifting',r.supervised)}${select('speedIncluded','Has recent team work already included hard acceleration?',[['unknown','Unknown — don’t add sprints'],['yes','Yes — do not duplicate'],['no','No — ask coach about this window']],r.speedIncluded)}${select('illness','Fever, vomiting/diarrhea or feeling ill?',[['','Choose'],['no','No'],['yes','Yes — tell parent / trainer']],r.illness)}${select('appetite','Recent appetite',['unknown','usual','low'],r.appetite||'unknown')}${select('stress','School / sport stress',['unknown','manageable','high'],r.stress||'unknown')}${check('extraLoadReviewed','All extra sport, PE and workouts in the last 48 hours are logged (or none occurred)',r.extraLoadReviewed)}${btn('Log extra activity first','go:activity','wide')}<button class="primary wide">Save check-in →</button></form>${btn('New symptom / urgent concern','go:safety','danger wide')}${evidence('SLEEP AAPFULL BURNOUT DESIGN')}`;}
function weekly(){return `<div class="week">${Array.from({length:7},(_,i)=>{let d=C.add(day(),i),p=C.plan(S,i===0?now():C.zoned(d,'10:00'),true);return `<div><b>${new Date(d+'T12:00Z').toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'})}<small>${d.slice(5)}</small></b><div><strong>${C.titles[p.code]}</strong><small>${p.practice?'Team '+esc(S.facts.practice.value.start)+'–'+esc(S.facts.practice.value.end):'No team practice scheduled'}${p.allowed?' · conditional on that day’s recovery':''}</small></div></div>`}).join('')}</div>`;}
function stats(){return `<div class="grid2">${[['weight','Bodyweight','lb'],['bench','Bench','lb'],['squat','Back squat','lb'],['trap','Trap bar','lb']].map(([id,label,u])=>{const f=S.facts[id],ratio=id!=='weight'&&f?.value&&S.facts.weight.value?(f.value/S.facts.weight.value).toFixed(2):null;return `<div class="metric"><small>${label}</small><strong>${esc(f?.value??'—')} ${u}</strong><small>${esc(C.status(f,now()))}${ratio?' · '+ratio+'× BW':''}</small></div>`}).join('')}</div><p class="small">Self-comparison only. Lift reps, depth/handle protocol and independent verification are unknown. “Easy” does not raise a max.</p>`;}
function trainPage(){const p=C.plan(S,now());return `<span class="eyebrow">Training / shared recovery budget</span><h1>Keep strength.<br>Protect game day.</h1><div class="status"><b>${C.titles[p.code]}</b><p>${esc(p.reason)} ${p.notes.map(esc).join(' ')}</p></div><div class="grid2">${btn('Check readiness','go:checkin')}${btn('Log practice','go:practice')}</div>${btn('Log PE / extra sport / outside workout','go:activity','wide')}${btn('Working-load review & progression','go:progression','wide')}${section('Your next seven days',weekly()+'<p class="small">Forecast windows are conditional. Moved games regenerate this list; symptoms always override it.</p>'+btn('Edit schedule','go:schedule','wide'))}${section('Weight room',`<p>Saturday upper; Sunday early lower if recovered. One main lower lift. No default Mon–Wed gym.</p>${select('sessionMode','Session version',[['standard','Standard · about 30 min'],['short','20-minute version'],['brutal','Practice was brutal · recovery'],['none','No equipment · controlled bodyweight']])}${btn('Open session runner →','start-session','primary wide')}${btn('Preview exercises & loads','go:session-preview','wide')}${details('Load rules',`<p>2–3 sets, 3–4 reps in reserve. Suggested starting loads use 65–70% of reported bests; these are not tested 1RM percentages. Warm up from light loads. No grinders or failure. Short version removes sets, not rest. The weekend split is conditional, not proof that consecutive lifting days are ideal. Protect a full rest day; review a consolidated session with coach if weekends repeatedly leave you sore for Monday.</p>${evidence('YOUTH MAINT DESIGN')}`)}`)}${section('Your numbers',stats()+btn('Log bodyweight / strength →','go:numbers','wide')+btn('Repeatable field tests →','go:tests','wide'))}${section('Recovery',`<p>Sleep, food and actual practice logs outrank the gym plan. Red readiness suppresses extra work.</p>${btn('Fuel & body trend','go:fuel','wide')}${btn('Safety / stop a movement','go:safety','danger wide')}`)}`;}
function practicePage(){const old=C.latest(S,'practice',day())||{},pr=S.facts.practice.value;return `<span class="eyebrow">Actual load / not guessed</span><h1>What did practice cost?</h1><form data-form="practice">${input('minutes','Actual duration, minutes','number',old.minutes??pr.minutes,'min="0" max="360" required')}${select('rpe','Whole-session effort (0–10)',Array.from({length:11},(_,i)=>[String(i),`${i}${i===0?' · rest':i===10?' · maximal':''}`]),String(old.rpe??5))}<div class="grid2">${select('contact','Contact',['none','light','heavy','unknown'],old.contact||'unknown')}${select('legs','Leg fatigue',['easy','normal','brutal','unknown'],old.legs||'unknown')}</div>${check('missed','I missed practice (duration becomes zero)',old.missed)}${area('coach','Coach instruction / reason for missing',old.coach)}<button class="primary wide">Save practice load →</button></form><p class="small">Duration × RPE is an arbitrary-unit estimate. Heavy contact, brutal legs or RPE ≥8 holds extra work for 48 hours. That cutoff is conservative, not a physiological diagnosis.</p>${history('practice')}${evidence('LOAD DESIGN')}`;}
function fieldPage(){return `<span class="eyebrow">Field / Coach Diaz’s priorities</span><h1>Carry. Accelerate.<br>Read the ball.</h1><div class="tabs">${[['ball','RB'],['speed','Speed'],['mlb','MLB'],['film','Film'],['game','Game week']].map(([k,l])=>btn(l,'tab:'+k,k===tab?'selected':'')).join('')}</div>${({ball:ballPage,speed:speedPage,mlb:mlbPage,film:filmPage,game:gamePage}[tab])()}`;}
function ballPage(){const since=C.add(day(),-6),logs=S.events.filter(e=>e.type==='ball'&&e.payload.date>=since&&e.payload.date<=day()),reps=logs.reduce((a,e)=>a+e.payload.reps,0),errors=logs.reduce((a,e)=>a+e.payload.errors,0);return `<div class="status"><b>Ball security is priority one.</b><p>Coach Diaz’s correction → carry checks → error log → film question → next practice.</p></div><div class="grid3"><div class="metric"><strong>${reps}</strong><small>reps / last 7 days</small></div><div class="metric"><strong>${errors}</strong><small>observed errors</small></div><div class="metric"><strong>${reps?Math.round(100*(reps-errors)/reps)+'%':'—'}</strong><small>secure reps · reported</small></div></div><p class="small">Compare the same drill and setting. This is not a game fumble rate.</p>${CONTENT.drills.map((d,i)=>details(`${i+1}. ${d.name}`,`<span class="tag">${d.level==='solo'?'No-contact solo':'Coach-led only'}</span><h3>${d.dose}</h3><p>${d.cue}</p><p class="small">${d.why}</p>${btn('Log this drill →','drill:'+d.id,'wide')}`,i===0)).join('')}${section('Record the quality',`<form data-form="ball">${select('drill','Drill',CONTENT.drills.map(d=>[d.id,d.name]))}<div class="grid2">${input('reps','Actual reps','number',20,'min="1" max="200" required')}${input('errors','Reps with an error','number',0,'min="0" max="200" required')}</div>${select('errorType','Main error',CONTENT.errors)}${select('setting','Setting',['solo','team practice','coach session','game'])}${input('filmLink','Film link or timestamp (optional)')}${area('feedback','Coach feedback / next cue')}${check('coachPresent','For a coach-led drill: coach supervised this progression')}<button class="primary wide">Save security work</button></form>`)}${details('Trend and next correction',ballTrend()+history('ball'))}${evidence('CONTACT DESIGN')}`;}
function ballTrend(){
 const wk=offset=>S.events.filter(e=>e.type==='ball'&&C.days(e.payload.date,day())>=offset&&C.days(e.payload.date,day())<offset+7);
 const summarize=a=>({reps:a.reduce((n,e)=>n+e.payload.reps,0),errors:a.reduce((n,e)=>n+e.payload.errors,0)});
 let html='<p><b>Next correction:</b> '+esc(development().ball)+'</p><table><tr><th>Drill</th><th>Prior week</th><th>This week</th></tr>';
 for(const d of CONTENT.drills){let a=summarize(wk(7).filter(e=>e.payload.drill===d.id)),b=summarize(wk(0).filter(e=>e.payload.drill===d.id));html+='<tr><td>'+d.name+'</td><td>'+a.errors+' / '+a.reps+'</td><td>'+b.errors+' / '+b.reps+'</td></tr>';}
 return html+'</table><p class="small">Errors / observed repetitions. Compare only similar supervision and setting; small samples are noisy. A saved actual-rep entry marks completion; planned reps do not count.</p>';
}
function speedPage(){const p=C.plan(S,now());return `<div class="status"><b>${p.sprint?'Acceleration window available':'Max-intent acceleration held'}</b><p>${p.sprint?'Warm up, confirm with coach, then 4 × 10 yards with 2–3 minutes recovery. End when quality drops.':'No extra max sprints unless the lower window, freshness and logged exposure agree. Already-logged sprints, extra sport or today’s lower lifting hold another dose.'}</p></div>${section('First three steps',`<ol><li>Balanced split start. Push the ground back; move your whole body forward without folding at the waist.</li><li>Let shin/body angles support projection. No universal angle target; review side video with coach.</li><li>Step down and back without reaching far ahead. Keep arms rhythmic and let posture rise naturally.</li><li>Prepare ankles with easy marches and progressive warm-up runs. No forced toe-running or new hard plyometrics.</li></ol>${details('Exact dose and progression',`<p>8–10 minutes progressive warm-up. Optional mechanics: 2 × 5 controlled wall marches per side. Fresh acceleration: 4 × 10 yards, 2–3 minutes between reps. Stop for pain, slipping, strained mechanics or slower quality. No sprint finisher.</p><p>A coach can later select 20-yard acceleration or an off-season flying segment after tolerance is established. No new fly dose is assigned this game week.</p>${evidence('SPEED DESIGN')}`)}`)}<form data-form="exposure">${select('exposure','Exposure type',['mechanics','max-intent acceleration','high-speed exposure','conditioning','game exposure','practice exposure'])}${input('sprintReps','Repetitions','number','','min="0" max="100" required')}${input('distance','Distance per repetition, yards','number','','min="0" max="200" required')}${input('rest','Rest per rep, seconds','number','','min="0" max="900" required')}${area('speedNote','Quality / coach cue')}<button class="primary wide">Log exposure</button></form>${btn('Test 10 / 20 / 40 yd & jumps →','go:tests','wide')}${details('Exposure history — separate categories',history('exposure'))}`;}

function filmPage(){const f=S.facts.film;return `<div class="status"><b>Film: ${f.value?esc(f.value):'unknown / maybe'}</b><p>No video is attached or fetched. Links open only when you choose; no athlete data is transmitted by the app.</p></div><form data-form="film"><div class="grid2">${select('reviewBasis','Evidence',['memory','coach feedback','film confirmed'])}${select('topic','Focus',['ball security','carrier identification','acceleration','loose-ball recovery'])}</div>${input('reviewLink','Link / timestamp (optional)')}${area('observed','What actually happened?')}${area('nextCue','One next-practice correction')}<button class="primary wide">Save play review</button></form>${details('Questions that work with or without film',`<ul><li>Security: where was the tip at first contact? When did the second hand arrive? Was the whistle/down ruling known?</li><li>MLB: what was the assigned key? Who had the ball at the mesh? When did your first committed step happen?</li><li>Speed: was the first step productive or a false step? Was the view good enough to judge?</li><li>Recovery: did you secure the loose ball on the ground? Leave yards and official credit unknown.</li></ul>`)}${details('Review history',history('film'))}${btn('Update film availability','go:facts','wide')}`;}

into practice',`<p>${esc(development().ball)}</p><p>${esc(development().read)}</p><p>Film cue: ${esc(development().film)}</p>`)}`)}${evidence('FOOD DESIGN')}`;}
function exerciseList(kind,mode='standard'){const f=S.facts,load=(id,pct)=>workingLoad(id)?.lb??(C.live(f[id],now())?Math.floor(f[id].value*pct/5)*5:null);const upper=[{id:'bench',name:'Bench press',sets:3,reps:5,load:load('bench',.70),pct:workingLoad('bench')?'Reported coach working load':'70% of reported best',rest:150,structures:'Pectorals, triceps, anterior deltoid',why:'Maintain pressing strength with low fatigue.',sub:'Push-up (equipment only)',tempo:'Controlled lowering; smooth press. Spotter and safeties.'},{id:'row',name:'Chest-supported row',sets:2,reps:8,load:null,pct:null,rest:90,structures:'Upper back, elbow flexors',why:'Balance pressing and train controlled shoulder movement.',sub:'Band row',tempo:'No swinging; pause briefly at top.'},{id:'deadbug',name:'Dead bug',sets:2,reps:6,load:0,rest:60,structures:'Trunk control',why:'Control ribs/pelvis with normal breathing.',sub:'Supine heel slide',tempo:'Slow alternating reps, each side.'}];
const lower=[{id:'trap',name:'Trap-bar deadlift',sets:2,reps:4,load:load('trap',.65),pct:workingLoad('trap')?'Reported coach working load':'65% of reported best',rest:180,structures:'Hip/knee extensors, trunk',why:'One primary lower lift maintains force exposure without doubling heavy patterns.',sub:'Bodyweight split squat',tempo:'Controlled lowering; stand smoothly. Confirm bar weight / handle height.'},{id:'split',name:'Bodyweight split squat',sets:2,reps:6,load:0,rest:90,structures:'Quadriceps, gluteals, hip control',why:'Small controlled single-leg dose; skip if unfamiliar.',sub:'Supported sit-to-stand',tempo:'Controlled, each side; no forced range.'},{id:'calf',name:'Calf raise',sets:2,reps:10,load:0,rest:60,structures:'Calf–Achilles complex',why:'A small familiar ankle-strength dose.',sub:'Seated unloaded calf raise',tempo:'Controlled rise/lower; no bouncing.'}];let a=kind==='lower'?lower:upper;if(mode==='short')a=a.slice(0,2).map(e=>({...e,sets:2}));if(mode==='none')a=a.slice(0,2).map(e=>({...e,id:e.id+'-sub',name:e.sub,load:0,pct:null,sets:2,reps:6}));return a;}
function sessionPreview(){const sq=S.facts.squat,squatLoad=C.live(sq,now())?`${Math.floor(sq.value*.65/5)*5} lb (65% of reported ${esc(sq.value)} lb, rounded down)`:'no calculated load: reconfirm squat data first';return `<span class="eyebrow">Training plan / preview only</span><h1>Enough stimulus.<br>Room to recover.</h1><p>The runner opens only in a suitable window after today’s check-in. Preview is always available.</p>${['upper','lower'].map(k=>section(k==='upper'?'Upper maintenance':'Lower maintenance',exerciseList(k).map(e=>`<div class="row"><div><b>${e.name}</b><small>${e.sets} × ${e.reps} · ${e.load===null?'choose light familiar load':e.load===0?'bodyweight':e.load+' lb suggested'} · 3–4 RIR · ${e.rest}s rest</small><small>${e.why}</small></div></div>`).join('')+(k==='lower'?`<p class="small">A coach may substitute squat 2 × 4, starting near ${squatLoad}, instead of trap bar. Never add both as main lifts here.</p>`:''))) }${evidence('YOUTH MAINT DESIGN')}`;}
function runnerPage(){if(!runner)return sessionPreview();const e=runner.sets[runner.index];if(!e)return `<h1>Session complete.</h1><p>${runner.sets.length} sets recorded. Eat, recover and review how the work felt. No bonus conditioning.</p>${btn('Return to Train','go:train','primary wide')}`;const last=S.events.filter(x=>x.type==='set'&&x.payload.exercise===e.id).sort((a,b)=>b.ts.localeCompare(a.ts))[0]?.payload;return `<div class="runner"><div class="between"><span class="eyebrow">${runner.kind} / ${runner.mode}</span><span class="tag">${runner.index+1} / ${runner.sets.length}</span></div><div class="progress"><span style="width:${100*runner.index/runner.sets.length}%"></span></div><h1>${esc(e.name)}</h1><p>${e.reps} reps${e.id==='split'||e.id==='deadbug'?' each side':''} · 3–4 reps in reserve</p><div class="load">${e.load===null?'Choose light':e.load===0?'Bodyweight':e.load}<small>${e.load?' lb':''}</small></div><div class="small">${e.pct||'Use familiar, pain-free technique'} · ${e.rest}s rest</div><form data-form="set"><div class="grid2">${input('setLoad','Actual total load, lb','number',e.load??'','min="0" max="1000" step="0.5" required')}${input('setReps','Actual reps','number',e.reps,'min="0" max="50" required')}</div><div class="grid2">${select('rir','Reps left in reserve',['0','1','2','3','4','5+'],'3')}<div><p class="small">Rest after this set</p><b>${e.rest} seconds</b></div></div>${select('setTechnique','Technique quality',['unknown','steady','deteriorated'],'unknown')}<button class="primary wide">Complete this set →</button>${details('Plate math / equipment / notes',`${input('bar','Bar weight for plate math, lb','number',45,'min="1" max="100" step="0.5"')}${btn('Calculate plates per side','plates','wide')}<div id="plateResult" class="small">Assumed plate pairs: 45, 35, 25, 10, 5, 2.5 lb. Confirm actual equipment.</div>${input('setNote','Set note (optional)')}`)}</form><div class="between"><span class="timer" id="restTimer">${restUntil>Date.now()?Math.ceil((restUntil-Date.now())/1000)+'s':'Ready when recovered'}</span>${btn('Start rest','rest')}</div>${details('Technique, purpose & last set',`<p>${e.tempo}</p><p>${e.why}</p><p>Structures: ${e.structures}.</p><p>Last recorded: ${last?esc(last.load+' lb × '+last.reps+' · RIR '+last.rir):'none; no history invented'}.</p>`)}${btn('Equipment unavailable → '+esc(e.sub),'substitute','wide')}${btn('Pain changes movement — stop','runner-pain','danger wide')}${btn('End session now','end-session','wide')}<p class="small">Rest timers run only while the app is visible; no background notification guarantee.</p></div>`;}
function testsPage(){const tests=S.events.filter(e=>e.type==='test');let groups={};tests.forEach(e=>{const k=C.canon(['test','method','surface','footwear','start','device','protocol'].map(x=>e.payload[x]));(groups[k]??=[]).push(e.payload);});return `<span class="eyebrow">Same setup. Honest comparison.</span><h1>Test yourself.</h1><p>10-yard split first. Test only fresh, supervised and outside game/pregame load. 40-yard and flying speed can wait for an appropriate training block.</p>${details('Repeatable test procedure',`<p>Use a measured distance and identical warm-up, start, footwear, surface and device/operator. Sprint: 2–3 trials with 3 minutes recovery, record each trial separately. Broad jump: toes behind line, stable two-foot landing, measure nearest heel. Vertical: standing reach then jump reach with the same arm/protocol. 3 attempts with recovery; record in inches.</p><p>No invented percentile table. Hand timing, electronic timing and video stay separate. Video needs frame-rate and start/end definitions in the protocol field.</p>${evidence('TEST SPEED DESIGN')}`)}<form data-form="test">${select('test','Test',['10 yd','20 yd','40 yd','broad jump','vertical','fly 10 yd'])}${input('result','Result: seconds for sprints, inches for jumps','number','','min="0.01" max="200" step="0.01" required')}${select('method','Timing / measurement method',['electronic gates','hand stopwatch','video frames','tape measure','jump reach device'])}<div class="grid2">${select('surface','Surface',['turf','track','grass','gym'])}${input('footwear','Footwear (same name for comparison)','text','','required')}</div>${input('start','Start / stance / jump method','text','','required')}${input('device','Device and operator','text','','required')}${input('protocol','Protocol: gate setup / fps / reach method / wind','text','','required')}${input('trial','Trial number','number',1,'min="1" max="10" required')}<button class="primary wide">Save measured test</button></form>${section('Separate test series',Object.keys(groups).length?Object.values(groups).map(a=>{a.sort((x,y)=>x.date.localeCompare(y.date));const first=a[0],last=a.at(-1),delta=last.result-first.result;return `<div class="history"><b>${esc(last.test)} · ${esc(last.method)}</b><p>${esc(last.surface)} / ${esc(last.footwear)} / ${esc(last.start)}</p><small>${esc(last.device)} · ${esc(last.protocol)}</small><p>${a.length} results · latest ${last.result} · ${a.length>1?'change '+delta.toFixed(2)+' (same setup)':'baseline only'}</p></div>`}).join(''):'<p>No baseline yet. A changed setup starts a separate series.</p>')}`;}
function numbersPage(){return `<span class="eyebrow">Reported / measured history</span><h1>Your own trend.</h1>${stats()}<form data-form="weight">${input('weight','Morning bodyweight, lb','number','','min="70" max="350" step="0.1" required')}${input('weightDate','Measurement date','date',day(),'required')}${area('weightNote','Context: scale, clothing, illness, supplement-water change')}<button class="primary wide">Save morning weight</button></form>${details('Weight history',history('weight'))}${section('Record a lift; do not chase a max',`<form data-form="strength">${select('lift','Movement',[['bench','Bench'],['squat','Back squat'],['trap','Trap-bar deadlift']])}<div class="grid2">${input('liftLoad','Load, lb','number','','min="1" max="700" step="0.5" required')}${input('liftReps','Actual reps','number','','min="1" max="10" required')}</div>${input('liftMethod','Method: depth / handles / equipment / observer','text','','required')}${check('best','This is a new reported best single (only updates profile at 1 rep)')}<button class="primary wide">Save strength result</button></form><p class="small">Epley estimate is shown for 2–10 reps only. It is an estimate and never automatically replaces a reported best.</p>${history('strength')}`)}`;}
function fuelPage(){const n=C.nutrition(S,now()),r=C.latest(S,'readiness',day());return `<span class="eyebrow">Fuel / growth and recovery</span><h1>Feed the work.<br>Support growth.</h1><div class="status"><b>Next action</b><p>${fuelAction()}</p></div>${fuelAuditNote()}${n.unknown?'<p>Current bodyweight expired. Log a new measurement before using weight-based estimates.</p>':`<div class="grid2"><div class="metric"><strong>${n.cal[0]}–${n.cal[1]}</strong><small>kcal/day starting estimate</small></div><div class="metric"><strong>~${n.protein} g</strong><small>protein planning reference</small></div></div><p class="small">Carbohydrate estimate: ${n.carb.join('–')} g for today’s load. Fat: ${n.fat}. These are flexible starting ranges, not caps, quotas or measured expenditure. More food may be needed for growth and hunger.</p>${details('How estimates change',`<p>Current ${S.facts.weight.value} lb = ${n.kg.toFixed(1)} kg. Energy heuristic: lighter days 38–46 kcal/kg; practice/game days 44–52 kcal/kg. This is not a validated adolescent calorimetry equation. Carbohydrate ranges are provisional sports-nutrition extrapolations.</p><p>Protein reference ≈1.5 g/kg with sufficient total food; no requirement for a powder. No weight-cut or automatic calorie-reduction rule.</p>${evidence('NUTRITION FOOD DESIGN')}`)}${section('Trend, not one weigh-in',n.trend?`<p>Weekly mean lb, oldest → newest: ${n.trend.slice().reverse().map(x=>x.toFixed(1)).join(' → ')}.</p><p>${n.proposedFoodAddition?'Stable trend with adequate intake logs: review the actual intake average and a small food addition with your parent/dietitian. The estimate has not automatically changed.':'No trend adjustment applied. Growth, appetite, recovery, illness and supplement-water shifts need context.'}</p>`:'<p>Need at least 3 morning weights in each of 3 weeks for a stable trend; 18 complete intake days before suggesting a small food addition. Measured weight trend does not measure calorie expenditure.</p>')}`}${section('Simple food structure',`<p>Build meals from rice/oats/potatoes/bread, meat/eggs/dairy or other protein, fruit/vegetables and dietary fat. Bring lunch plus a snack for the school-to-field gap.</p><p>Use familiar carbohydrate before play and a normal carbohydrate-plus-protein meal afterward. Include calcium-rich foods, iron-containing foods and vitamin-D food sources; do not diagnose deficiency from fatigue.</p><p class="small">No rapid bulk, cutting phase or skipped meals to hit an app number.</p>`)}<form data-form="intake">${input('intakeDate','Food log date','date',day(),'required')}<div class="grid2">${input('calories','Total kcal (if actually logged)','number','','min="0" max="9000"')}${input('protein','Protein g (if known)','number','','min="0" max="500"')}</div>${area('mealNotes','Meals / what you still need')}${check('complete','This represents the whole day, not a partial log')}<button class="primary wide">Save intake record</button></form>${btn('Log weight trend','go:numbers','wide')}${btn('Hydration / sweat-rate worksheet','go:hydration','wide')}${btn('Sleep check-in · '+(r?r.sleep+' h logged':'not logged'),'go:checkin','wide')}${details('Food log history',history('intake'))}${details('Supplements — below food and sleep',`<p>Historical use: creatine, magnesium, D3 + K2. Current labels, amounts and review status must be recorded.</p>${btn('Open product records','go:supplements','wide')}`)}`;}
function hydrationPage(){return `<span class="eyebrow">Hydration / individual conditions</span><h1>Measure. Don’t force.</h1><p>Bring fluids, use regular team breaks and follow the athletic trainer’s heat plan. Drink with meals and around activity; avoid finishing heavier from forced drinking. Prolonged hot practice may need carbohydrate/electrolyte drinks plus ordinary food.</p><p>No universal bottle quota or sodium prescription. Air temperature alone does not replace WBGT and acclimatization decisions.</p><form data-form="sweat"><div class="grid2">${input('pre','Before practice, lb','number','','min="70" max="350" step="0.1" required')}${input('post','After practice, lb','number','','min="70" max="350" step="0.1" required')}</div><div class="grid2">${input('fluid','Fluid consumed, litres','number','','min="0" max="10" step="0.05" required')}${input('urine','Urine during session, litres','number',0,'min="0" max="5" step="0.05" required')}</div>${input('sweatMinutes','Duration, minutes','number',150,'min="1" max="360" required')}<button class="primary wide">Calculate & record estimate</button></form><p class="small">Same scale, dry/light clothing. Sweat estimate = mass lost in kg + litres drunk − litres urinated. It is not a command to drink that rate. Review repeated hot-practice measurements with your trainer.</p>${history('sweat')}${evidence('HEAT FLUID NUTRITION DESIGN')}`;}
function supplementsPage(){const x=S.supplements[selectedSupplement]||{};return `<span class="eyebrow">Record use / no automatic prescription</span><h1>Know the label.</h1><div class="status"><b>15 g/day creatine appeared in an older draft.</b><p>It is not an established adolescent maintenance prescription. No new dose is assigned here. Review the exact product and amount with a parent and pediatric sports clinician.</p></div><form data-form="supplement">${select('product','Product',[['creatine','Creatine monohydrate'],['magnesium','Magnesium'],['d3k2','Vitamin D3 + K2']],selectedSupplement)}${btn('Load selected product','load-product','wide')}${input('brand','Brand / exact product','text',x.brand)}${area('label','Actual label text, ingredient amounts and units',x.label)}${input('serving','Actual serving size and daily amount (include units)','text',x.serving)}${selectedSupplement==='creatine'?input('dose','Actual creatine g/day (if known)','number',x.dose,'min="0" max="100" step="0.1"'):selectedSupplement==='magnesium'?input('dose','Actual elemental magnesium mg/day from supplements/medicines','number',x.dose,'min="0" max="2000"'):input('dose','Actual vitamin D3 IU/day (if known)','number',x.dose,'min="0" max="50000"')}${selectedSupplement==='d3k2'?input('k2','Actual K2 mcg/day (if known)','number',x.k2,'min="0" max="10000"'):''}${input('cert','Certification / lot; unknown if not checked','text',x.cert)}${input('startDate','Start date (if known)','date',x.startDate)}${area('tolerance','Tolerance / missed doses / questions for clinician',x.tolerance)}${check('parent','Parent aware',x.parent)}${input('clinician','Clinician who reviewed this exact amount','text',x.clinician)}${input('reviewDate','Review date','date',x.reviewDate)}${input('approvedAmount','Exact reviewed amount and directions','text',x.approvedAmount)}<button class="primary wide">Save product record</button></form>${btn('Log today’s adherence to recorded amount','adherence','wide')}${suppFlags(selectedSupplement,x)}<p class="small">A recorded review is athlete-entered, not independently authenticated. Certification is quality information, not medical clearance.</p>${details('Dose / label questions',`<p>Magnesium: confirm the elemental amount on the current label. Count other supplements/medications. Ages 14–18 supplemental UL is 350 mg/day, excluding food. Vitamin D: confirm IU, combined products and clinician rationale; 4,000 IU/day is an upper limit, not a target. K2: ask about medication interactions. Do not change prescribed treatment from this screen.</p>${evidence('CREATINE MG D')}`)}${details('Product use history',history('adherence'))}`;}
function suppFlags(id,x){let flags=[];if(!x.label||!x.serving)flags.push('Label or serving size missing.');if(!x.parent||!x.clinician||!x.reviewDate||!x.approvedAmount)flags.push('Parent awareness and dose-specific clinician review not fully recorded.');if(!x.cert)flags.push('Certification / product identity not checked.');if(id==='creatine'&&x.dose>=15)flags.push('Recorded ≥15 g/day. This is not an established adolescent maintenance dose; ask the pediatric sports clinician before use.');if(id==='magnesium'&&x.dose>350)flags.push('Recorded supplemental amount exceeds the 350 mg/day adolescent UL. Discuss with clinician; include medicines.');if(id==='d3k2'&&x.dose>4000)flags.push('Recorded D3 exceeds the 4,000 IU/day adolescent UL. A clinician must review the reason and total intake.');if(id==='d3k2'&&x.k2==null)flags.push('K2 amount / medication review unknown.');return '<div class="status"><b>Record flags</b><ul>'+flags.map(t=>'<li>'+t+'</li>').join('')+'</ul><p class="small">'+(flags.length?'Review questions, not a dosing instruction.':'Fields completed; review is athlete-reported, not independently verified.')+'</p></div>';}
let selectedSupplement='creatine';
