/* ============================================================================
   v7.56 · FEEL LAYER — counters, haptics, celebration
   Audit: every number in the app appeared instantly and every tap was silent.
   Instant numbers read as "static document." Silent taps read as "web page."
   Both are fixed here, at the platform level, so every screen inherits them.
   ========================================================================== */

/* HAPTICS — the single fastest way a PWA stops feeling like a website.
   Vibration API is iOS-limited but free where supported; guarded everywhere. */
const HAPTIC={tap:8, ok:[12,40,18], big:[18,50,24,50,32]};
function haptic(kind){
  try{ if(typeof navigator!=='undefined'&&navigator.vibrate) navigator.vibrate(HAPTIC[kind]||HAPTIC.tap); }catch(e){}
}

/* ANIMATED COUNTERS — numbers count to their value instead of snapping.
   rAF-driven, easeOutExpo, respects reduced-motion, and self-cancels so a
   re-render mid-count never leaves two loops fighting over one element.
   Marks elements as counted so repeat renders do not re-animate (that would
   be noise, not delight — a number should animate when it CHANGES). */
const _counted=new WeakSet();
function countUp(el,to,dur){
  if(!el) return;
  const reduce=(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const dec=(String(to).split('.')[1]||'').length;
  if(reduce||_counted.has(el)){ el.textContent=to.toFixed(dec); _counted.add(el); return; }
  _counted.add(el);
  const from=0, t0=(typeof performance!=='undefined'?performance.now():Date.now()), D=dur||900;
  if(el._raf&&typeof cancelAnimationFrame!=='undefined') cancelAnimationFrame(el._raf);
  const step=now=>{
    const p=Math.min(1,(now-t0)/D);
    const e=1-Math.pow(2,-10*p);                 // easeOutExpo — fast start, soft landing
    el.textContent=(from+(to-from)*e).toFixed(dec);
    if(p<1&&typeof requestAnimationFrame!=='undefined') el._raf=requestAnimationFrame(step);
    else el.textContent=to.toFixed(dec);
  };
  if(typeof requestAnimationFrame!=='undefined') el._raf=requestAnimationFrame(step);
  else el.textContent=to.toFixed(dec);
}
/* run after any render: any [data-count] element animates to its value once */
function runCounters(root){
  try{
    const scope=root||document;
    if(!scope||!scope.querySelectorAll) return;
    scope.querySelectorAll('[data-count]').forEach(el=>{
      const v=parseFloat(el.getAttribute('data-count'));
      if(!isNaN(v)) countUp(el,v);
    });
  }catch(e){}
}

/* CELEBRATION — earned moments only. Fires on the Daily Four completing and on
   an accepted PR. Deliberately restrained: a brief bloom, never confetti.
   Elite products celebrate with confidence, not noise. */
function celebrate(msg,big){
  haptic(big?'big':'ok');
  try{
    if(typeof document==='undefined'||!document.body) return;
    const reduce=(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    const n=document.createElement('div');
    n.className='celebrate'+(big?' big':'');
    n.innerHTML='<div class="cel-t">'+String(msg||'').replace(/</g,'&lt;')+'</div>';
    document.body.appendChild(n);
    setTimeout(()=>{ try{ n.remove(); }catch(e){} }, reduce?900:1900);
  }catch(e){}
}
/* ============ ATHLETE STATE MODEL — pure derived views. Never stored. ============
   Only dimensions the logged data can support (ARCHITECTURE.md). */
/* v7.84 ROBUSTNESS SWEEP — Model read every array bare (s.lifts.filter) while 61 reads
   elsewhere in this file guarded with (s.x||[]). Any state missing a key threw, which is how
   practiceRead -> returnRead -> momentum crashed the suite the moment a caller passed a partial
   state. Fixed as a CLASS, not as the one instance that surfaced it: every array and day-map
   read inside Model is now guarded, including the object-valued keys (prs/settings/params/profile)
   which the first pass missed because the sweep only looked for array methods. No behaviour changes on a complete state. */
const Model={
  /* streak with one shield per rolling 7 days: a single 3/4 day doesn't break the chain (A2) */
  consistency(s=S,today=todayISO()){
    const day=iso=>(s.checkins||{})[iso]||null;
    const full=iso=>{ const c=day(iso); return !!c&&c.every(Boolean); };
    const three=iso=>{ const c=day(iso); return !!c&&c.filter(Boolean).length===3; };
    /* v7.72: an AWAY day (marked, off routine — a night at a cousin's) holds the chain on one
       honest box instead of four. Marked days only, minimum one real box, so nothing is invented. */
    const away=iso=>{ const c=day(iso); return !!c&&c.some(Boolean)&&(typeof isAway==='function')&&isAway(s,iso); };
    let streak=0, shields=[], awayDays=[], d=today;
    if(!full(d)&&!three(d)&&!away(d)) d=addDays(d,-1); // today in progress doesn't count against you
    while(true){
      if(full(d)){ streak++; }
      else if(three(d) && !shields.some(x=>daysBetween(d,x)<7)){ shields.push(d); streak++; }
      else if(away(d)){ awayDays.push(d); streak++; }
      else break;
      d=addDays(d,-1);
    }
    const first=Object.keys(s.checkins||{}).sort()[0]||today;
    const span=n=>{ let hit=0,tot=0,skips=[0,0,0,0];
      for(let i=0;i<n;i++){ const iso=addDays(today,-i); if(iso<first) break;
        tot++; const c=day(iso)||[false,false,false,false];
        if(c.every(Boolean)) hit++;
        c.forEach((b,j)=>{ if(!b) skips[j]++; }); }
      return {rate:tot?hit/tot:0,skips,tot}; };
    const s7=span(7), s30=span(30);
    // gap = days since last day that counted (for comeback rule)
    const dates=Object.keys(s.checkins||{}).filter(k=>full(k)||three(k)).sort();
    const lastGood=dates.at(-1)||null;
    return {streak, shieldsUsed:shields.length, awayUsed:awayDays.length, rate7:s7.rate, rate30:s30.rate,
            skips30:s30.skips, days30:s30.tot,
            gapDays:lastGood?Math.max(0,daysBetween(lastGood,today)-1):null,
            everComplete:dates.length>0};
  },
  momentum(s=S,today=todayISO()){
    const sets7=(s.lifts||[]).filter(l=>daysBetween(l.d,today)<7).length;
    const days=[...new Set((s.lifts||[]).map(l=>l.d))].sort();
    let consec=0, d=today;
    if(!days.includes(d)) d=addDays(d,-1);
    while(days.includes(d)){ consec++; d=addDays(d,-1); }
    // gap since last logged training day (for comeback deload)
    const lastLift=days.at(-1)||null;
    const bestE1rm={};
    for(const ex of ['squat','dead','bench','clean']){
      const l=(s.lifts||[]).filter(x=>x.ex===ex);
      if(l.length) bestE1rm[ex]=Math.max(...l.map(x=>epley(x.wt,x.reps)));
    }
    return {sets7, consecDays:consec, bestE1rm,
            trainGap:lastLift?Math.max(0,daysBetween(lastLift,today)):null};
  },
  /* comeback deload factor (DISCOVERY policy 9): scaled to layoff, never punitive */
  deloadFactor(s=S,today=todayISO()){
    const g=this.momentum(s,today).trainGap;
    if(g==null||g<10) return 1;       // normal life
    if(g<21) return .90;              // 10–20 days out → 90% loads this week
    if(g<45) return .80;              // 3–6 weeks → 80%
    return .70;                       // longer → 70%, rebuild honestly
  },
  /* plateau: 21d of exposure with no e1RM progress. Honest thresholds: needs ≥6 sets in window. */
  plateau(s=S,ex,today=todayISO()){
    const win=(s.lifts||[]).filter(l=>l.ex===ex&&daysBetween(l.d,today)<=21);
    if(win.length<6) return {plateaued:false,weeks:0};
    const best=Math.max(...win.map(l=>epley(l.wt,l.reps)));
    /* rolling window (v7.29): compare vs the PRIOR 21 days, not all-time best — being below an
       old PR forever is not a plateau; stalling vs recent work is */
    const before=(s.lifts||[]).filter(l=>l.ex===ex&&daysBetween(l.d,today)>21&&daysBetween(l.d,today)<=42);
    if(before.length<3) return {plateaued:false,weeks:0};
    const prior=Math.max(...before.map(l=>epley(l.wt,l.reps)));
    const stuck=best<=prior;
    /* v7.58 (1.8): sort by date — append-only is usually chronological, but the first
       backfilled lift (audit 4.1) would otherwise make .at(-1) the wrong row. */
    const beforeLast=[...before].sort((a,b)=>a.d<b.d?-1:1).at(-1);
    return {plateaued:stuck, weeks:stuck?Math.floor(daysBetween(beforeLast.d,today)/7):0};
  },
  iq(s=S,today=todayISO()){
    const wk=(s.pushLog||[]).filter(p=>daysBetween(p.d,today)<7);
    /* v7.64: latest by (date, write-time), not append order — a backfilled earlier rep must
       not become "last type". Same fix class as calibration/seasonReport (write-path safety). */
    const pl=[...(s.pushLog||[])].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.t||0)-(b.t||0)));
    return {reps7:wk.length, lastType:pl.length?pl[pl.length-1].type:null};
  },
  lastContact(s,id){
    const ev=(s||S).events.filter(e=>e.type==='contact'&&e.meta&&e.meta.id===id).map(e=>e.d).sort();
    return ev.at(-1)||null;
  },
  recruiting(s=S,today=todayISO()){
    const flags=(s.pipeline||[]).filter(p=>{
      if(p.stage<1||p.stage>=5) return false;
      const lc=this.lastContact(s,p.id);
      return lc&&daysBetween(lc,today)>=((s.params||{})?.followupDays?.v??FOLLOWUP_DAYS);
    });
    const contacted=(s.pipeline||[]).filter(p=>p.stage>=1).length;
    const responded=(s.pipeline||[]).filter(p=>p.stage>=2).length;
    const rts=[];
    for(const p of (s.pipeline||[]).filter(p=>p.stage>=2)){
      const c=(s.events||[]).find(e=>e.type==='contact'&&e.meta&&e.meta.id===p.id);
      const r=(s.events||[]).find(e=>e.type==='stage'&&e.meta&&e.meta.id===p.id&&e.meta.to===2);
      if(c&&r) rts.push(daysBetween(c.d,r.d));

            avgDaysToResponse:rts.length?Math.round(rts.reduce((a,b)=>a+b)/rts.length):null};
  },
  /* stage-gated: progress vs the CURRENT YEAR's waypoint; biggest deficit = the flaw the engine attacks */
  waypointGaps(s=S,today=todayISO()){
    const wp=currentWaypoint(today), g=this.gaps(s), mom=this.momentum(s,today);
    const cur=k=>{ if(['squat','bench','dead','clean'].includes(k)) return Math.max((s.prs||{})[k]||0,mom.bestE1rm[k]||0)||null;
      return g.latest(k); };
    const baseline=k=>{ const m=(s.metrics||[]).filter(x=>x.key===k).sort((a,b)=>a.d<b.d?-1:1)[0]; return m?m.val:null; };
    const rows=[];
    for(const k in wp.targets){ const c=cur(k), t=wp.targets[k];
      rows.push({key:k,cur:c,target:t,progress:c==null?null:Math.min(1,c/t),rel:false}); }
    for(const k in wp.rel){ const b=baseline(k), c=g.latest(k);
      const t=b==null?null:+(b+wp.rel[k]).toFixed(2);
      const lower=k==='forty';
      rows.push({key:k,cur:c,target:t,rel:true,
        progress:(t==null||c==null)?null:Math.min(1,lower?(c<=t?1:t/c):(c/t))}); }
    const scored=rows.filter(r=>r.progress!=null);
    const primary=scored.length?scored.reduce((a,b)=>a.progress<=b.progress?a:b):null;

  },
  gaps(s=S){
    const latest=k=>{ const m=(s.metrics||[]).filter(x=>x.key===k).sort((a,b)=>a.d<b.d?1:-1)[0];
      if(m) return m.val;
      const b=BENCHMARKS.find(x=>x.key===k);
      return b&&b.pr? (s.prs||{})[b.pr]??null : null; };
    const rows=BENCHMARKS.map(b=>{
      const v=latest(b.key);
      const hit={}; for(const t in b.tiers) hit[t]=v==null?null:(b.lower?v<=b.tiers[t]:v>=b.tiers[t]);
      return {...b,val:v,hit};
    });
    return {rows, latest};
  },
  weightTrend(s=S,today=todayISO()){
    const wts=(s.metrics||[]).filter(m=>m.key==='wt').sort((a,b)=>a.d<b.d?-1:1);
    if(wts.length<2) return {latest:wts.at(-1)?.val??null, stalled:false, enough:false};
    const latest=wts.at(-1);
    const ref=wts.filter(w=>daysBetween(w.d,latest.d)>=21).at(-1);
    if(!ref) return {latest:latest.val, stalled:false, enough:false};
    return {latest:latest.val, ref:ref.val, delta:+(latest.val-ref.val).toFixed(1),
            stalled:(latest.val-ref.val)<1, enough:true};
  },
  academic(s=S,today=todayISO()){
    const g=(s.metrics||[]).filter(m=>m.key==='gpa').sort((a,b)=>a.d<b.d?1:-1)[0];
    return {gpa:g?.val??null, daysSince:g?daysBetween(g.d,today):null};
  },
  baselineDone(s=S){
    return ['forty','vert','broad'].every(k=>(s.metrics||[]).some(m=>m.key===k));
  },
  /* v7.58 (audit 1.3): timing method of a sprint reading. D1_BENCH is a laser/FAT standard;
     a hand-timed 40 reads ~0.24s FAST, so it must be converted UP before any percentile call
     or the app reports a gap that is 0.24s too small. Read the method off the metric's cond. */
  sprintTiming(s,key){ const a=(s.metrics||[]).filter(m=>m.key===key&&m.cond); if(!a.length) return 'hand';
    /* v7.62 A.3: resolve by (date, write-time), NOT array order — else a backfilled older
       reading's cond could set the basis for a newer value. Documented assumptions:
       no cond -> 'hand' (conservative today; a laser time logged without a cond would be
       penalised +0.24 — revisit when a real timing gate exists). 'phone' -> no conversion:
       frame-counting triggers on first movement like FAT, so it is treated laser-equivalent. */
    const last=[...a].sort((x,y)=>(x.d<y.d?-1:x.d>y.d?1:(x.t||0)-(y.t||0))).at(-1);
    const c=String(last.cond).toLowerCase();
    return /laser|fat|electronic/.test(c)?'laser':/phone|frame|fps/.test(c)?'phone':'hand'; },
  laserEquiv(metric,value,timing){ if(value==null) return value;
    if((metric==='forty'||metric==='shuttle')&&timing==='hand') return +(value+0.24).toFixed(2); return value; },
  /* percentile gap vs senior-recruit thresholds (D1_BENCH). Descriptive, not predictive.
     timing converts hand-timed sprints to the laser basis of the table before comparing. */
  percentileGap(metric,value,pos='LB',timing='hand'){
    const b=(typeof D1_BENCH!=='undefined')&&D1_BENCH[pos]&&D1_BENCH[pos][metric];
    if(!b||value==null) return null;
    const lower=(metric==='forty'||metric==='shuttle');
    const cmp=lower?this.laserEquiv(metric,value,timing):value;   // compare on the laser basis
    const meets=(v,t)=>lower?v<=t:v>=t;
    let tier='below P50', chase='P50';
    if(meets(cmp,b.p90)){tier='P90';chase=null;}
    else if(meets(cmp,b.p75)){tier='P75';chase='P90';}
    else if(meets(cmp,b.p50)){tier='P50';chase='P75';}
    const target=chase?(chase==='P90'?b.p90:chase==='P75'?b.p75:b.p50):null;  // v7.62 A.1: was b.p50 — a regression that reported the P50→P75 band as already closed
    const gap=target==null?null:+Math.abs(cmp-target).toFixed(2);
    return {tier,chase,target,gap,lower,prov:!!b.prov,
      timing:lower?timing:null, laserEquiv:lower&&timing==='hand'?cmp:null};  // UI shows both
  },
  /* descriptive instrumentation — mirrors, not oracles */
  systemRead(s=S,today=todayISO()){
    const c=this.consistency(s,today);
    const names=['Train','Fuel','IQ rep','Sleep'];
    let worst=null;
    if(c.days30>=7){ const i=c.skips30.indexOf(Math.max(...c.skips30));
      if(c.skips30[i]>0) worst={name:names[i],pct:Math.round(100*c.skips30[i]/c.days30)}; }
    const prDays=(s.events||[]).filter(e=>e.type==='pr'&&e.meta).map(e=>e.meta.dow);
    const prByDay=prDays.length?[...new Set(prDays)].map(d=>({day:d,n:prDays.filter(x=>x===d).length})).sort((a,b)=>b.n-a.n):[];
    const r=this.recruiting(s,today);
    return {worstSkip:worst, prByDay,
            responseRate:r.responseRate, avgDaysToResponse:r.avgDaysToResponse,
            trendUp:c.rate7>=c.rate30, rate7:c.rate7, rate30:c.rate30, days30:c.days30};
  }
};

/* ============ KNOWLEDGE ENGINE (v7.18) — the accumulation layer ============
   D1 OS stops re-solving the same question by turning paired observations into permanent
   KNOWLEDGE OBJECTS. This is a PURE function of the append-only log (metrics/checkins/notes),
   so knowledge (a) can never be fabricated, (b) can never drift from evidence, (c) survives
   any UI redesign, and (d) is exported with the data — the log IS the permanent memory.
   Contradictions are never overwritten: every observation stays in the log and is re-counted
   here each time. Confidence comes ONLY from evidence quantity + consistency — never a guess. */
function latestByDate(s,key){ const m={}; (s.metrics||[]).filter(x=>x.key===key&&x.val!=null).forEach(x=>{ m[x.d]=x.val; }); return m; }
function knowledgeEdge(s,edge){
  const A=latestByDate(s,edge.ck), B=latestByDate(s,edge.ek);
  const L=edge.lag||0; // lag L: cause on day d, effect on day d+L — same-day when 0
  const dates=Object.keys(B).filter(db=>addDays(db,-L) in A).sort();
  const nDays=dates.length;
  const xs=dates.map(db=>A[addDays(db,-L)]), ys=dates.map(db=>B[db]);
  const sign=v=>v>0?1:v<0?-1:0;
  // Kendall-style concordance: compare every day against every other day — uses far more of
  // the evidence than a median split and degrades honestly when signals tie.
  let support=0, contra=0;
  for(let i=0;i<nDays;i++) for(let j=i+1;j<nDays;j++){
    const dx=sign(xs[i]-xs[j]), dy=sign(ys[i]-ys[j]);
    if(dx===0||dy===0) continue;                 // ties carry no direction
    if(dx===dy) support++; else contra++;
  }
  const decisive=support+contra;
  const agree=decisive?support/decisive:0.5;
  const strength=Math.abs(agree-0.5)*2;
  const dir=agree>=0.5?'positive':'inverse';
  const NEED=5, CONFIRM=8;
  let status, conf;
  if(nDays<NEED){ const more=NEED-nDays; status='insufficient'; conf=`Insufficient evidence — need ${more} more paired day${more===1?'':'s'}`; }
  else if(decisive===0){ status='insufficient'; conf='Insufficient — no variation to test yet'; }
  else if(strength>=0.5&&nDays>=CONFIRM){ status='confirmed'; conf=`Consistent — ${support}/${decisive} day-comparisons agree across ${nDays} days`; }
  else if(strength>=0.5){ const more=CONFIRM-nDays; status='emerging'; conf=`Emerging — ${support}/${decisive} comparisons agree, ${more} more day${more===1?'':'s'} to confirm`; }
  else if(strength<0.25){ status='none'; conf=`No detectable relationship — ${support}/${decisive} comparisons agree`; }
  else { status='testing'; conf=`Mixed so far — ${support}/${decisive} comparisons agree, still testing`; }
  return { ...edge, n:nDays, comparisons:decisive, support, contra, agree:+agree.toFixed(2), dir, status, conf,
           lastUpdated:dates.at(-1)||null, testing:(status!=='confirmed'&&status!=='none'),
           need:Math.max(0,NEED-nDays),
           learned: status==='confirmed'?(dir==='positive'?edge.statement:`Opposite of expected: more ${edge.from.toLowerCase()} → less ${edge.to.toLowerCase()}`):(status==='none'?`No link found: ${edge.from.toLowerCase()} ↔ ${edge.to.toLowerCase()}`:null) };
}
function knowledgeGraph(s=S){ return (typeof KNOWLEDGE_EDGES!=='undefined'?KNOWLEDGE_EDGES:[]).map(e=>knowledgeEdge(s,e)); }
function knowledgeLearned(s=S){ return knowledgeGraph(s).filter(e=>e.learned); }
/* decision memory — the honest personal-evidence line behind a recommendation, or null if unproven */
function knowledgeCite(id,s=S){ const e=knowledgeGraph(s).find(x=>x.id===id); if(!e||e.status==='insufficient') return null;
  if(e.status==='none') return `your own data shows no clear link yet (${e.support}/${e.comparisons} day-comparisons)`;
  return `the two moved together in ${e.support} of ${e.comparisons} day-to-day comparisons`; }

/* ============ DECISION EFFECTIVENESS ENGINE (v7.19) — the closed learning loop ============
   Answers the question the app could not answer before: "Did my recommendation actually help?"
   Every recommendation is a persisted hypothesis (s.recs). This PURE engine grades each KIND of
   advice from the athlete's OWN observed outcomes — comparing the outcome metric on days he
   FOLLOWED the advice vs days he IGNORED it. Evidence states only: supported / mixed / no effect /
   insufficient. It will conclude its own advice is useless if the data says so. Never a fabricated
   number. Works with zero UI — the intelligence is here, not in the screens.
   Outcome is read at an EXACT offset day (off) so adjacent recommendations never share evidence. */
const REC_KINDS={
  speed:  {label:'Test-day (40 / vert / broad)', outKey:null,     off:3},
  lift:   {label:'Log your lifts',               outKey:'sq',     off:1},  // v7.58 (1.6): a lift day HAS a next-day outcome — session quality
  fuel:   {label:'Eat more / hit the surplus',   outKey:'wt',     off:7},
  train:  {label:'Train + log the session',      outKey:'sq',     off:0},
  board:  {label:'Build the recruiting board',   outKey:null,     off:14},
  daily4: {label:'Finish the Daily Four',         outKey:'energy', off:1},
  recover:{label:'Recover / bank sleep',         outKey:'sq',     off:1}
};
function metricOn(s,key,dateISO){ const m=(s.metrics||[]).filter(x=>x.key===key&&x.d===dateISO);
  if(!m.length) return null;
  /* v7.58 (audit 1.7): pick the latest by timestamp, not array insertion order. Same-day
     duplicates (a 6am + 9pm weigh-in, or a mistaken re-entry) were resolving arbitrarily. */
  m.sort((a,b)=>(a.t||0)-(b.t||0)); return m[m.length-1].val; }
function recEffectiveness(s=S){
  const today=todayISO(), byKind={};
  (s.recs||[]).forEach(r=>{ (byKind[r.kind]=byKind[r.kind]||[]).push(r); });
  const med=a=>{ const b=[...a].sort((m,n)=>m-n),k=b.length; return k?(k%2?b[(k-1)/2]:+(((b[k/2-1]+b[k/2])/2)).toFixed(2)):null; };
  const nm=k=>k==='sq'?'Session quality':k==='energy'?'Energy':k==='wt'?'Bodyweight':k;
  return Object.keys(byKind).map(kind=>{
    const meta=REC_KINDS[kind]||{label:kind,outKey:null,off:2};
    const recs=byKind[kind], total=recs.length;
    const followed=recs.filter(r=>r.followed==='followed').length;
    const partial=recs.filter(r=>r.followed==='partial').length;   // v7.58 (1.4): was silently dropped
    const ignored=recs.filter(r=>r.followed==='ignored').length;
    let effect='insufficient', detail='', lastConfirmed=null, retire=false;
    const fv=[], iv=[];
    if(!meta.outKey){ effect='not-measurable';
      detail='No daily outcome to measure yet — recording whether you follow it ('+followed+'/'+total+(partial?', '+partial+' partly':'')+').'; }
    else {
      recs.forEach(r=>{ if(daysBetween(r.d,today)<meta.off) return;           // outcome day not reached
        const v=metricOn(s,meta.outKey,addDays(r.d,meta.off)); if(v==null) return;
        /* v7.58 (1.4): 'partial' counts toward followed for outcome — dropping it discarded a third of answers */
        ((r.followed==='followed'||r.followed==='partial')?fv:(r.followed==='ignored'?iv:null))?.push({d:r.d,v}); });
      if(fv.length>=4 && iv.length>=2){
        const mf=med(fv.map(x=>x.v)), mi=med(iv.map(x=>x.v));
        lastConfirmed=fv.map(x=>x.d).sort().at(-1);
        if(mf-mi>=0.5){ effect='supported'; detail=nm(meta.outKey)+' averaged '+mf+' on the '+fv.length+' days you followed it vs '+mi+' on '+iv.length+" days you didn't."; }
        else if(Math.abs(mf-mi)<0.5){ effect='none'; retire=true; detail='No measurable benefit — '+nm(meta.outKey)+' was '+mf+' followed vs '+mi+' not ('+fv.length+' vs '+iv.length+').'; }
        else { effect='mixed'; detail='Mixed signal — '+mf+' followed vs '+mi+' not ('+fv.length+' vs '+iv.length+').'; }
      } else {
        const nf=Math.max(0,4-fv.length), ni=Math.max(0,2-iv.length);
        detail='Need '+nf+' more followed + '+ni+' more skipped day'+(ni===1?'':'s')+' with a logged '+nm(meta.outKey).toLowerCase()+' to judge.';
      }
    }
    return {kind,label:meta.label,total,followed,partial,ignored,outKey:meta.outKey,off:meta.off,effect,detail,lastConfirmed,retire,pairs:meta.outKey?{f:fv,i:iv}:null};
  });
}
function recEffFor(kind,s=S){ return recEffectiveness(s).find(e=>e.kind===kind)||null; }

/* ============ POLICY LAYER (v7.20) — the constitutional bridge between knowledge and action ====
   Pure functions. Proposals are DERIVED from evidence every time (never stored — the one law);
   only the human DECISION persists: an append-only 'policy' event + a params write with basis.
   Any future engine that wants to change behavior emits a proposal object through policyEval.
   The policy outlives the engines. */
function policyObsCount(s=S){ return (s.metrics||[]).length+(s.lifts||[]).length+Object.keys(s.checkins||{}).length+(s.pushLog||[]).length; }
function policyBar(s=S){
  const n=policyObsCount(s);
  const bar=[...POLICY.bars].reverse().find(b=>n>=b.minObs)||POLICY.bars[0];
  return {...bar, obs:n,
    note:`${n} real observations on record — the system is ${bar.label}. A behavior change now needs ${bar.needFollowed} followed + ${bar.needIgnored} skipped graded days, spread over ${bar.needWeeks}+ distinct weeks spanning ${bar.needSpanDays}+ days, with at most ${Math.round(bar.maxContra*100)}% contradicting evidence. The bar rises as evidence accumulates — the system gets more stable, never more reactive.`};
}
/* fixed 7-day bins since epoch — 'distinct calendar weeks' for the overfit check */
function weekBin(d){ return Math.floor((new Date(d+'T12:00').getTime()/864e5+4)/7); }
/* policyEval(p,s) → verdict object. p must carry: id,param,kind,current,proposed,support,contra,
   followed,ignored (GRADED days),evDates,reason,expected,unknowns,explain. Nothing hidden. */
function policyEval(p,s=S){
  const bar=policyBar(s);
  const days=(p.evDates||[]).slice().sort();
  const span=days.length>1?daysBetween(days[0],days.at(-1)):0;
  const weeks=new Set(days.map(weekBin)).size;
  const tot=(p.support||0)+(p.contra||0);
  const contraShare=tot>0?p.contra/tot:null;
  const Q=[];
  const q1=p.followed>=bar.needFollowed&&p.ignored>=bar.needIgnored;
  Q.push({id:'sufficient',pass:q1,note:q1
    ?`${p.followed} followed + ${p.ignored} skipped graded days — meets the ${bar.label} bar (${bar.needFollowed}+${bar.needIgnored}).`
    :`${p.followed} followed + ${p.ignored} skipped graded days; the ${bar.label} bar is ${bar.needFollowed}+${bar.needIgnored}. Not demonstrably sufficient.`});
  const q2=contraShare!=null&&contraShare<=bar.maxContra;
  Q.push({id:'contradictions',pass:q2,note:contraShare==null
    ?'No contradiction count present — rejected: unexamined contradiction is hidden uncertainty.'
    :`${p.contra} of ${tot} evidence points disagree (${Math.round(contraShare*100)}%; bar allows ${Math.round(bar.maxContra*100)}%). Contradictions counted, never erased.`});
  const q3=span>=bar.needSpanDays;
  Q.push({id:'forward',pass:q3,note:q3
    ?`Evidence spans ${span} days — a pattern, not a reaction to this week.`
    :`Evidence spans only ${span} days (needs ${bar.needSpanDays}) — acting on it would be reacting to recent observations, not learning.`});
  const q4=weeks>=bar.needWeeks;
  Q.push({id:'overfit',pass:q4,note:q4
    ?`Seen across ${weeks} distinct weeks — not one short period.`
    :`All evidence sits in ${weeks} distinct week${weeks===1?'':'s'} (needs ${bar.needWeeks}) — could be one short period. Delayed, not rejected: keep logging.`});
  const q5=['current','proposed','reason','expected','unknowns','explain'].every(k=>p[k]&&String(p[k]).trim());
  Q.push({id:'explainable',pass:q5,note:q5
    ?'Every field derives from logged evidence — nothing hidden, nothing magical.'
    :'Proposal is missing evidence-derived fields — rejected.'});
  const verdict=(!q1||!q2||!q3||!q5)?'rejected':(!q4?'delayed':'eligible');
  return {...p,bar:bar.label,obs:bar.obs,spanDays:span,weeks,questions:Q,verdict,
    verdictNote:verdict==='eligible'
      ?'Passed all five policy questions — awaiting YOUR approval. The system proposes; you decide.'
      :verdict==='delayed'
      ?'Delayed by policy: the evidence must span more distinct weeks before behavior may change.'
      :'Rejected by policy: this evidence has not earned a behavior change.'};
}
/* revisions(s) — the FIRST consumer of the policy layer. Generates candidate behavior changes
   from the Decision Effectiveness Engine and submits every one to policyEval. Today it knows one
   kind of change (demote/restore a rec kind in the ONE THING ladder); future engines add
   generators here — the policy above never changes shape. */
function revisions(s=S){
  const effs=(typeof recEffectiveness==='function')?recEffectiveness(s):[];
  const demoted=(s.params&&s.params.demotedRecs&&s.params.demotedRecs.v)||[];
  const med=a=>{const b=[...a].sort((x,y)=>x-y),k=b.length;return k?(k%2?b[(k-1)/2]:(b[k/2-1]+b[k/2])/2):null;};
  const out=[];
  for(const e of effs){
    if(!e.pairs||!e.pairs.f.length||!e.pairs.i.length) continue;
    const mi=med(e.pairs.i.map(x=>x.v));
    const helped=e.pairs.f.filter(x=>x.v-mi>=0.5).length;     // followed days where the advice looked like it helped
    const flat=e.pairs.f.length-helped;                        // followed days consistent with "no benefit"
    const evDates=[...e.pairs.f,...e.pairs.i].map(x=>x.d);
    const base={kind:e.kind,param:'demotedRecs',followed:e.pairs.f.length,ignored:e.pairs.i.length,evDates};
    let p=null;
    if(e.effect==='none'&&!demoted.includes(e.kind)){
      p=policyEval({...base,id:'demote:'+e.kind,
        current:`"${e.label}" can be prescribed as TODAY'S ONE THING`,
        proposed:`Stop prescribing "${e.label}" as the ONE THING — the ladder falls through to the next real priority`,
        support:flat,contra:helped,
        reason:e.detail,
        expected:'The daily priority stops spending your attention on advice your own outcomes graded as no-effect.',
        unknowns:'A longer season, better logging, or a changed context could reverse this. The grade keeps updating and this change is reversible through the same policy.',
        explain:`Your own log graded "${e.label}" as having no measurable effect: ${e.detail}`},s);
    } else if(e.effect==='supported'&&demoted.includes(e.kind)){
      p=policyEval({...base,id:'restore:'+e.kind,
        current:`"${e.label}" is demoted out of the ONE THING ladder`,
        proposed:`Restore "${e.label}" as an eligible ONE THING`,
        support:helped,contra:flat,
        reason:e.detail,
        expected:'Advice your outcomes now support returns to the daily priority.',
        unknowns:'The earlier no-effect grade came from real days too — both records are kept; neither is erased.',
        explain:`Your own log now grades "${e.label}" as supported: ${e.detail}`},s);
    }
    if(!p) continue;
    /* a rejection is permanent FOR THIS EVIDENCE — identical evidence never resurfaces; new evidence may */
    const fp=`${p.support}✓/${p.contra}✗ over ${evDates.length} graded days`;
    p.fingerprint=fp;
    const dismissed=(s.events||[]).some(ev=>ev.type==='policy'&&ev.meta&&ev.meta.action==='rejected'&&ev.meta.id===p.id&&ev.meta.evidence===fp);
    if(!dismissed) out.push(p);
  }
  return out;
}

/* ============ CALIBRATION LAYER (v7.21) — the system measures its OWN reasoning ============
   Every recommendation is a prediction; every prediction eventually meets evidence; therefore
   every prediction is calibratable. Because ALL knowledge here is a pure function of the
   append-only log, the system can REPLAY what it believed on any past date (stateAt) and compare
   it to what it believes now — so reversals, premature conclusions and over/under-confidence are
   DERIVED from permanent observations, never stored, never opinion. Counts, not scores.
   Merge rule holds: no family inherits credibility from another; every statement cites evidence. */
function stateAt(s,dateISO){
  const f=a=>(a||[]).filter(x=>x.d<=dateISO);
  const ck={}; Object.keys(s.checkins||{}).forEach(k=>{ if(k<=dateISO) ck[k]=s.checkins[k]; });
  const recs=(s.recs||[]).filter(r=>r.d<=dateISO).map(r=>(r.followedOn&&r.followedOn>dateISO)?{...r,followed:null,followedOn:null}:r);

/* the calibration engine — families graded ONLY on their own record */

  else if(rv.reversals.length===0&&held28.length>=3) confidence=`No settled conclusion has reversed (${held28.length} have held 28+ days). No sign of overconfidence; if this persists the bars could safely relax — through policy, never silently.`;
  else confidence=`${rv.reversals.length} reversal${rv.reversals.length===1?'':'s'} across ${rv.settled.length} settled conclusions — within honest bounds for single-athlete evidence.`;
  const sup=fam.filter(f=>f.resolution==='supported').sort((a,b)=>b.graded-a.graded);

const normCue=t=>String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function weakConcepts(s=S){

/* recovery pattern read — honest medians, no claim below 4+4 rated days */
function recoveryRead(s=S){

function filmRead(s=S){

  const days=[...new Set(c.map(x=>x.d))].sort();

    const a=half(d=>d<mid), b=half(d=>d>=mid);

/* ============ v7.65 MATURATION + DEEP-DOMAIN READS — descriptive only ============

/* Maturity band via TANNER MID-PARENTAL estimate — named honestly (this is NOT Khamis-Roche).

function maturityRead(s=S){

  if(!dad||!mom||!h) return {have:false,needHt:!h,needParents:!(dad&&mom)};
  const predAdult=+(((+dad.val)+(+mom.val)+5)/2).toFixed(1);        // boys: (father + mother + 5in)/2
  if(!(predAdult>0)) return {have:false,needHt:!h,needParents:!(dad&&mom)};
  const ht=+h.val, pah=+(100*ht/predAdult).toFixed(1);
  const lo=+(100*ht/(predAdult+MATURITY.err)).toFixed(1);           // taller prediction ⇒ lower %
  const hi=+(100*ht/Math.max(1,predAdult-MATURITY.err)).toFixed(1);
  const b=MATURITY.bands.find(x=>pah<=x.max)||MATURITY.bands[MATURITY.bands.length-1];

  const ev=+((mom.bestE1rm||{})[lift])||0;

  const step=(typeof TM_STEP!=='undefined'?TM_STEP[lift]:5)||5;
  const tm=Math.round((base*(typeof TM_PCT!=='undefined'?TM_PCT:0.9)+cycles*step)/5)*5;

function cycleRead(s=S,today=todayISO()){

  const cycle=Math.floor(days/28)+1;
  const W=(typeof WAVE!=='undefined')?WAVE[wk]:{w:1,mult:1,label:'BUILD',note:''};
  return {have:true,cycle,week:W.w,mult:W.mult,label:W.label,note:W.note,
    deloadWeek:W.label==='DELOAD',
    dayOfCycle:days%28+1};
}
/* the load actually prescribed today: training max x block% x wave x comeback-deload */
function prescribe(s=S,lift,pct,today=todayISO()){
  const t=trainingMax(s,lift,today); if(!t.have) return null;
  const c=cycleRead(s,today);
  const wave=c.have?c.mult:1;
  const dl=(typeof Model!=='undefined'&&Model.deloadFactor)?Model.deloadFactor(s,today):1;
  const raw=t.tm*pct*wave*dl;
  return {lb:Math.round(raw/5)*5,tm:t.tm,pct,wave,dl,cycle:c,tmSrc:t.src,base:t.base};
}

/* ============================================================================
   v7.84 — PHASE C: the three captures that must exist before Aug 21.
   Each one takes seconds, and each one currently costs the athlete nothing to skip
   and everything to have skipped.
   ============================================================================ */
/* ---- HYDRATION. Safety-critical, August, Henderson. ----
   Two weight taps produce a number that matters: fluid lost as a share of bodyweight.
   Past ~2% loss, performance and thermoregulation degrade — that rule is already in the
   app's own copy and has never had a way to be measured. */
const SWEAT_OZ_PER_LB=22;        /* ~20–24 fl oz per lb lost is the standard replacement range */
function hydrationRead(s=S,today=todayISO()){
  const day=d=>{
    const pre=metricOn(s,'wtpre',d), post=metricOn(s,'wtpost',d);
    if(pre==null||post==null||!(pre>0)) return null;
    const lost=+(pre-post).toFixed(1);
    const pct=+(((pre-post)/pre)*100).toFixed(2);
    return {d,pre,post,lost,pct,over:pct>2,oz:Math.max(0,Math.round(lost*SWEAT_OZ_PER_LB))};
  };
  const t=day(today);
  const trend=[0,1,2].map(i=>day(addDays(today,-i))).filter(Boolean);
  const overCount=trend.filter(x=>x.over).length;
  return {have:!!t,today:t,trend,overCount,
    repeated:overCount>=2,
    partial:(metricOn(s,'wtpre',today)!=null&&metricOn(s,'wtpost',today)==null)};
}
/* ---- BALL SECURITY. "The fastest way a freshman loses a job." ----
   The plan names 100 daily high-and-tight carries and the app has never counted one. */
const BALL_TARGET=100;
function ballRead(s=S,today=todayISO()){
  const sum=d=>(s.metrics||[]).filter(m=>m.key==='ball'&&m.d===d)
    .reduce((a,b)=>a+(+b.val||0),0);
  const n=sum(today);
  let streak=0;
  for(let i=1;i<=60;i++){ const d=addDays(today,-i); if(sum(d)>=BALL_TARGET) streak++; else break; }
  if(n>=BALL_TARGET) streak++;
  const days=[0,1,2,3,4,5,6].map(i=>({d:addDays(today,-i),n:sum(addDays(today,-i))}));
  const wk=days.reduce((a,b)=>a+b.n,0);
  return {n,target:BALL_TARGET,done:n>=BALL_TARGET,left:Math.max(0,BALL_TARGET-n),streak,week:wk,days};
}
/* ---- PRACTICE LOG. Fifteen seconds, taps not typing. ----
   Feeds depth[] (the season record nobody keeps) and coach[] (the chain that cannot run
   on zero entries), and marks one mental error — the thing coaches actually cut freshmen for. */
function practiceLogged(s=S,d){ return (s.events||[]).some(e=>e.type==='practice'&&e.d===d); }
function practiceRead(s=S,today=todayISO()){
  const evs=(s.events||[]).filter(e=>e.type==='practice').sort((a,b)=>a.d<b.d?-1:1);
  const last=evs.length?evs[evs.length-1]:null;
  const errs=evs.filter(e=>e.meta&&e.meta.err).length;
  const rr=(typeof returnRead==='function')?returnRead(s,today):{have:false};
  const isPracticeDay=rr.have&&rr.days<=0;
  return {n:evs.length,last,errs,logged:practiceLogged(s,today),
    due:isPracticeDay&&!practiceLogged(s,today),
    errRate:evs.length?+(errs/evs.length).toFixed(2):null};
}
/* ============================================================================
   v7.81 — THE ROI RANKER
   ROI = expectedGateMovement x evidenceWeight x personalPrior
         / (minutes + dollars + fatigue + adherenceRisk)
   The five constraints are applied BEFORE ranking, never after. Order matters:
   safety veto, then availability, then floor-before-ceiling, then evidence
   honesty, then personal prior. A number that survives all five is a rank.
   ============================================================================ */
const FLOOR_IDS=['sleep','fuel','heat','hydrate','gpa'];
/* Today's real budget. Minutes are the binding constraint on a school day. */
function budgetToday(s=S,today=todayISO()){
  const dow=new Date(today+'T12:00').getDay();
  const school=(typeof phaseFor==='function')&&today>='2026-08-10';
  const practice=(typeof returnRead==='function')?returnRead(s,today):{have:false};
  const inPractice=practice.have&&practice.days<=0;
  let minutes=school?(dow===0||dow===6?180:75):(inPractice?90:150);
  return {minutes,dollars:0,fatigue:inPractice?4:8,social:3,school,inPractice,dow};
}
/* Is a floor unmet right now? Floors outrank ceilings — the app says so in those words. */
function floorState(s=S,today=todayISO()){
  const out=[];
  const sl=(typeof metricOn==='function')?metricOn(s,'sleep',addDays(today,-1)):null;
  if(sl!=null&&sl<8) out.push({id:'sleep',why:'last night was '+sl+'h — under the 8h bar the app grades against'});
  const w=(typeof Model!=='undefined'&&Model.weightTrend)?Model.weightTrend(s,today):{};
  if(w.enough&&w.stalled) out.push({id:'fuel',why:'bodyweight has stalled while training — the surplus is not there'});
  const cr=(typeof cutRisk==='function')?cutRisk(s,today):{have:false};
  if(cr.have&&cr.over) out.push({id:'fuel',why:'weight is falling faster than 1.5%/week'});
  const rr=(typeof returnRead==='function')?returnRead(s,today):{have:false};
  if(rr.have&&rr.inAccl) out.push({id:'heat',why:'day '+rr.acclDay+' of the 14-day heat-acclimatisation period'});
  const g=(typeof Model!=='undefined'&&Model.academic)?Model.academic(s,today):{gpa:null};
  if(g.gpa==null) out.push({id:'gpa',why:'no GPA on record — the eligibility gate is unverified'});
  return out;
}
/* Live risk flags. An injured or heat-sick athlete has an ROI of zero on everything. */
function riskFlags(s=S,today=todayISO()){
  const f=[];
  const st=(typeof statusToday==='function')?statusToday(s,today):null;
  if(st==='hurt') f.push({k:'hurt',t:'Injury status is set for today'});
  if(st==='sick') f.push({k:'sick',t:'Illness status is set for today'});
  const b=(typeof bodyRead==='function')?bodyRead(s,today):{recurring:[]};
  if((b.recurring||[]).length) f.push({k:'sore',t:'Recurring soreness pattern in the last 14 days'});
  const rr=(typeof returnRead==='function')?returnRead(s,today):{have:false};
  if(rr.have&&rr.inAccl&&rr.acclDay<=5) f.push({k:'heat',t:'Unacclimatised — day '+rr.acclDay+' of 14'});
  return f;
}
/* Which recommendation family grades which intervention. Without this the ledger and the
   learning loop never meet: intervention ids and REC_KINDS keys are different vocabularies.
   v7.83 BUGFIX: personalPrior indexed recEffectiveness() — which returns an ARRAY — as if it
   were keyed by id, so the lookup was always undefined and CONSTRAINT 5 never once fired.
   The ledger has been ranking on population evidence alone since v7.81. Fixed here, with the
   mapping made explicit so the failure cannot recur silently. */
const IV_REC_KIND={
  sleep:'recover', fuel:'fuel', milk:'fuel', lift:'lift', sprint:'speed',
  nmt:'train', viz:'daily4', prayer:'daily4', breath:'recover', journal:'daily4',
  clip:'board', camp:'board', light:'recover', hydrate:'recover'
};
/* His own record, once it exists, outranks the literature — and the app says so out loud. */
function personalPrior(s=S,iv){
  if(typeof recEffectiveness!=='function') return {mult:1,have:false,n:0};
  const kind=IV_REC_KIND[iv&&iv.id]; if(!kind) return {mult:1,have:false,n:0,reason:'no graded family'};
  let eff=null; try{ eff=recEffectiveness(s); }catch(e){ return {mult:1,have:false,n:0}; }
  const fam=Array.isArray(eff)?eff.find(x=>x.kind===kind):null;
  if(!fam) return {mult:1,have:false,n:0,kind};
  const n=(fam.pairs?((fam.pairs.f||[]).length+(fam.pairs.i||[]).length):0);
  if(fam.effect==='supported') return {mult:1.35,have:true,n,kind,effect:'supported',
    verdict:'your own record supports this',detail:fam.detail};
  if(fam.effect==='none')      return {mult:0.55,have:true,n,kind,effect:'none',
    verdict:'your own record does NOT support this',detail:fam.detail};
  if(fam.effect==='mixed')     return {mult:0.9,have:true,n,kind,effect:'mixed',
    verdict:'mixed in your own record',detail:fam.detail};
  return {mult:1,have:false,n,kind,effect:fam.effect,detail:fam.detail};
}
/* ===== v7.83 INTERVENTION REPORT CARDS =====
   For everything he has actually tried: what the population evidence claimed, what HIS record
   shows, and which one the app now believes. When they disagree the app says so unprompted,
   about its own advice. That sentence is the difference between an app and a coach. */
function reportCards(s=S){
  if(typeof INTERVENTIONS==='undefined') return {have:false,rows:[]};
  const rows=INTERVENTIONS.map(iv=>{
    const pp=personalPrior(s,iv);
    if(!pp.kind) return null;
    const pop=(iv.effect||{});
    let verdict='untested', line='';
    if(!pp.have||pp.n<4){
      verdict='gathering';
      line='Not enough of your own data yet'+(pp.n?(' — '+pp.n+' graded day'+(pp.n===1?'':'s')+' so far'):'')+'. Running on population evidence.';
    } else if(pp.effect==='supported'){
      verdict='confirmed';
      line='Population evidence said '+pop.magnitude+' (grade '+pop.grade+'). Your record agrees. The app is keeping this ranked where it is.';
    } else if(pp.effect==='none'){
      verdict='demoted';
      line='Population evidence said '+pop.magnitude+' (grade '+pop.grade+'). YOUR record does not show it. The app is demoting its own recommendation — your data outranks the literature here.';
    } else {
      verdict='mixed';
      line='Population evidence said '+pop.magnitude+' (grade '+pop.grade+'). Your record is mixed. Holding the rank and keeping the question open.';
    }
    return {id:iv.id,name:iv.name,grade:pop.grade,magnitude:pop.magnitude,basis:pop.basis,
      kind:pp.kind,n:pp.n,effect:pp.effect||null,detail:pp.detail||null,verdict,line,mult:pp.mult};
  }).filter(Boolean);
  const graded=rows.filter(r=>r.verdict!=='gathering');
  return {have:true,rows,graded:graded.length,total:rows.length,
    demoted:rows.filter(r=>r.verdict==='demoted'),
    confirmed:rows.filter(r=>r.verdict==='confirmed')};
}
function interventionRank(s=S,today=todayISO(),opts){
  opts=opts||{};
  if(typeof INTERVENTIONS==='undefined') return {have:false};
  const bud=opts.budget||budgetToday(s,today);
  const floors=floorState(s,today);
  const floorIds=floors.map(f=>f.id);
  const risks=riskFlags(s,today);
  const blocked=[], ranked=[];
  for(const iv of INTERVENTIONS){
    /* CONSTRAINT 1 — safety veto. Never silently dropped; shown with what would unlock it. */
    const sf=iv.safety||{};
    if(sf.requiresClinician||sf.requiresAdult||(iv.effect&&iv.effect.grade==='X')){
      blocked.push({iv,why:iv.effect&&iv.effect.grade==='X'
        ?'Contradicted or no demonstrated benefit — see the card for the trade-off.'
        :('Needs '+[sf.requiresAdult?'a parent':null,sf.requiresClinician?'a clinician':null].filter(Boolean).join(' and ')+' before this can be ranked.'),
        unlock:sf.note||null});
      continue;
    }
    /* seasonal windows — an intervention outside its window is not on today's board */
    if(iv.seasonal&&(today<iv.seasonal[0]||today>iv.seasonal[1])) continue;
    const gates=iv.gates||[];
    /* NO GATE NAMED, NEVER SHOWN. No exceptions — a special case here was a v7.81 bug
       caught by its own test: foam rolling was being ranked while naming nothing it moves. */
    if(!gates.length) continue;
    const gw=MAG_W[(iv.effect||{}).magnitude]||0.3;
    const ew=GRADE_W[(iv.effect||{}).grade]||0.25;
    const pp=personalPrior(s,iv);
    const c=iv.cost||{};
    const cost=(c.minutes||0)/10 + (c.dollars||0)/10 + Math.max(0,c.fatigue||0)/2 + (c.social||0)/3 + 1;
    let roi=(gw*gates.length*ew*pp.mult)/cost;
    const notes=[];
    /* CONSTRAINT 2 — availability first */
    if(risks.length && gates.includes('availability')){ roi*=2.2; notes.push('availability is at risk — this outranks performance work today'); }
    else if(risks.length && !gates.includes('availability')){ roi*=0.35; notes.push('a risk flag is live, so performance work is held back'); }
    /* CONSTRAINT 3 — floor before ceiling */
    if(floorIds.includes(iv.id)){ roi*=3.0; notes.push('this is an unmet FLOOR — fixing a floor beats raising a ceiling'); }
    else if(floors.length && !FLOOR_IDS.includes(iv.id)){ roi*=0.5; notes.push('a floor is unmet, so ceiling work is discounted'); }
    /* CONSTRAINT 4 — evidence honesty: a D can never outrank an A on magnitude alone */
    if((iv.effect||{}).grade==='D'||(iv.effect||{}).grade==='C'){ roi=Math.min(roi, 0.95*(MAG_W.large*2*GRADE_W.A)/2); }
    /* budget: never propose more than fits */
    const fits=(c.minutes||0)<=bud.minutes;
    if(!fits){ notes.push('does not fit today\'s '+bud.minutes+' free minutes'); roi*=0.2; }
    ranked.push({iv,roi:+roi.toFixed(3),gw,ew,pp,cost:+cost.toFixed(2),fits,notes,
      floor:floorIds.includes(iv.id)});
  }
  ranked.sort((a,b)=>b.roi-a.roi||(a.iv.cost.minutes||0)-(b.iv.cost.minutes||0));
  return {have:true,ranked,blocked,floors,risks,budget:bud,
    top:ranked[0]||null,
    considered:ranked.length};
}
/* ===== v7.80 CLOSING THE CYCLE — the increase has to be earned =====
   v7.79 shipped a training max that steps up per completed cycle, but nothing ever recorded a
   completed cycle, so it could never actually rise. This closes that loop — and deliberately
   does NOT auto-increment on the calendar. A training max that climbs whether or not the work
   happened is how a 14-year-old ends up under a bar he has not earned. Suggest-and-approve:
   the app asks, he answers, and a "no" holds the weight instead of raising it. */
const CYCLE_LIFTS=['squat','bench','dead'];
function cycleDue(s=S,today=todayISO()){
  const c=cycleRead(s,today);
  if(!c.have||c.cycle<2) return {due:false};          // nothing to close until cycle 1 is behind us
  const anchor=(typeof CYCLE_ANCHOR!=='undefined')?CYCLE_ANCHOR:null;
  const prevStart=addDays(anchor,(c.cycle-2)*28), prevEnd=addDays(anchor,(c.cycle-1)*28-1);
  const rows=CYCLE_LIFTS.map(lift=>{
    const closed=(s.events||[]).some(e=>e.type==='cycle'&&e.meta&&e.meta.lift===lift&&e.meta.cycle===c.cycle-1);
    const held=(s.events||[]).some(e=>e.type==='cycle-held'&&e.meta&&e.meta.lift===lift&&e.meta.cycle===c.cycle-1);
    const sets=(s.lifts||[]).filter(l=>l.ex===lift&&l.d>=prevStart&&l.d<=prevEnd).length;
    return {lift,sets,answered:closed||held,trained:sets>=3};
  });
  const open=rows.filter(r=>!r.answered&&r.trained);
  return {due:open.length>0,cycle:c.cycle-1,rows,open,window:[prevStart,prevEnd]};
}
/* ===== v7.78 DEPTH CHART — the freshman question, answered over time =====
   Positions and reps get decided in the first weeks of practice and then nobody writes any of it
   down. This is the record: what he was listed at, which unit, and how it moved. Descriptive —
   it reports the trajectory, never predicts playing time. */
const UNITS=[{k:'1',label:'1s'},{k:'2',label:'2s'},{k:'3',label:'3s'},{k:'st',label:'Special teams'},{k:'scout',label:'Scout team'}];
function depthRead(s=S,today=todayISO()){
  const rows=[...(s.depth||[])].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.t||0)-(b.t||0)));
  if(!rows.length) return {have:false,rows:[]};
  const cur=rows[rows.length-1];
  const byPos={};
  rows.forEach(r=>{ (byPos[r.pos]=byPos[r.pos]||[]).push(r); });
  const rank=u=>({'1':1,'2':2,'3':3,'st':2.5,'scout':4})[u]??9;
  const samePos=rows.filter(r=>r.pos===cur.pos);
  const prev=samePos.length>1?samePos[samePos.length-2]:null;
  const moved=prev?(rank(cur.unit)<rank(prev.unit)?'up':rank(cur.unit)>rank(prev.unit)?'down':'same'):null;
  const st=rows.some(r=>r.unit==='st');
  return {have:true,rows,cur,prev,moved,positions:Object.keys(byPos),st,
    days:daysBetween(rows[0].d,today)};
}
/* ===== v7.77 CURRICULUM ENGINE =====
   A list is not a curriculum. What makes it one: prerequisites gate what is available, exactly
   ONE next unit is surfaced, and completion is append-only so the record of what he has learned
   survives four years. Descriptive throughout — it reports what is unlocked, never predicts. */
function curriculumRead(s=S){
  const units=(typeof CURRICULUM!=='undefined')?CURRICULUM:[];
  const done={};
  (s.events||[]).filter(e=>e.type==='learn'&&e.meta&&e.meta.id)
    .sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)
    .forEach(e=>{ done[e.meta.id]=e.d; });
  const rows=units.map(u=>{
    const isDone=!!done[u.id];
    const blockers=(u.pre||[]).filter(x=>!done[x]);
    return {...u,done:isDone,doneOn:done[u.id]||null,open:!isDone&&blockers.length===0,blockers};
  });
  const byDom={};
  rows.forEach(r=>{ (byDom[r.dom]=byDom[r.dom]||{done:0,total:0}).total++; if(r.done) byDom[r.dom].done++; });
  /* next = the first OPEN unit in declaration order — the syllabus is already ordered by
     dependency and value, so "first open" is the right next thing without inventing a score. */
  const next=rows.find(r=>r.open)||null;
  const doneN=rows.filter(r=>r.done).length;
  return {rows,next,done:doneN,total:rows.length,byDom,
    pct:rows.length?doneN/rows.length:0,
    locked:rows.filter(r=>!r.done&&r.blockers.length).length};
}
function learnDone(s,id){ return (s.events||[]).some(e=>e.type==='learn'&&e.meta&&e.meta.id===id); }
/* ===== v7.77 TEST CONDITIONS =====
   Owner said he'd test AFTER practice. A 40 run on legs that just did two hours in Vegas heat
   is slow, and that number becomes the permanent baseline every future comparison anchors to.
   Conditions are part of the measurement, so the app records them and refuses to treat a
   fatigued test as a clean baseline. It does not discard the number — it labels it. */
const TEST_KEYS=['forty','ten','vert','broad','shuttle'];
/* Patterns, not substrings: the app writes "after a session" and an exact-substring list for
   "after session" would fail to recognise its own output. Tired is checked FIRST — "fresh" can
   appear inside a tired note ("not fresh"), never the reverse. */
const TIRED_RE=/\b(after|post)[\s-]+(a\s+)?(practice|session|lift|workout|game)|\bend of practice\b|\btired\b|\bfatigued\b|\bnot fresh\b|\bpost-practice\b/;
const FRESH_RE=/\bfresh\b|\brested\b|\boff[\s-]?day\b|\b(before|pre)[\s-]+(practice|session|lifting)\b/;
function testFresh(cond){
  const c=String(cond||'').toLowerCase();
  if(!c) return {known:false,fresh:null};
  if(TIRED_RE.test(c)) return {known:true,fresh:false};
  if(FRESH_RE.test(c)) return {known:true,fresh:true};
  return {known:false,fresh:null};
}
/* ===== v7.76 VERIFICATION GATE =====
   The app was badging the 40 as an estimate in one card while still feeding it to
   percentileGap and printing a percentile off it. Documenting a problem is not fixing it.
   A metric is USABLE for a percentile claim only if it was actually measured and is not stale.
   This does not hide the number — it refuses to dress a guess up as a measurement. */
const STALE_DAYS=365;
function metricVerified(s,key,today){
  today=today||todayISO();
  const m=(typeof latestMetric==='function')?latestMetric(s,key):null;
  if(!m) return {have:false,ok:false,why:'nothing logged'};
  const src=String(m.src||'manual').toLowerCase();
  const cond=String(m.cond||'').toLowerCase();
  const estimated=src==='estimate'||/estimate|never timed|guess/.test(cond);
  const age=daysBetween(m.d,today);
  const stale=age>STALE_DAYS;
  /* v7.77: a test taken on fatigued legs is a real number but NOT a clean baseline. */
  const fr=(typeof testFresh==='function')?testFresh(cond):{known:false,fresh:null};
  const tired=(typeof TEST_KEYS!=='undefined'&&TEST_KEYS.includes(key))&&fr.known&&fr.fresh===false;
  return {have:true,val:m.val,d:m.d,age,estimated,stale,tired,freshKnown:fr.known,
    ok:!estimated&&!stale&&!tired,
    why:estimated?'estimated, never measured'
      :stale?('measured '+Math.round(age/30)+' months ago')
      :tired?'measured on tired legs, after a session'
      :'measured'};
}
/* ===== v7.73 THE SCRIPT — one ordered list, no menu =====
   Athlete's own words: "it's all jumbled, 10 layers of questions asked at different times — the
   app should show what to do IN ORDER and then have a discovery area." He also said the barrier
   is starting, not doing: "I'm fine doing the workout alone, it's just actually going and doing
   it." So this returns a numbered sequence with ONE next action, never a menu of competing cards.
   It composes existing engines — decide(), protocolRead(), checkins — and adds no new state. */
function dayScript(s=S,today=todayISO()){
  const out=[];

  const plan=(typeof decide==='function')?decide(s,today):null;

      d:'Status is set. Nothing below is required today and the streak is held. Return-to-play is a medical call, never the app\'s.',done:true,go:null});
    return {rows:out,next:null,done:1,total:1,restDay:true};

      d:plan.workout.recovery?'Easy day by design. Moving counts.':'Open TRAIN and log sets as you go — that\'s the whole ask.',
      done:!!ck[0],go:"go('train')"});

  if(typeof protocolRead==='function'){

    const short=pr.rows.filter(r=>r.cat==='protect'&&!r.met).sort((a,b)=>a.mins-b.mins)[0];
    if(short) out.push({k:'proto',t:short.name+' · '+short.mins+' min',

  if(!ck[2]) out.push({k:'iq',t:'One football IQ rep',
    d:'Film set, playbook card, or a visualization script. Five minutes, no equipment, no weather.',done:false,go:"go('push')"});
  // 5 · fuel + sleep close the day
  if(!ck[1]) out.push({k:'fuel',t:'Eat like you train',d:'Three real meals and water. Under-fuelling during a growth spurt costs growth itself.',done:false,go:null});
  const stgt=(typeof sleepTargetRead==='function')?sleepTargetRead(s):{have:false};
  if(!ck[3]) out.push({k:'sleep',t:stgt.have?('Lights out by '+stgt.lightsOutTxt):'Lights out',
    d:stgt.have?('Your '+stgt.wakeTxt+' wake needs that bedtime for '+stgt.need+' hours. This is the highest-return thing on the list.'):'Log your wake time and the app will work out the real bedtime.',done:false,go:null});
  const done=out.filter(r=>r.done).length;
  return {rows:out,next:out.find(r=>!r.done)||null,done,total:out.length,restDay:false};

/* ===== v7.73 SLEEP TARGET — derived from the wake time, not a fixed number =====
   Found by audit: the Daily Four said "lights out by 10:30" while sleepRead grades against an
   8h bar. On a 6:15am wake that target is 7h45 — the app was guaranteeing a fail against its own
   standard. Adolescents need 8–10h; the clock also runs ~2h late at puberty, so the honest move
   is to derive lights-out from when he ACTUALLY has to get up. */
const SLEEP_NEED=9;           // mid-point of the 8–10h adolescent range
const SLEEP_LATENCY=0.25;     // ~15 min to actually fall asleep
function hhmm(dec){ if(dec==null||isNaN(dec)) return '—';
  let h=Math.floor(((dec%24)+24)%24), m=Math.round((dec-Math.floor(dec))*60);
  if(m===60){h=(h+1)%24;m=0;}
  const ap=h>=12?'pm':'am', h12=(h%12)||12;
  return h12+':'+String(m).padStart(2,'0')+ap; }
function sleepTargetRead(s=S,need=SLEEP_NEED){
  const w=(typeof latestMetric==='function')?latestMetric(s,'wake'):null;
  if(!w) return {have:false,need};
  const wake=+w.val;
  if(isNaN(wake)) return {have:false,need};
  const lightsOut=((wake-need-SLEEP_LATENCY)%24+24)%24;
  const legacy=22.5;                                   // the old fixed 10:30 target
  const legacyHrs=+(((wake-legacy)%24+24)%24 - SLEEP_LATENCY).toFixed(2);
  return {have:true,wake,need,lightsOut,
    wakeTxt:hhmm(wake),lightsOutTxt:hhmm(lightsOut),
    legacyHrs,legacyShort:legacyHrs<8,d:w.d};
}
/* ===== v7.72 THE RECORD — visible progression, honestly built =====
   Owner insight: he loves SEEING self-improvement and quits when progress feels invisible.
   So this is a rank that rises with VERIFIED WORK BANKED — never a prediction of how good he is,
   never a recruiting grade. It counts what actually exists in the log, and it always names the
   single cheapest next thing, which is the whole loop that makes a rank ladder work. */
const RECORD_TIERS=[
  {min:0,   key:'blank',  label:'NO RECORD YET',   read:'Nothing banked. Every rank below is bought with logged work, not talent.'},
  {min:25,  label:'ON THE BOARD',  key:'board',    read:'The record exists. Most athletes never get past this line.'},
  {min:80,  label:'BUILDING',      key:'build',    read:'Enough history that the app can start seeing patterns in it.'},
  {min:200, label:'REAL EVIDENCE', key:'real',     read:'Engines have what they need. This is where the app starts telling you things you did not know.'},
  {min:450, label:'DEEP RECORD',   key:'deep',     read:'A record most college staffs would respect on sight.'},
  {min:900, label:'FOUR-YEAR ARCHIVE',key:'arch',  read:'The thing almost nobody has: a documented four-year climb.'}
];
function recordRead(s=S,today=todayISO()){
  const ck=Object.keys(s.checkins||{}).filter(d=>((s.checkins||{})[d]||[]).some(Boolean)).length;
  const full=Object.keys(s.checkins||{}).filter(d=>((s.checkins||{})[d]||[]).every(Boolean)).length;
  const sets=(s.lifts||[]).length, iq=(s.pushLog||[]).length;
  const ev=t=>(s.events||[]).filter(e=>e.type===t).length;
  const proto=ev('proto'), closeouts=ev('closeout');
  const testKeys=['forty','vert','broad','shuttle','ten'];
  const tested=new Set((s.metrics||[]).filter(m=>testKeys.includes(m.key)).map(m=>m.key)).size;
  const notes=(s.notes||[]).length, clips=(s.clips||[]).length;
  const coach=(s.coach||[]).length, core=(s.core||[]).length, games=(s.games||[]).length;
  const parts=[
    {k:'days',    n:ck,        w:2, label:'days logged'},
    {k:'full',    n:full,      w:1, label:'complete days'},
    {k:'sets',    n:sets,      w:1, label:'lift sets'},
    {k:'iq',      n:iq,        w:1, label:'IQ reps'},
    {k:'proto',   n:proto,     w:1, label:'protocol doses'},
    {k:'closeout',n:closeouts, w:2, label:'nights closed out'},
    {k:'tested',  n:tested,    w:8, label:'tests on record'},
    {k:'clips',   n:clips,     w:4, label:'film clips tagged'},
    {k:'coach',   n:coach,     w:4, label:'coach corrections'},
    {k:'core',    n:core,      w:3, label:'core courses'},
    {k:'games',   n:games,     w:5, label:'games logged'},
    {k:'notes',   n:notes,     w:1, label:'notes'}
  ];
  const pts=parts.reduce((a,p)=>a+p.n*p.w,0);
  let tier=RECORD_TIERS[0], next=null;
  for(const t of RECORD_TIERS) if(pts>=t.min) tier=t;
  next=RECORD_TIERS[RECORD_TIERS.indexOf(tier)+1]||null;
  // the cheapest genuine gap — what a rank ladder needs to feel alive
  const empties=parts.filter(p=>p.n===0).sort((a,b)=>b.w-a.w);
  return {pts,tier,next,toNext:next?next.min-pts:0,
    pct:next?Math.min(1,(pts-tier.min)/Math.max(1,next.min-tier.min)):1,
    parts:parts.filter(p=>p.n>0).sort((a,b)=>(b.n*b.w)-(a.n*a.w)),
    missing:empties.slice(0,3)};
}
/* ===== v7.72 AWAY DAY — the named streak-killer =====
   Owner: "stays the night at his cousin's house and ruins the streak." A chain broken by a
   sleepover teaches the athlete the chain is fake. An away day marked in advance (or same day)
   lowers the bar to ONE box — real work, honestly smaller — and shields the streak. It cannot be
   backdated onto an already-empty past day, so it can never be used to invent history. */
function isAway(s,iso){ return (s.events||[]).some(e=>e.type==='away'&&e.d===iso); }
/* ===== v7.70 PROTOCOL ADHERENCE — descriptive, dose-aware =====
   For the prevention protocols, adherence IS the effect: a program done twice produces nothing.
   So the app reports dose-met, never a score, and never nags more than once per protocol. */
function protocolRead(s=S,today=todayISO()){
  const items=(typeof PROTOCOLS!=='undefined')?PROTOCOLS:[];
  const evs=(s.events||[]).filter(e=>e.type==='proto'&&e.meta&&e.meta.id);
  const rows=items.map(p=>{
    const mine=evs.filter(e=>e.meta.id===p.id);
    const wk=mine.filter(e=>daysBetween(e.d,today)<7).length;
    const days=[...new Set(mine.map(e=>e.d))].sort();
    const last=days.length?days[days.length-1]:null;
    const since=last?daysBetween(last,today):null;
    return {...p,wk,last,since,met:wk>=p.per,pct:p.per?Math.min(1,wk/p.per):0,ever:mine.length};
  });
  const prot=rows.filter(r=>r.cat==='protect');
  return {rows,
    met:rows.filter(r=>r.met).length,total:rows.length,
    protectMet:prot.filter(r=>r.met).length,protectTotal:prot.length,
    minutesLeft:rows.reduce((a,r)=>a+Math.max(0,r.per-r.wk)*r.mins,0),
    coldest:rows.filter(r=>!r.met).sort((a,b)=>((b.since==null?999:b.since)-(a.since==null?999:a.since)))[0]||null};
}
/* Age from class year — used only for the specialization ceiling, never for benchmarking. */
function athleteAge(s=S,today=todayISO()){
  const cls=(s.profile&&s.profile.classOf)||null; if(!cls) return null;
  return 18-(cls-(+String(today).slice(0,4)));
}
/* Specialization ceiling: organised-sport hours per week should not exceed age in years, and
   stay under ~16h. Exceeding the hours-vs-age rule carries significantly higher serious
   overuse-injury risk. Descriptive flag on logged hours — never a training prescription. */
function specializationRead(s=S,today=todayISO()){
  const age=athleteAge(s,today);
  const wk=(s.metrics||[]).filter(m=>m.key==='hrs'&&m.val!=null&&daysBetween(m.d,today)<7);
  if(!wk.length) return {have:false,age};
  const hrs=+wk.reduce((a,b)=>a+(+b.val||0),0).toFixed(1);
  return {have:true,age,hrs,n:wk.length,
    overAge:age!=null&&hrs>age,over16:hrs>16,
    ok:!(age!=null&&hrs>age)&&hrs<=16};
}
/* Overtraining early warning: mood moves BEFORE performance. Over 70% of athletes with
   non-functional overreaching reported the emotional change themselves. Purely descriptive —
   it reports a run of low energy against maintained training, and never diagnoses anything. */
function moodWarn(s=S,today=todayISO()){
  const en=(s.metrics||[]).filter(m=>m.key==='energy'&&m.val!=null)
    .sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.t||0)-(b.t||0)));
  if(en.length<6) return {have:false,n:en.length,need:6};
  const last=en.slice(-3), prior=en.slice(-9,-3);
  if(prior.length<3) return {have:false,n:en.length,need:6};
  const avg=a=>a.reduce((x,y)=>x+(+y.val||0),0)/a.length;
  const recent=+avg(last).toFixed(2), base=+avg(prior).toFixed(2);
  const sets=(s.lifts||[]).filter(l=>daysBetween(l.d,today)<7).length;
  return {have:true,recent,base,drop:+(base-recent).toFixed(2),sets,
    flag:(base-recent)>=1&&recent<=2.7&&sets>0};
}
/* v7.66 medical baseline — latest recorded status per item. Append-only events, correctable by
   a later entry. The app records WHAT WAS TESTED and what the athlete was told; it never
   diagnoses, never interprets a result, and never replaces a clinician. */
function medRead(s=S){

    .sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)
    .forEach(e=>{ out[e.meta.k]={v:e.meta.v,d:e.d}; });
  const items=(typeof MED_ITEMS!=='undefined')?MED_ITEMS:[];
  const open=items.filter(i=>{const r=out[i.k]; return !r||r.v==='not yet'||r.v==='unknown';});
  return {map:out,open,done:items.length-open.length,total:items.length};

/* change-of-direction deficit: 5-10-5 minus a 10yd linear sprint. Separates "slow" from

function codDeficit(s=S){

/* max-velocity exposure: BOTH under- and over-exposure raise hamstring risk (non-linear),

function sprintExposure(s=S,today=todayISO()){

  const n=all.filter(m=>daysBetween(m.d,today)<7).reduce((a,b)=>a+(+b.val||0),0);
  const days=[...new Set(all.map(m=>m.d))].sort();
  const last=days.length?days[days.length-1]:null, gap=last?daysBetween(last,today):null;
  return {n,last,gap,ever:all.length>0,

/* SAFETY RAIL — rapid weight loss. NFHS caps wrestling weight loss at 1.5% of bodyweight per
   week; cutting during puberty is associated with stunted growth. This never sets a target and
   never suggests losing weight: it only raises a hand when the trend is falling too fast. */
function cutRisk(s=S,today=todayISO()){
  const w=(s.metrics||[]).filter(m=>m.key==='wt'&&m.val!=null)
    .sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.t||0)-(b.t||0)));
  if(w.length<2) return {have:false};
  const last=w[w.length-1];
  const ref=[...w].reverse().find(x=>{const dd=daysBetween(x.d,last.d); return dd>=7&&dd<=28;});
  if(!ref) return {have:false};
  const days=daysBetween(ref.d,last.d);
  if(days<=0||!(+ref.val>0)) return {have:false};
  const pctWk=+((((+ref.val)-(+last.val))/(+ref.val))*100*(7/days)).toFixed(2);
  return {have:true,pctWk,from:+ref.val,to:+last.val,days,d:last.d,
          over:pctWk>1.5,phase:(typeof phaseFor==='function'?phaseFor(today):null)};
}
/* ===== v7.76 TEST-DAY PRIORITY =====
   Ranks the missing/unverified measurements by what each unblocks. Descriptive: it states what

function testPriority(s=S,today=todayISO()){
  const items=[
    {key:'forty',name:'40-yard dash',mins:20,unlocks:'Every speed percentile, the laser conversion, and the whole speed recommendation. The current 4.9 was never run against a clock.'},
    {key:'broad',name:'Broad jump',mins:10,unlocks:'The last missing baseline piece — it is actively blocking the speed read. Current value is from 6th-grade track.'},
    {key:'ten',name:'10-yard split',mins:10,unlocks:'More predictive for football than the 40, and fairer while still growing. Nothing logged.'},
    {key:'shuttle',name:'Pro agility 5-10-5',mins:10,unlocks:'With the 10-yard split it yields change-of-direction deficit — turning ability separated from straight-line speed.'},

/* ===== v7.76 RETURN TO PRACTICE =====

function returnRead(s=S,today=todayISO()){

  const deload=(typeof Model!=='undefined'&&Model.deloadFactor)?Model.deloadFactor(s,today):1;

/* Career archive: every season derivable forever from the append-only log */
function careerArchive(s=S){
  const yr=d=>{ const y=+d.slice(0,4); return d.slice(5,7)>='08'?y:y-1; };

  Object.keys(s.checkins||{}).forEach(d=>touch(d,x=>x.checkins++));
  (s.lifts||[]).forEach(l=>touch(l.d,x=>{ x.lifts++; const e=epley(l.wt,l.reps); if(!x.best[l.ex]||e>x.best[l.ex]) x.best[l.ex]=e; }));

/* ONE bottleneck — explicit precedence, and the consensus of systems pointing at it */
function gapBottleneck(s=S,today=todayISO()){
  const {factors,stage}=gapEngine(s,today);

/* PEAK 14 read (v7.28): day counter, phase, test windows A/B, measured deltas when both exist */
function peak14Read(s=S,today=todayISO()){
  if(today<PEAK14.start||today>addDays(PEAK14.end,2)) return null;
  const day=daysBetween(PEAK14.start,today)+1;
  const inWin=(d,anchor)=>Math.abs(daysBetween(anchor,d))<=1;   // test valid on the day or ±1
  const read=anchor=>{ const out={};
    for(const [k] of PEAK14.tests){
      const hits=(s.metrics||[]).filter(x=>x.key===k&&inWin(x.d,anchor)).sort((a,b)=>a.d<b.d?-1:1);
      if(hits.length) out[k]=hits[hits.length-1].val; }
    return out; };
  const A=read(PEAK14.testA), B=read(PEAK14.testB);
  const deltas=PEAK14.tests.map(([k,label,unit,lower])=>{
    if(A[k]==null||B[k]==null) return {k,label,unit,a:A[k]??null,b:B[k]??null,delta:null};
    const d=+(B[k]-A[k]).toFixed(2);
    return {k,label,unit,a:A[k],b:B[k],delta:d,better:lower?d<0:d>0}; });
  const phase=today<PEAK14.testA?'pre':today===PEAK14.testA?'testA':today<PEAK14.testB?'build':today===PEAK14.testB?'testB':'review';
  return {day,phase,A,B,deltas,
    aDone:PEAK14.tests.every(([k])=>A[k]!=null), bDone:PEAK14.tests.every(([k])=>B[k]!=null)};
}

/* ============ v7.33 BEAT LAST WEEK — the push engine's single standard ============
   Owner directive (2026-07-17): "pushed me harder and further than anybody possibly could",
   standard chosen: beat last week. Work is COUNTED, never invented — the engine pushes with
   receipts, not pep talks. The bar is the best of the two previous weeks: a lost week never
   lowers the standard, so slack has a price the engine collects automatically. */
function weekStart(d){ const dt=new Date(d+'T12:00'); const dow=(dt.getDay()+6)%7; return addDays(d,-dow); } // Monday
function weekWork(s,startISO){
  let sets=0,iq=0,notes=0,boxes=0,days=0;
  for(let i=0;i<7;i++){ const d=addDays(startISO,i);
    const dsets=(s.lifts||[]).filter(l=>l.d===d).length;
    const sess=((s.sessions||{})[d]||[]).some(Boolean);
    const ck=(s.checkins||{})[d]||[];
    if(dsets||sess||ck[0]) days++;
    sets+=dsets;
    iq+=(s.pushLog||[]).filter(p=>p.d===d).length;
    notes+=(s.notes||[]).filter(n=>n.d===d).length;
    boxes+=ck.filter(Boolean).length;
  }
  return {days,sets,iq,notes,boxes,actions:sets+iq+notes+boxes};
}
function weekLedger(s=S,today=todayISO()){
  const w0=weekStart(today);
  const cur=weekWork(s,w0), w1=weekWork(s,addDays(w0,-7)), w2=weekWork(s,addDays(w0,-14));
  const bar={days:Math.max(w1.days,w2.days),actions:Math.max(w1.actions,w2.actions)};
  const left=6-((new Date(today+'T12:00').getDay()+6)%7);
  const beat=cur.days>bar.days||(cur.days===bar.days&&cur.actions>bar.actions);
  const level=beat?'won':(cur.days+left>=bar.days)?'alive':'lost';
  return {cur,bar,last:w1,left,beat,level};
}
/* consecutive fully-silent days before today — zero logged anything. Fuel for the receipts callout. */
function silentDays(s=S,today=todayISO()){
  let n=0;
  for(let i=1;i<=14;i++){ const d=addDays(today,-i);
    const any=(s.lifts||[]).some(l=>l.d===d)||((s.checkins||{})[d]||[]).some(Boolean)
      ||(s.pushLog||[]).some(p=>p.d===d)||(s.notes||[]).some(x=>x.d===d)
      ||((s.sessions||{})[d]||[]).some(Boolean)||(s.metrics||[]).some(m=>m.d===d);
    if(any) break; n++;

/* 10 · brain-dump parser — messy text in, SUGGESTIONS out. Suggest-and-approve only:

function dumpParse(txt){
  const out=[]; const t=' '+String(txt||'').toLowerCase()+' ';

  for(const word in lifts){
    let m=t.match(new RegExp('(\\d{2,3})\\s*(?:x\\s*(\\d{1,2})\\s*)?on\\s*'+word))||
          t.match(new RegExp(word+'\\s*(?:at|to|of)?\\s*(\\d{2,3})(?:\\s*x\\s*(\\d{1,2}))?'))||
          t.match(new RegExp('(?:hit|got)\\s*(\\d{2,3})(?:\\s*x\\s*(\\d{1,2}))?\\s*(?:on\\s*)?'+word));
    if(m){ const wt=+m[1],reps=+(m[2]||1);
      if(wt>=45&&wt<=700) out.push({kind:'lift',ex:lifts[word],wt,reps,label:`${lifts[word]} ${wt}×${reps}`}); }
  }
  let m=t.match(/(?:weigh(?:ed|ing)?|bw|bodyweight)\s*(?:at|in at)?\s*(\d{2,3})/)||t.match(/(\d{3})\s*(?:lbs?|pounds)\b/);
  if(m&&+m[1]>=100&&+m[1]<=350) out.push({kind:'metric',key:'wt',val:+m[1],label:`bodyweight ${m[1]} lb`});
  m=t.match(/(\d{2})\s*(?:inch|in|")?\s*(?:standing\s*)?vert/)||t.match(/vert(?:ical)?\s*(?:of|at)?\s*(\d{2})/);
  if(m&&+m[1]>=10&&+m[1]<=50) out.push({kind:'metric',key:'vert',val:+m[1],label:`vertical ${m[1]}"`});
  m=t.match(/(\d\.\d{1,2})\s*(?:forty|40)/)||t.match(/(?:forty|40)[^\d]{0,10}(\d\.\d{1,2})/);
  if(m&&+m[1]>=4&&+m[1]<=7) out.push({kind:'metric',key:'forty',val:+m[1],label:`40yd ${m[1]}s`});
  m=t.match(/slept?\s*(\d{1,2}(?:\.\d)?)/);
  if(m&&+m[1]>=3&&+m[1]<=14) out.push({kind:'metric',key:'sleep',val:+m[1],label:`sleep ${m[1]}h`});

/* ===== Recommendation loop (v7.19) — actions that persist a recommendation as a first-class,
   testable hypothesis and record whether the athlete followed it. Pure evaluation lives in the
   model (recEffectiveness). These mutate the append-only recs log. ===== */
function recLog(kind,text,ctx){ ctx=ctx||{}; const d=todayISO(); const id='rec:'+d+':'+kind;
  S.recs=S.recs||[]; if(S.recs.some(r=>r.id===id)) return id;
  S.recs.push({id,d,kind,text,why:ctx.why||'',ev:ctx.ev||'',unc:ctx.unc||'',asm:ctx.asm||'',outKey:ctx.outKey||null,win:ctx.win||1,followed:null,followedOn:null});
  save(); return id; }
function todayRec(kind){ const id='rec:'+todayISO()+':'+kind; return (S.recs||[]).find(r=>r.id===id)||null; }
function setRecFollow(id,state){ const r=(S.recs||[]).find(x=>x.id===id); if(!r) return; r.followed=state; r.followedOn=todayISO();
  logEvent('recfollow',{id,state}); save(); toast('Logged — the app is learning from it'); if(typeof rToday==='function') rToday(); }

/* ===== Policy actions (v7.20) — the only door through which knowledge changes behavior.
   The system proposes (revisions), policy evaluates (policyEval), the HUMAN decides here.
   Every decision is recorded forever: an append-only 'policy' event carrying evidence basis,
   approval date, version and reason — a reproducible reasoning history. ===== */
const POLICY_VER='7.20';
function approveProposal(id){
  const p=revisions(S).find(x=>x.id===id);
  if(!p){ toast('Proposal no longer exists — evidence changed'); return; }
  if(p.verdict!=='eligible'){ toast('Policy has not cleared this change'); return; }
  S.params.demotedRecs=S.params.demotedRecs||{v:[],basis:'default'};
  if(p.param==='demotedRecs'){
    S.params.demotedRecs.v = id.indexOf('demote:')===0
      ? [...new Set([...S.params.demotedRecs.v, p.kind])]
      : S.params.demotedRecs.v.filter(k=>k!==p.kind);
    S.params.demotedRecs.basis='policy '+todayISO()+' v'+POLICY_VER+' · '+p.fingerprint+' · '+p.explain;
  }
  logEvent('policy',{id:p.id,action:'approved',param:p.param,kind:p.kind,from:p.current,to:p.proposed,
    why:p.reason,evidence:p.fingerprint,bar:p.bar,obs:p.obs,ver:POLICY_VER});
  save(); toast('Approved — behavior changed, decision on permanent record');
  if(typeof rTrack==='function') rTrack();
}
function rejectProposal(id){
  const p=revisions(S).find(x=>x.id===id); if(!p) return;
  logEvent('policy',{id:p.id,action:'rejected',param:p.param,kind:p.kind,evidence:p.fingerprint,bar:p.bar,ver:POLICY_VER});
  save(); toast('Rejected — recorded; identical evidence will not re-ask');
  if(typeof rTrack==='function') rTrack();
}

function sleepSqRead(s=S){
  const by={}; (s.metrics||[]).forEach(m=>{ (by[m.d]=by[m.d]||{})[m.key]=m.val; });
  const lo=[],hi=[];
  for(const d in by){ const o=by[d]; if(o.sleep!=null&&o.sq!=null) (o.sleep>=8?hi:lo).push(o.sq); }

  return {nLo:lo.length,nHi:hi.length,avgLo:avg(lo),avgHi:avg(hi),ready:lo.length>=4&&hi.length>=4};
}

let _setDots={};
function tapSet(i,n){
  const k=todayISO()+':'+i;
  _setDots[k]=((_setDots[k]||0)+1)>n?0:(_setDots[k]||0)+1;
  const full=_setDots[k]===n;
  if(full){ const s=S.sessions[todayISO()]; if(s&&!s[i]){ s[i]=true; save(); } }
  rTrain();

  else if(full) toast('All '+n+' sets done ✓');
}
function tglBlock(i){ const k=todayISO(); if(!S.sessions[k]) return; S.sessions[k][i]=!S.sessions[k][i]; save();

/* v7.64: WALL-CLOCK rest timer. The old decrementing setInterval died the moment it was used —
   iOS suspends timers in a backgrounded PWA, i.e. phone-in-pocket between sets. Derive the
   remaining time from an absolute end-time and repaint on visibilitychange, so it is correct
   the instant the screen comes back regardless of how long the tab was frozen. */
let _rt=null,_rtEnd=0,_rtDone=false;
function _rtPaint(){ const b=$('#restBtn'); if(!b) return;
  const left=Math.max(0,Math.ceil((_rtEnd-Date.now())/1000));
  if(left>0){ const m=Math.floor(left/60), s2=String(left%60).padStart(2,'0'); b.textContent='⏱ '+m+':'+s2; }
  else { if(_rt){ clearInterval(_rt); _rt=null; } b.textContent='⏱ GO — next set';
    if(!_rtDone){ _rtDone=true; try{ if(typeof navigator!=='undefined'&&navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} toast('Rest over. Move.'); } }
}
function restTimer(sec){ if(_rt){ clearInterval(_rt); _rt=null; } _rtEnd=Date.now()+sec*1000; _rtDone=false; _rt=setInterval(_rtPaint,250); _rtPaint(); }
if(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('visibilitychange',()=>{ if(!document.hidden) _rtPaint(); });
function logLift(){
  const ex=$('#lgEx').value, wt=+$('#lgWt').value, reps=+$('#lgRp').value;
  if(!wt||!reps||reps>15||wt<5||wt>700){ toast('Enter a real weight + reps (≤15)'); return; }
  const ref=Math.max(S.prs[ex]||0, Model.momentum().bestE1rm[ex]||0);
  if(ref&&epley(wt,reps)>ref*1.5&&pendingLift!==ex+wt+'x'+reps){
    pendingLift=ex+wt+'x'+reps;
    toast('That\'s '+Math.round(100*epley(wt,reps)/ref)+'% of your best — tap LOG SET again if it\'s real');
    return;
  }
  pendingLift=null;
  S.lifts.push({d:liftYest?addDays(todayISO(),-1):todayISO(),ex,wt,reps}); liftYest=false; save();
  const e=epley(wt,reps), cur=S.prs[ex];
  if(cur&&e>cur){
    $('#prSuggest').innerHTML=`<div class="flag">⬆ Estimated 1RM <b class="mono">${e}</b> beats your ${esc(ex)} PR (<span class="mono">${cur}</span>).
      <button class="btn sm amber" style="margin-left:8px" onclick="acceptPR('${ex}',${e})">UPDATE PR</button></div>`;
    toast('Set logged — possible PR');
  } else { toast('Set logged ✓'); rTrain(); }
}
function acceptPR(ex,e){
  const old=S.prs[ex]||0;
  S.prs[ex]=e;
  logEvent('pr',{ex,val:e,to:e,lift:ex,dow:new Date().getDay()});
  save();
  /* the single most earned moment in the product — it gets the biggest response */
  celebrate('NEW '+ex.toUpperCase()+' — '+e+' LB'+(old?'  (+'+(e-old)+')':''), true);
  rTrain();
}

function syncSetup(){
  const txt=(($('#syncCfgIn')||{}).value||'');
  const cfg={}; const re=/(\w+)\s*:\s*["']([^"']+)["']/g; let mt;
  while((mt=re.exec(txt))) cfg[mt[1]]=mt[2];
  if(!cfg.apiKey||!cfg.projectId||!cfg.appId){ toast('That is not a full Firebase config — paste the whole snippet including apiKey, projectId, appId'); return; }
  try{ localStorage.setItem(SYNC_KEY,JSON.stringify(cfg)); }catch(e){ toast('Could not store config'); return; }
  toast('Config saved — now sign in');
  rSyncUI(); cloudBoot();
}
function syncGo(create){
