function buildOverview(b){const B=D1BUILD,current=b&&!b.invalid,active=current&&!b.expired&&!b.planned,templates=b?.layout||'full3';return `${current?section('Current 12-week block',`<h2>${esc(b.phase?.name||'Review required')}</h2><p>${esc(b.phase?.goal||'Block not yet active or ended.')}</p><p>${esc(b.layout==='full3'?'Three-day full-body':'Four-day upper/lower split')} · ${b.days.map(d=>B.DAYS[d]).join(' / ')} · ${b.competent?'Established coached technique':'Foundation competence'} · ${esc(b.equipment)}</p><p class="small">Coach review: ${esc(b.coach)} (athlete-entered). ${b.contextChanged?'Context changed: new activation required.':''} ${b.reviewDue?'Review overdue/held.':''}</p>${active?`<form data-form="build-review" data-context="${esc(b.blockId)}">${select('buildDecision','Actual coach decision',[['continue','Continue current block'],['reduce','Reduce volume until next review'],['hold','Hold physical development']])}${input('buildReviewCoach','Coach who reviewed actual evidence','text','','required maxlength="100"')}${area('buildReviewEvidence','Working-set quality, field results and recovery behind this decision')}${check('buildReviewConfirmed','This review actually happened; no automatic load increase')}<button class="primary wide">Save actual block review</button></form>`:''}${btn('End this block · retain records','build-end','wide')}`):''}${section('Session structure',`<p>Speed/power, when approved and fresh, comes before strength. Compound patterns come before assistance. Full rest intervals are retained; no conditioning finisher.</p>${buildTable(['Session','Movement sequence'],B.TEMPLATES[templates].map((ids,i)=>[templates==='full3'?'Full-body '+['A','B','C'][i]:['Upper A','Lower A','Upper B','Lower B'][i],ids.map(id=>B.MOVES[id].name).join(' → ')]))}<p class="small">Familiar coach-selected versions only. Neck/grip work is not automatically added: review gentle neck isometrics and existing pulling/grip demand with your coach. Existing sessions count; more exercises are not the goal.</p>${btn('Preview phase-specific sets / repetitions','build-preview','wide')}${btn('Open actual supervised session','go:train','primary wide')}`)}${section('Fresh speed and power slots',`<p>Up to two approved exposures embedded before strength—not additional hard days. Deload/review weeks, recent speed/lower work, amber readiness and symptoms hold maximal exposure.</p><ol><li><b>Baseline:</b> familiar 10-yard starts, up to 4 quality reps with 2–3 minutes recovery; coach selects projection and surface.</li><li><b>Build/force:</b> coach may choose 10–20-yard starts or a separately established flying protocol. Distance/loading changes require an actual coach decision, not a week number.</li><li><b>Transfer:</b> retain one acceleration and one established maximum-velocity emphasis. Coach may place familiar low-volume jumps/throws before strength instead of extra contacts.</li></ol><p>Stop for pain or degraded movement. Timing loss can reflect noise; a same-method drop outside the coach’s entered error threshold means stop/review, not sprint harder. Hill/sled work replaces starts; do not add both. No depth jumps, heavy sled percentage or high-speed exposure inferred from bodyweight.</p>${btn('Same-setup speed / jump dashboard','go:performance','wide')}`)}${section('12-week priorities',buildTable(['Weeks','Priority','Main / assistance sets'],B.PHASES.map(x=>[x.weeks.join(', '),x.name,x.main+' / '+x.assist])))}${!active?details('Register a replacement off-season block',`<p>Use this with your coach and parent. Current team/other-sport training must be absent and confirmed in Schedule. Resolve symptoms professionally first. A four-day split is optional, not an upgrade by default.</p><form data-form="build-block">${select('buildLayout','Coached layout',[['full3','3 full-body days · default'],['split4','4-day upper/lower · established technique only']])}${input('buildStart','Start date (Pacific)','date',day(),'required')}${input('buildMonths','Months of actual coached lifting','number','','min="0" max="120" required')}${input('buildCoach','Reviewing qualified coach','text','','required maxlength="100"')}${input('buildEquipment','Exact familiar equipment / technique context','text','','required maxlength="300"')}${[0,1,2,3].map(i=>select('buildDay'+i,['Session A day','Session B day','Session C day','Session D day (split only)'][i],B.DAYS.map((x,d)=>[String(d),x]),String([1,3,5,6][i]))).join('')}${check('buildCompetent','Coach observed consistent competence in these familiar movements')}${check('buildOther','Coach reviewed PE, other activity, rest days and total weekly work')}${check('buildParent','Parent/guardian reviewed this ordinary training block')}${check('buildSpeed','Coach approved a familiar, separately progressed sprint protocol')}${check('buildPower','Coach approved familiar low-volume power preparation')}${check('buildConfirmed','This coach review actually happened; this replaces rather than adds to training')}<button class="primary wide">Activate reviewed training block</button></form>${btn('Confirm actual schedule first','go:schedule','wide')}`):''}`;}

async function ascSubmit(form){const f=form.dataset.form,a=asc();if(!f.startsWith('asc-'))return false;
 if(f==='asc-context')await log('rb-context',a.contextPayload({date:value('ascContextDate'),phase:value('ascPhase'),equipment:value('ascEquipment'),supervision:value('ascSupervision'),note:value('ascContextNote'),confirmed:checked('ascContextConfirmed')},S,now()),crypto.randomUUID());

 else if(f==='asc-outcome'){const m=a.mission(S,now());if(form.dataset.context!==m.id)throw Error('The mission changed. Reopen it before logging.');const p=a.outcome({missionId:m.id,completion:value('ascComplete'),execution:value('ascExecution'),note:value('ascOutcomeNote'),observer:value('ascObserver'),context:value('ascOutcomeContext'),coachReviewed:checked('ascOutcomeCoach')},m,now());let next=C.event(S,'rb-mission',{date:day(),mission:m},now(),m.id);next=C.event(next,'rb-outcome',p,now(),m.id);await save(next);page='today';}
 else if(f==='asc-term'){await log('rb-term',a.terminology({date:value('ascTermDate'),skill:ascSkill,term:value('ascTerm'),cue:value('ascTermCue'),coach:value('ascTermCoach'),reviewed:checked('ascTermReviewed')},now()),crypto.randomUUID());}
 else if(f==='asc-quiz'){if(value('ascQuizAnswer')==='')throw Error('Choose your independent answer');const p=a.quiz(S,{questionId:form.dataset.context,answer:Number(value('ascQuizAnswer'))},now());await log('rb-quiz',p,crypto.randomUUID());ascLastQuiz={id:p.questionId,correct:p.correct};}
 else if(f==='asc-measurement'){const metric=value('ascMetric');if(ascMeasureEdit&&!a.events(S,'rb-measurement',now()).some(e=>e.id===ascMeasureEdit))throw Error('Original measurement not found');const p=a.measurement({date:value('ascMeasureDate'),metric,unit:a.METRICS[metric]?.[1],value:value('ascMeasureValue'),assessmentType:value('ascMeasureType'),method:value('ascMeasureMethod'),reps:value('ascMeasureReps'),equipment:value('ascMeasureEquipment'),protocol:value('ascMeasureProtocol'),environment:value('ascMeasureEnvironment'),start:value('ascMeasureStart'),footwear:value('ascMeasureFootwear'),observer:value('ascMeasureObserver'),verification:value('ascMeasureVerification'),sourceRef:value('ascMeasureSource'),relatedSession:value('ascMeasureSession'),athleteId:WORKSPACE.id,revisionOf:ascMeasureEdit},now());await log('rb-measurement',p,crypto.randomUUID());ascMeasureEdit='';page='progress';}
 else return false;
 return true;
}
async function ascAction(action){if(action.startsWith('asc-add:')){ascKind=action.slice(8);page='rb-observation';render();return true;}if(action==='asc-outcome'){const m=asc().mission(S,now());await log('rb-mission',{date:day(),mission:m},m.id);page='rb-outcome';render();return true;}if(action.startsWith('asc-window:')){ascWindow=Number(action.slice(11));render(false);return true;}if(action==='asc-save-review'){await log('rb-review',{date:day(),review:asc().weekly(S,now(),ascWindow)},crypto.randomUUID());return true;}if(action==='asc-next-quiz'){const qs=asc().quizQueue(S,now());ascQuizId=(qs.find(q=>q.due&&q.id!==ascQuizId)||qs.find(q=>q.id!==ascQuizId)||qs[0]).id;ascLastQuiz=null;render(false);return true;}if(action.startsWith('asc-measure-edit:')){ascMeasureEdit=action.slice(17);page='rb-measurement';render();return true;}return false;}

(function(root,factory){const x=factory(typeof module==='object'?require('./core.js'):root.D1,typeof module==='object'?require('./ascension.js'):root.D1ASC);if(typeof module==='object')module.exports=x;else root.D1Titan=x;})(globalThis,function(C,A){

const text=(v,name,max=1000)=>{if(typeof v!=='string'||!v.trim()||v.length>max)throw Error('Enter '+name+' (up to '+max+' characters)');return v.trim();};
const date=(v,n)=>{if(!C.validDate(v)||v>C.date(n))throw Error('Observation date must be real and not in the future');return v;};
const number=(v,name,min,max)=>{if(v===''||v==null||!Number.isFinite(Number(v))||Number(v)<min||Number(v)>max)throw Error('Check '+name);return Number(v);};
const optional=v=>v?text(v,'a shorter note'):'';
function upgrade(raw){const s=A.upgrade(raw);if(s.settings.titanVersion!==1){s.archives=C.union(s.archives,[{id:'titan-migration-'+C.hash(s.settings),reason:'Pre-Titan settings preserved; football position remains RB, no sport automatically primary.',raw:C.clone(s.settings)}]);s.settings.titanVersion=1;s.settings.developmentMode='general';s.settings.primarySport='none';}s.version=VERSION;return s;}
const removed=s=>new Set(s.events.filter(e=>e.type==='titan-exclude').map(e=>e.payload.target));
const events=(s,type,n=new Date())=>A.events(s,type,n).filter(e=>!removed(s).has(e.id));
function calendarPayload(r,n=new Date()){
 if(!SPORTS.includes(r.sport)||!['practice','competition','lifting','speed','school','rest'].includes(r.kind)||!['confirmed','tentative','cancelled'].includes(r.status))throw Error('Choose sport, session type and status');
 if(!C.validDate(r.on)||C.days(C.date(n),r.on)>366||!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end)||r.start>=r.end)throw Error('Use a dated same-day start and finish');

async function titanSubmit(form){const f=form.dataset.form,T=titan();if(!f.startsWith('titan-'))return false;
 if(f==='titan-context')await log('titan-context',T.contextPayload({date:value('ttDate'),phase:value('ttPhase'),emphasis:value('ttEmphasis'),sports:Object.fromEntries(T.SPORTS.slice(1).map(k=>[k,value('tt-'+k)])),equipment:value('ttEquipment'),supervision:value('ttSupervision'),trackEvents:value('ttTrackEvents'),note:value('ttNote'),confirmed:checked('ttConfirmed')},S,now()),crypto.randomUUID());
 else if(f==='titan-calendar')await log('titan-calendar',T.calendarPayload({date:value('tcDate'),on:value('tcOn'),start:value('tcStart'),end:value('tcEnd'),sport:value('tcSport'),kind:value('tcKind'),status:value('tcStatus'),hard:checked('tcHard'),source:value('tcSource'),note:value('tcNote')},now()),crypto.randomUUID());
 else if(f==='titan-observation'){const p=T.observation({date:value('toDate'),sport:value('toSport'),quality:value('toQuality'),result:value('toResult'),basis:value('toBasis'),observer:value('toObserver'),context:value('toContext'),note:value('toNote'),cue:value('toCue'),reviewed:checked('toReviewed'),priority:checked('toPriority'),mediaRef:value('toMedia'),viewed:checked('toViewed')},now());if(titanEditId){const old=S.events.find(e=>e.id===titanEditId&&e.type==='titan-observation');if(!old)throw Error('Original observation not found');p.revisionOf=titanEditId;let next=C.event(S,'titan-exclude',{date:day(),target:titanEditId,reason:'Corrected with new source record'},now(),crypto.randomUUID());next=C.event(next,'titan-observation',p,now(),crypto.randomUUID());await save(titanDecisionHistory(next,'titan-observation-correction'));}else await log('titan-observation',p,crypto.randomUUID());titanEditId='';page='today';}
 else if(f==='titan-outcome'){const m=T.mission(S,now());if(m.id!==form.dataset.context)throw Error('The mission changed. Reopen it before logging.');await log('titan-outcome',asc().outcome({missionId:m.id,completion:value('ttComplete'),execution:value('ttExecution'),note:value('ttOutcome'),observer:value('ttObserver'),context:value('ttConditions'),coachReviewed:checked('ttReviewed')},m,now()),m.id);page='today';}
 else if(f==='titan-set')await log('titan-set',T.setPayload({date:value('tsDate'),exercise:value('tsExercise'),equipment:value('tsEquipment'),sport:value('tsSport'),load:value('tsLoad'),unit:value('tsUnit'),reps:value('tsReps'),set:value('tsSet'),rir:value('tsRir'),technique:value('tsTechnique'),context:value('tsContext'),supervisor:value('tsSupervisor'),supervised:checked('tsSupervised'),familiar:checked('tsFamiliar')},now()),crypto.randomUUID());
 else if(f==='titan-ai-prepare'){titanPrepared=window.D1TitanAI.prepare(S,value('taMode'),value('taQuestion'),now());titanResult=null;titanAIError='';page='titan-ai';}
 else if(f==='titan-ai-send'){
  if(titanAIWaiting)throw Error('An AI request is already running');if(!titanPrepared||!checked('taConsent')||!checked('taGuardian'))throw Error('Review the payload and parent/guardian consent first');if(titanPrepared.sourceState!==C.hash([S.events,S.facts,S.fixtures]))throw Error('Records changed. Prepare a new evidence preview.');
  const token=value('taToken');$('taToken').value='';const prepared=titanPrepared;titanAIWaiting=true;titanAIError='';titanController=new AbortController();render(false);
  try{const r=await window.D1TitanAI.analyze(prepared,{endpoint:window.D1AI_CONFIG?.endpoint,token,signal:titanController.signal});if(!titanPrepared||prepared.sourceState!==C.hash([S.events,S.facts,S.fixtures]))throw Error('Evidence or permissions changed; response was discarded.');titanResult={...r,mapping:prepared.mapping};await log('titan-ai',{date:day(),question:prepared.request.question,requestFingerprint:prepared.fingerprint,sourceIds:Object.values(prepared.mapping),result:titanResult,classification:'AI INTERPRETATION'},crypto.randomUUID());}
  catch(err){titanAIError=err.name==='AbortError'?'AI request cancelled or timed out. No changes applied.':err.message;}finally{titanAIWaiting=false;titanController=null;}
 }
 else if(f==='titan-ai-confirm'){if(!titanResult)throw Error('No AI result to review');await log('titan-memory',T.memoryPayload({date:day(),note:value('taCorrection'),sourceIds:titanResult.analysis.evidenceIds.map(id=>titanResult.mapping[id]),confirmed:checked('taConfirm')},S,now()),crypto.randomUUID());}
 else if(f==='titan-memory-revise'){const old=S.events.find(e=>e.id===form.dataset.context&&e.type==='titan-memory');if(!old||T.removed(S).has(old.id))throw Error('Select an active interpretation to revise');await log('titan-memory',T.memoryPayload({date:day(),note:value('tmNote'),sourceIds:old.payload.sourceIds,revisionOf:old.id,confirmed:checked('tmConfirm')},S,now()),crypto.randomUUID());}
 else if(f==='titan-exclude'){if(!checked('teConfirm'))throw Error('Confirm exclusion first');const e=S.events.find(e=>e.id===form.dataset.context);if(!e||!e.type.startsWith('titan-')||['titan-context','titan-exclude'].includes(e.type))throw Error('This record cannot be excluded here');await log('titan-exclude',{date:day(),target:e.id,reason:'Explicit user exclusion; original retained'},crypto.randomUUID());}
 else if(f==='titan-block')await log('titan-block',T.blockPayload({date:value('tbDate'),kind:value('tbKind'),question:value('tbQuestion'),protocol:value('tbProtocol'),coach:value('tbCoach'),reviewDate:value('tbReview'),coachReviewed:checked('tbConfirmed'),baselineIds:[]},now()),crypto.randomUUID());
 else if(f==='titan-block-review')await log('titan-block-review',T.blockReview({date:day(),blockId:value('tbrId'),decision:value('tbrDecision'),outcome:value('tbrOutcome'),confounders:value('tbrConfounders'),evidenceIds:[]},S,now()),crypto.randomUUID());
 else return false;
 render(false);return true;
}
async function titanAction(a){if(a==='titan-outcome'){page='titan-outcome';render();return true;}if(a.startsWith('titan-source:')){titanSourceId=a.slice(13);page='titan-source';render();return true;}if(a.startsWith('titan-correct:')){titanEditId=a.slice(14);page='titan-observation';render();return true;}if(a.startsWith('titan-window:')){titanWindow=Number(a.slice(13));render(false);return true;}if(a==='titan-save-review'){await log('titan-review',{date:day(),review:titan().weekly(S,now(),titanWindow)},crypto.randomUUID());render(false);return true;}if(a==='titan-explain'||a.startsWith('titan-ai-mode:')){const mode=a==='titan-explain'?'mission':a.slice(14),m=titan().mission(S,now());titanPrepared=window.D1TitanAI.prepare(S,mode,mode==='mission'?'Explain the evidence limits and coaching questions behind this locally selected mission: '+m.title:'Review the '+mode+' evidence and identify one useful question for coach.',now());titanResult=null;page='titan-ai';render();return true;}if(a==='titan-ai-revoke'){titanController?.abort();titanPrepared=null;titanResult=null;titanAIError='Session permission revoked. No further request is authorized.';render(false);return true;}if(a==='titan-proposal'){if(!titanResult)throw Error('No AI proposal to review');await log('titan-proposal',{date:day(),action:titanResult.analysis.action,sourceIds:titanResult.analysis.evidenceIds.map(id=>titanResult.mapping[id]),status:'Coach-discussion draft; no plan changes or approval'},crypto.randomUUID());message('Saved for coach discussion. No training or fact changes.');return true;}return false;}

</script><script>
'use strict';
const C=window.D1,WS=window.D1WS,WK=WS.keys(WORKSPACE.id),K=WK.state,BK=WK.snapshot,J=WK.journal;

C.registerAscensionGuard(window.D1Titan.guard);
let S=window.D1Titan.upgrade(WS.seed(WORKSPACE,C)),page='today',tab='ball',notice='',storage='checking',db=null,imported=null,rawCopies={},pending=null,busy=false,runner=null,restUntil=0,timer=null,importReadGeneration=0;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date(),day=()=>C.date(now()),value=id=>$(id)?.value??'',num=id=>value(id)===''?null:Number(value(id)),checked=id=>!!$(id)?.checked;
const btn=(t,a,cls='')=>`<button type="button" class="${cls}" data-act="${a}">${t}</button>`;
const input=(id,label,type='text',v='',extra='')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(v??'')}" ${extra}></label>`;
const select=(id,label,opts,v='')=>`<label>${label}<select id="${id}">${opts.map(o=>{const [k,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(k)}" ${k===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
const area=(id,label,v='')=>`<label>${label}<textarea id="${id}" maxlength="2000">${esc(v)}</textarea></label>`;
const check=(id,label,on=false)=>`<label class="check"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${label}</span></label>`;
const section=(title,body,kicker='')=>`<section class="section">${kicker?`<div class="eyebrow">${kicker}</div>`:''}<h2>${title}</h2>${body}</section>`;
const details=(title,body,open=false)=>`<details ${open?'open':''}><summary>${title}</summary>${body}</details>`;
const evidence=(ids='DESIGN')=>`<div class="source">${ids.split(/\s+/).filter(id=>CONTENT.sources.some(s=>s[0]===id)).map(id=>`<button class="link" data-act="source:${id}">${id} ↗</button>`).join('')}<div>Exact app doses and decision cutoffs are coaching choices unless stated otherwise.</div></div>`;
const history=(type,filter=()=>true)=>{const x=S.events.filter(e=>e.type===type&&filter(e)).sort((a,b)=>b.ts.localeCompare(a.ts));return x.length?x.slice(0,12).map(e=>`<div class="history"><b>${esc(e.payload.date)}</b><p>${esc(Object.entries(e.payload).filter(([k])=>k!=='date').map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · '))}</p></div>`).join(''):'<p class="muted">No entries yet. Nothing has been inferred.</p>';};
function message(text){notice=text;$('toast').textContent=text;}
function download(name,data,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);}
function exportData(panic=false){captureDrafts();if(panic){for(const key of [K,BK,J,DRAFT_KEY,...legacyKeys]){try{const raw=localStorage.getItem(key);if(raw)rawCopies[key]=raw;}catch{}}}download(`d1os-${panic?'recovery':'record'}-${day()}.json`,JSON.stringify(panic?{app:'D1OS recovery',state:S,pending,rawCopies,unsubmittedDrafts:drafts}:S,null,2));message('Download requested. Check Files / Downloads before deleting or replacing anything.');}
function readStored(raw,key){let parsed=JSON.parse(raw);const older=key==='d1os_v7'||key.startsWith('legacy:');if(older){if(!parsed||!Number.isInteger(parsed.v)||!parsed.profile||!Array.isArray(parsed.events)||!Array.isArray(parsed.lifts))throw Error('Unrecognized older record');parsed={app:'d1os',v:parsed.v,data:parsed};}const state=WS.bind(window.D1Titan.upgrade(C.migrate(parsed)),WORKSPACE.id,C);if(older)state.archives=[{id:'legacy-bytes-'+C.hash(raw),raw,source:key,reason:'Older app history preserved verbatim; not mapped into current charts or recommendations.'}];return state;}
function legacyRead(){return new Promise(resolve=>{if(!window.indexedDB)return resolve({});let settled=false,connection;const found={},finish=()=>{if(settled)return;settled=true;if(connection)connection.close();resolve(found);};let req;try{req=indexedDB.open('d1os-mirror');}catch{return finish();}req.onupgradeneeded=()=>req.transaction.abort();req.onerror=finish;req.onblocked=finish;req.onsuccess=()=>{connection=req.result;if(settled){connection.close();return;}if(!connection.objectStoreNames.contains('kv'))return finish();try{const tx=connection.transaction('kv','readonly');for(const key of ['state','snap:last-known-good']){const read=tx.objectStore('kv').get(key);read.onsuccess=()=>{if(typeof read.result==='string')found['legacy:'+key]=read.result;};}tx.oncomplete=finish;tx.onerror=finish;tx.onabort=finish;}catch{finish();}};setTimeout(finish,1500);});}
function dbOpen(){return new Promise(resolve=>{if(!window.indexedDB)return resolve(null);let done=false;const finish=x=>{if(!done){done=true;resolve(x);}};const r=indexedDB.open('d1os-v14',1);r.onupgradeneeded=()=>r.result.createObjectStore('records');r.onsuccess=()=>finish(r.result);r.onerror=()=>finish(null);setTimeout(()=>finish(null),1500);});}
function dbRead(){return new Promise(resolve=>{if(!db)return resolve(null);const r=db.transaction('records').objectStore('records').get(K);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);setTimeout(()=>resolve(null),1500);});}
function dbWrite(raw){return new Promise(resolve=>{if(!db)return resolve(false);try{const t=db.transaction('records','readwrite');t.objectStore('records').put(raw,K);t.oncomplete=async()=>resolve((await dbRead())===raw);t.onerror=()=>resolve(false);setTimeout(()=>resolve(false),1500);}catch{resolve(false);}});}
async function save(next){next=WS.bind(window.D1Titan.upgrade(next),WORKSPACE.id,C);if(storage==='recovery')throw Error('Original damaged records preserved. Export recovery data before restoring a valid backup.');pending=next;
 try{const existing=localStorage.getItem(K);if(existing){try{const live=WS.bind(C.validate(JSON.parse(existing)),WORKSPACE.id,C);if(live.meta?.updated!==S.meta?.updated||C.canon(live)!==C.canon(S))next=C.merge(next,live);}catch(e){rawCopies[K]=existing;next.archives=C.union(next.archives,[{id:'unreadable-'+C.hash(existing),raw:existing,reason:'Unreadable storage bytes retained during recovery'}]);}}const raw=JSON.stringify(next);localStorage.setItem(J,raw);if(localStorage.getItem(J)!==raw)throw Error('Journal read-back failed');const prior=localStorage.getItem(K);if(prior){localStorage.setItem(BK,prior);if(localStorage.getItem(BK)!==prior)throw Error('Snapshot read-back failed');}localStorage.setItem(K,raw);if(localStorage.getItem(K)!==raw)throw Error('Primary read-back failed');S=next;pending=null;storage='local';const mirror=await dbWrite(raw);if(mirror)storage='mirrored';localStorage.removeItem(J);message('Saved on this device'+(mirror?' · secondary copy checked.':'. Export a backup regularly.'));}
 catch(e){S=next;pending=next;storage='unsaved';message('Save failed: '+e.message+'. Your pending entry is in Panic export.');throw e;}
 render(false);
}
function titanDecisionHistory(next,type){
 const previous=window.D1Titan.mission(S,now());
 if(!['titan-ai','titan-memory','titan-proposal','titan-review','titan-decision'].includes(type)){
 const current=window.D1Titan.mission(next,now());if(previous.id!==current.id||previous.action!==current.action)next=C.event(next,'titan-decision',{date:day(),triggerType:type,triggerIds:next.events.filter(e=>!S.events.some(old=>old.id===e.id&&C.canon(old)===C.canon(e))).map(e=>e.id),previous:{id:previous.id,action:previous.action},current:{id:current.id,action:current.action},reason:current.reasonForSelection,review:'Coach review required; no automatic training or safety changes'},now(),crypto.randomUUID());}
 return next;
}

function exerciseList(kind,mode='standard'){if(/^build-[a-d]$/.test(kind))return D1BUILD.exercises(S,D1BUILD.block(S,now()),kind,mode,now());if(['block-a','block-b'].includes(kind))return window.D1DEV.exercises(window.D1DEV.block(S,now()),kind,mode,{bench:workingLoad('bench')?.lb,trap:workingLoad('trap')?.lb});const f=S.facts,load=(id,pct)=>workingLoad(id)?.lb??(C.live(f[id],now())?Math.floor(f[id].value*pct/5)*5:null);const upper=[{id:'bench',name:'Bench press',sets:3,reps:5,load:load('bench',.70),pct:workingLoad('bench')?'Reported coach working load':'70% of reported best',rest:150,structures:'Pectorals, triceps, anterior deltoid',why:'Maintain pressing strength with low fatigue.',sub:'Push-up (equipment only)',tempo:'Controlled lowering; smooth press. Spotter and safeties.'},{id:'row',name:'Chest-supported row',sets:2,reps:8,load:null,pct:null,rest:90,structures:'Upper back, elbow flexors',why:'Balance pressing and train controlled shoulder movement.',sub:'Band row',tempo:'No swinging; pause briefly at top.'},{id:'deadbug',name:'Dead bug',sets:2,reps:6,load:0,rest:60,structures:'Trunk control',why:'Control ribs/pelvis with normal breathing.',sub:'Supine heel slide',tempo:'Slow alternating reps, each side.'}];
const lower=[{id:'trap',name:'Trap-bar deadlift',sets:2,reps:4,load:load('trap',.65),pct:workingLoad('trap')?'Reported coach working load':'65% of reported best',rest:180,structures:'Hip/knee extensors, trunk',why:'One primary lower lift maintains force exposure without doubling heavy patterns.',sub:'Bodyweight split squat',tempo:'Controlled lowering; stand smoothly. Confirm bar weight / handle height.'},{id:'split',name:'Bodyweight split squat',sets:2,reps:6,load:0,rest:90,structures:'Quadriceps, gluteals, hip control',why:'Small controlled single-leg dose; skip if unfamiliar.',sub:'Supported sit-to-stand',tempo:'Controlled, each side; no forced range.'},{id:'calf',name:'Calf raise',sets:2,reps:10,load:0,rest:60,structures:'Calf–Achilles complex',why:'A small familiar ankle-strength dose.',sub:'Seated unloaded calf raise',tempo:'Controlled rise/lower; no bouncing.'}];let a=kind==='lower'?lower:upper;if(mode==='short')a=a.slice(0,2).map(e=>({...e,sets:2}));if(mode==='none')a=a.slice(0,2).map(e=>({...e,id:e.id+'-sub',name:e.sub,load:0,pct:null,sets:2,reps:6}));return a;}
function sessionPreview(){const p=C.plan(S,now());if(p.adaptive)return buildPreview();if(p.development?.mode==='off-season')return developmentSessionPreview(p);const sq=S.facts.squat,squatLoad=C.live(sq,now())?`${Math.floor(sq.value*.65/5)*5} lb (65% of reported ${esc(sq.value)} lb, rounded down)`:'no calculated load: reconfirm squat data first';return `<span class="eyebrow">Training plan / preview only</span><h1>Enough stimulus.<br>Room to recover.</h1><p>The runner opens only in a suitable window after today’s check-in. Preview is always available.</p>${['upper','lower'].map(k=>section(k==='upper'?'Upper maintenance':'Lower maintenance',exerciseList(k).map(e=>`<div class="row"><div><b>${e.name}</b><small>${e.sets} × ${e.reps} · ${e.load===null?'choose light familiar load':e.load===0?'bodyweight':e.load+' lb suggested'} · 3–4 RIR · ${e.rest}s rest</small><small>${e.why}</small></div></div>`).join('')+(k==='lower'?`<p class="small">A coach may substitute squat 2 × 4, starting near ${squatLoad}, instead of trap bar. Never add both as main lifts here.</p>`:''))) }${evidence('YOUTH MAINT DESIGN')}`;}
function runnerPage(){if(!runner)return sessionPreview();const e=runner.sets[runner.index];if(!e)return `<h1>Session complete.</h1><p>${runner.sets.length} sets recorded. Eat, recover and review how the work felt. No bonus conditioning.</p>${btn('Return to Train','go:train','primary wide')}`;const last=S.events.filter(x=>x.type==='set'&&x.payload.exercise===e.id).sort((a,b)=>b.ts.localeCompare(a.ts))[0]?.payload;return `<div class="runner"><div class="between"><span class="eyebrow">${runner.kind} / ${runner.mode}</span><span class="tag">${runner.index+1} / ${runner.sets.length}</span></div><div class="progress"><span style="width:${100*runner.index/runner.sets.length}%"></span></div><h1>${esc(e.name)}</h1><p>${e.reps} reps${e.id==='split'||e.id==='deadbug'?' each side':''} · ${e.minRir??3}+ reps in reserve</p><div class="load">${e.load===null?'Choose light':e.load===0?'Bodyweight':e.load}<small>${e.load?' lb':''}</small></div><div class="small">${e.pct||'Use familiar, pain-free technique'} · ${e.rest}s rest</div><form data-form="set"><div class="grid2">${input('setLoad','Actual total load, lb','number',e.load??'','min="0" max="1000" step="0.5" required')}${input('setReps','Actual reps','number',e.reps,'min="0" max="50" required')}</div><div class="grid2">${select('rir','Reps left in reserve',['0','1','2','3','4','5+'],'3')}<div><p class="small">Rest after this set</p><b>${e.rest} seconds</b></div></div>${select('setTechnique','Technique quality',['unknown','steady','deteriorated'],'unknown')}<button class="primary wide">Complete this set →</button>${details('Plate math / equipment / notes',`${input('bar','Bar weight for plate math, lb','number',45,'min="1" max="100" step="0.5"')}${btn('Calculate plates per side','plates','wide')}<div id="plateResult" class="small">Assumed plate pairs: 45, 35, 25, 10, 5, 2.5 lb. Confirm actual equipment.</div>${input('setNote','Set note (optional)')}`)}</form><div class="between"><span class="timer" id="restTimer">${restUntil>Date.now()?Math.ceil((restUntil-Date.now())/1000)+'s':'Ready when recovered'}</span>${btn('Start rest','rest')}</div>${details('Technique, purpose & last set',`<p>${e.tempo}</p><p>${e.why}</p><p>Structures: ${e.structures}.</p><p>Last recorded: ${last?esc(last.load+' lb × '+last.reps+' · RIR '+last.rir):'none; no history invented'}.</p>`)}${btn('Equipment unavailable → '+esc(e.sub),'substitute','wide')}${btn('Pain changes movement — stop','runner-pain','danger wide')}${btn('End session now','end-session','wide')}<p class="small">Rest timers run only while the app is visible; no background notification guarantee.</p></div>`;}
function testsPage(){return `<span class="eyebrow">Same setup. Honest comparison.</span><h1>Test yourself.</h1><p>Choose the actual football/track test with your coach. Test only fresh, supervised and appropriately scheduled. Yards and meters, starts and measurement setups remain separate.</p>${details('Repeatable test procedure',`<p>Use a measured distance and identical warm-up, start, footwear, surface and device/operator. Sprint: 2–3 trials with 3 minutes recovery, record each trial separately. Broad jump: toes behind line, stable two-foot landing, measure nearest heel. Vertical: standing reach then jump reach with the same arm/protocol. 3 attempts with recovery; record in inches.</p><p>No invented percentile table. Hand timing, electronic timing and video stay separate. Video needs frame-rate and start/end definitions in the protocol field.</p>${evidence('TEST SPEED DESIGN')}`)}<form data-form="test">${select('test','Test',window.D1PERF.TESTS)}${input('result','Result: seconds for sprints, inches for jumps','number','','min="0.01" max="200" step="0.01" required')}${select('method','Timing / measurement method',['electronic gates','hand stopwatch','video frames','tape measure','jump reach device'])}<div class="grid2">${select('surface','Surface',['turf','track','grass','gym'])}${input('footwear','Footwear (same name for comparison)','text','','required')}</div>${input('start','Start / stance / jump method','text','','required')}${input('device','Device and operator','text','','required')}${input('protocol','Protocol: gate setup / fps / reach method / wind','text','','required')}${input('trial','Trial number','number',1,'min="1" max="10" required')}<button class="primary wide">Save measured test</button></form>${btn('Performance · error-aware interpretation','go:performance','wide')}${section('Separate test series',ascendTestCards())}`;}
function numbersPage(){return `<span class="eyebrow">Reported / measured history</span><h1>Your own trend.</h1>${stats()}<form data-form="weight">${input('weight','Morning bodyweight, lb','number','','min="70" max="350" step="0.1" required')}${input('weightDate','Measurement date','date',day(),'required')}${area('weightNote','Context: scale, clothing, illness, supplement-water change')}<button class="primary wide">Save morning weight</button></form>${details('Weight history',history('weight'))}${section('Record a lift; do not chase a max',`<form data-form="strength">${select('lift','Movement',[['bench','Bench'],['squat','Back squat'],['trap','Trap-bar deadlift']])}<div class="grid2">${input('liftLoad','Load, lb','number','','min="1" max="700" step="0.5" required')}${input('liftReps','Actual reps','number','','min="1" max="10" required')}</div>${input('liftMethod','Method: depth / handles / equipment / observer','text','','required')}${check('best','This is a new reported best single (only updates profile at 1 rep)')}<button class="primary wide">Save strength result</button></form><p class="small">Epley estimate is shown for 2–10 reps only. It is an estimate and never automatically replaces a reported best.</p>${history('strength')}`)}`;}
function fuelPage(){const n=C.nutrition(S,now()),r=C.latest(S,'readiness',day());return `<span class="eyebrow">Fuel / growth and recovery</span><h1>Feed the work.<br>Support growth.</h1><div class="status"><b>Next action</b><p>${fuelAction()}</p></div>${fuelAuditNote()}${n.unknown?'<p>'+esc(n.reason||'Current bodyweight is unknown or expired. Log a new measurement before using weight-based estimates.')+'</p>':`<div class="grid2"><div class="metric"><strong>${n.cal[0]}–${n.cal[1]}</strong><small>kcal/day starting estimate</small></div><div class="metric"><strong>~${n.protein} g</strong><small>protein planning reference</small></div></div><p class="small">Carbohydrate estimate: ${n.carb.join('–')} g for today’s load. Fat: ${n.fat}. These are flexible starting ranges, not caps, quotas or measured expenditure. More food may be needed for growth and hunger.</p>${details('How estimates change',`<p>Current ${S.facts.weight.value} lb = ${n.kg.toFixed(1)} kg. Energy heuristic: lighter days 38–46 kcal/kg; practice/game days 44–52 kcal/kg. This is not a validated adolescent calorimetry equation. Carbohydrate ranges are provisional sports-nutrition extrapolations.</p><p>Protein reference ≈1.5 g/kg with sufficient total food; no requirement for a powder. No weight-cut or automatic calorie-reduction rule.</p>${evidence('NUTRITION FOOD DESIGN')}`)}${section('Trend, not one weigh-in',n.trend?`<p>Weekly mean lb, oldest → newest: ${n.trend.slice().reverse().map(x=>x.toFixed(1)).join(' → ')}.</p><p>${n.proposedFoodAddition?'Stable trend with adequate intake logs: review the actual intake average and a small food addition with your parent/dietitian. The estimate has not automatically changed.':'No trend adjustment applied. Growth, appetite, recovery, illness and supplement-water shifts need context.'}</p>`:'<p>Need at least 3 morning weights in each of 3 weeks for a stable trend; 18 complete intake days before suggesting a small food addition. Measured weight trend does not measure calorie expenditure.</p>')}`}${section('Simple food structure',`<p>Build meals from rice/oats/potatoes/bread, meat/eggs/dairy or other protein, fruit/vegetables and dietary fat. Bring lunch plus a snack for the school-to-field gap.</p><p>Use familiar carbohydrate before play and a normal carbohydrate-plus-protein meal afterward. Include calcium-rich foods, iron-containing foods and vitamin-D food sources; do not diagnose deficiency from fatigue.</p><p class="small">No rapid bulk, cutting phase or skipped meals to hit an app number.</p>`)}<form data-form="intake">${input('intakeDate','Food log date','date',day(),'required')}<div class="grid2">${input('calories','Total kcal (if actually logged)','number','','min="0" max="9000"')}${input('protein','Protein g (if known)','number','','min="0" max="500"')}</div>${area('mealNotes','Meals / what you still need')}${check('complete','This represents the whole day, not a partial log')}<button class="primary wide">Save intake record</button></form>${btn('Log weight trend','go:numbers','wide')}${btn('Hydration / sweat-rate worksheet','go:hydration','wide')}${btn('Sleep check-in · '+(r?r.sleep+' h logged':'not logged'),'go:checkin','wide')}${details('Food log history',history('intake'))}${details('Supplements — below food and sleep',`<p>Record any current products, labels, amounts and review status. No product use is assumed.</p>${btn('Open product records','go:supplements','wide')}`)}`;}
function hydrationPage(){return `<span class="eyebrow">Hydration / individual conditions</span><h1>Measure. Don’t force.</h1><p>Bring fluids, use regular team breaks and follow the athletic trainer’s heat plan. Drink with meals and around activity; avoid finishing heavier from forced drinking. Prolonged hot practice may need carbohydrate/electrolyte drinks plus ordinary food.</p><p>No universal bottle quota or sodium prescription. Air temperature alone does not replace WBGT and acclimatization decisions.</p><form data-form="sweat"><div class="grid2">${input('pre','Before practice, lb','number','','min="70" max="350" step="0.1" required')}${input('post','After practice, lb','number','','min="70" max="350" step="0.1" required')}</div><div class="grid2">${input('fluid','Fluid consumed, litres','number','','min="0" max="10" step="0.05" required')}${input('urine','Urine during session, litres','number',0,'min="0" max="5" step="0.05" required')}</div>${input('sweatMinutes','Duration, minutes','number',150,'min="1" max="360" required')}<button class="primary wide">Calculate & record estimate</button></form><p class="small">Same scale, dry/light clothing. Sweat estimate = mass lost in kg + litres drunk − litres urinated. It is not a command to drink that rate. Review repeated hot-practice measurements with your trainer.</p>${history('sweat')}${evidence('HEAT FLUID NUTRITION DESIGN')}`;}
function supplementsPage(){const x=S.supplements[selectedSupplement]||{};return `<span class="eyebrow">Record use / no automatic prescription</span><h1>Know the label.</h1><div class="status"><b>Record the current product label; no amount is assigned.</b><p>This is a record, not an adolescent prescription. Review the exact product and amount with a parent and pediatric sports clinician.</p></div><form data-form="supplement">${select('product','Product',[['creatine','Creatine monohydrate'],['magnesium','Magnesium'],['d3k2','Vitamin D3 + K2']],selectedSupplement)}${btn('Load selected product','load-product','wide')}${input('brand','Brand / exact product','text',x.brand)}${area('label','Actual label text, ingredient amounts and units',x.label)}${input('serving','Actual serving size and daily amount (include units)','text',x.serving)}${selectedSupplement==='creatine'?input('dose','Actual creatine g/day (if known)','number',x.dose,'min="0" max="100" step="0.1"'):selectedSupplement==='magnesium'?input('dose','Actual elemental magnesium mg/day from supplements/medicines','number',x.dose,'min="0" max="2000"'):input('dose','Actual vitamin D3 IU/day (if known)','number',x.dose,'min="0" max="50000"')}${selectedSupplement==='d3k2'?input('k2','Actual K2 mcg/day (if known)','number',x.k2,'min="0" max="10000"'):''}${input('cert','Certification / lot; unknown if not checked','text',x.cert)}${input('startDate','Start date (if known)','date',x.startDate)}${area('tolerance','Tolerance / missed doses / questions for clinician',x.tolerance)}${check('parent','Parent aware',x.parent)}${input('clinician','Clinician who reviewed this exact amount','text',x.clinician)}${input('reviewDate','Review date','date',x.reviewDate)}${input('approvedAmount','Exact reviewed amount and directions','text',x.approvedAmount)}<button class="primary wide">Save product record</button></form>${btn('Log today’s adherence to recorded amount','adherence','wide')}${suppFlags(selectedSupplement,x)}<p class="small">A recorded review is athlete-entered, not independently authenticated. Certification is quality information, not medical clearance.</p>${details('Dose / label questions',`<p>Magnesium: confirm the elemental amount on the current label. Count other supplements/medications. Ages 14–18 supplemental UL is 350 mg/day, excluding food. Vitamin D: confirm IU, combined products and clinician rationale; 4,000 IU/day is an upper limit, not a target. K2: ask about medication interactions. Do not change prescribed treatment from this screen.</p>${evidence('CREATINE MG D')}`)}${details('Product use history',history('adherence'))}`;}
function suppFlags(id,x){let flags=[];if(!x.label||!x.serving)flags.push('Label or serving size missing.');if(!x.parent||!x.clinician||!x.reviewDate||!x.approvedAmount)flags.push('Parent awareness and dose-specific clinician review not fully recorded.');if(!x.cert)flags.push('Certification / product identity not checked.');if(id==='creatine'&&x.dose>=15)flags.push('Recorded ≥15 g/day. This is not an established adolescent maintenance dose; ask the pediatric sports clinician before use.');if(id==='magnesium'&&x.dose>350)flags.push('Recorded supplemental amount exceeds the 350 mg/day adolescent UL. Discuss with clinician; include medicines.');if(id==='d3k2'&&x.dose>4000)flags.push('Recorded D3 exceeds the 4,000 IU/day adolescent UL. A clinician must review the reason and total intake.');if(id==='d3k2'&&x.k2==null)flags.push('K2 amount / medication review unknown.');return '<div class="status"><b>Record flags</b><ul>'+flags.map(t=>'<li>'+t+'</li>').join('')+'</ul><p class="small">'+(flags.length?'Review questions, not a dosing instruction.':'Fields completed; review is athlete-reported, not independently verified.')+'</p></div>';}
let selectedSupplement='creatine';
function labPage(){return `<span class="eyebrow">Lab / anatomy into decisions</span><h1>Understand the work.</h1>${replayStrip()}${intelligenceStrip()}${btn('Ascend · development, recovery & presentation','go:ascend','wide')}${btn('Published study-data explorer','go:ped-data','primary wide')}${btn('HELIX · peptide / PED human evidence','go:research','wide')}${btn('Testosterone claims · evidence audit','go:testosterone','wide')}${btn('Football / wrestling / track / Primal','go:sports','wide')}${btn('Development blocks & 24-month map','go:development','wide')}${btn('Measured performance dashboard','go:performance','wide')}<p>Ten focused entries connect field demands, training and uncertainty. Mechanisms do not promise results.</p>${CONTENT.atlas.map(([name,what,role,work,test,injury,source,uncertain])=>details(name,`<p><b>What:</b> ${what}</p><p><b>RB / MLB:</b> ${role}</p><p><b>This week:</b> ${work}</p><p><b>Measure:</b> ${test}</p><p><b>Injury relationship:</b> ${injury}</p><p><b>Evidence / uncertainty:</b> ${uncertain}</p>${evidence(source)}`)).join('')}${btn('Research ledger · evidence and limits','go:sources','wide')}`;}
function sourcePage(){return `<span class="eyebrow">Evidence ledger / checked September 25–26, 2026</span><h1>What supports this?</h1><p>Clinical guidance, research and coaching choices are labeled separately. Some research records were accessible only as indexed abstracts; full-text verification is not claimed.</p>${CONTENT.sources.map(([id,title,url,tier,pop,claim,verification,limit])=>`<section class="section" id="src-${id}"><span class="eyebrow">${id} · ${tier}</span><h2>${title}</h2><p>${claim}</p><p class="small">Population: ${pop}. ${limit}</p><p class="small">Checked ${['AAPFULL','REDS','BURNOUT','NCAA','DESIGN'].includes(id)?'2026-09-26':'2026-09-25'} · ${verification}.</p>${url.startsWith('https')?`<a href="${url}" target="_blank" rel="noopener noreferrer">Open original source ↗</a>`:'<p>See bundled PROTOCOL.md.</p>'}</section>`).join('')}<p class="small">External source links leave this local app. No background retrieval or analytics.</p>`;}
function pathPage(){const unknown=Object.entries(S.facts).filter(([k,f])=>!C.live(f,now()));return `<span class="eyebrow">Path / honest record</span><h1>${esc(S.facts.name.value||WORKSPACE.label)}.<br>Build the player.</h1><p>${esc(S.facts.level.value||'Level unknown')} · ${esc(S.facts.school.value||'School unknown')} · Class ${esc(S.facts.classYear.value||'unknown')}. Seasons: ${esc(S.facts.seasons.value||'unknown')}. Confirm schedules before programming.</p><div class="status"><b>${esc(S.facts.eligibility.value)}</b><p>No administrative or medical documentation has been independently inspected.</p></div>${btn('Weekly review & coach brief','go:review','primary wide')}${btn('Ascend · whole-player development','go:ascend','wide')}${btn('Athlete workspaces','go:workspaces','wide')}${btn('Product lab · pilot and business scenarios','go:pilot','wide')}${btn('APEX · junior-year evidence engine','go:apex','primary wide')}${btn('College path & school follow-up','go:college','wide')}${btn('Schedule & bye week','go:schedule','wide')}${btn('Facts & unknowns · '+unknown.length,'go:facts','wide')}${btn('Safety & professional follow-up','go:safety','wide')}${section('Development path',`<p>Current priorities: possession, acceleration and carrier recognition. No fabricated recruiting ranking, D1 threshold or offer probability.</p><form data-form="path">${select('pathType','Record type',['academics','coach question','recruiting task','season transition'])}${area('pathNote','Actual task / deadline / answer')}<button class="wide">Save path note</button></form>${details('Your notes',history('path'))}<p class="small">Grades, courses, NCAA eligibility status, verified film and recruiting contacts are unknown. Track actual records; ask your school counselor about current requirements.</p>`)}${section('Data & settings',`<p><b>${storage==='mirrored'?'Local save + IndexedDB copy checked':storage==='local'?'Local save checked; secondary copy unavailable':storage}</b> · ${S.events.length} live events · ${S.archives.length} archives · ${S.conflicts.length} preserved conflicts</p><div class="grid2">${btn('Export JSON','export','primary')}${btn('Panic export','panic')}</div>${btn('Import / restore with preview','go:import','wide')}${details('Complete event archive',S.events.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).map(e=>`<div class="history break"><b>${esc(e.type)} · ${esc(e.ts)}</b><p>${esc(JSON.stringify(e.payload))}</p></div>`).join('')||'<p>No events yet.</p>')}${btn('Field Mode: '+(S.settings.field?'on':'off'),'field','wide')}${btn('Large text: '+(S.settings.large?'on':'off'),'large','wide')}${offlinePanel()}<p class="small">v${C.VERSION}. Back up before changing browser, origin or build. Browser storage can be evicted.</p>`)}`;}
function schedulePage(){const g=C.nextGame(S,now()),p=S.facts.practice.value;return `<span class="eyebrow">Calendar / Pacific time</span><h1>The real week.</h1><p>Edit an existing fixture to move or cancel it. Newer timestamps win; conflicting originals stay archived.</p><form data-form="fixture">${select('fixtureId','Fixture',[['new','New fixture'],...S.fixtures.map(x=>[x.id,x.opponent+' · '+C.date(x.kickoff)])],g?.id||'new')}${input('fixtureOpponent','Opponent','text',g?.opponent||'','required')}${input('fixtureDate','Game date (Pacific)','date',g?C.date(g.kickoff):'','required')}${input('fixtureTime','Kickoff (Pacific)','time',g?new Intl.DateTimeFormat('en-GB',{timeZone:C.TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(g.kickoff)):'16:00','required')}${select('fixtureStatus','Status',['confirmed','tentative','cancelled'],g?.status||'confirmed')}${select('fixtureSource','Who provided this?',['athlete','coach','school'])}<button class="primary wide">Save fixture →</button></form>${btn('Confirm no game in the next 7 days','bye','wide')}${section('Team practice',`<form data-form="schedule"><div class="grid2">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>check('dow'+i,d,p.days.includes(i))).join('')}</div><div class="grid2">${input('practiceStart','Start','time',p.start,'required')}${input('practiceEnd','End','time',p.end,'required')}</div>${check('teamLift','Team lifts now occur (holds extra gym until reviewed)',S.facts.teamLifts.value)}<button class="wide">Confirm practice schedule</button></form>`)}${weekly()}`;}
function factsPage(){return `<span class="eyebrow">Reported ≠ estimated ≠ verified</span><h1>Know what’s unknown.</h1><form data-form="fact">${select('factId','Update a fact',[['priorities','Current coach development priorities'],['film','Film availability'],['scheme','Historical terminology (use RB Development for current team rules)'],['eligibility','Eligibility / participating'],['level','Level / positions']])}${input('factValue','Exact answer; leave blank if unknown')}${select('factSource','Source',['athlete','coach reported to athlete','school reported to athlete','clinician reported to athlete'])}<button class="primary wide">Save dated fact</button></form>${Object.entries(S.facts).map(([id,f])=>details(`${esc(id)} · ${esc(C.status(f,now()))}`,`<p class="break">${esc(typeof f.value==='object'?JSON.stringify(f.value):f.value??'unknown')}</p><p class="small">Source: ${esc(f.source)} · ${esc(f.confidence)}<br>Confirmed ${esc(f.lastConfirmed)} · expires after ${f.ttl} days.</p>`)).join('')}`;}

}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;if(b.dataset.act==='titan-ai-revoke'){await titanAction(b.dataset.act);return;}if(busy)return;busy=true;try{await action(b.dataset.act);}catch(err){message(err.message);}finally{busy=false;}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(busy)return;busy=true;try{await submit(f);clearDraft(f);render(false);}catch(err){message('Not saved: '+err.message);}finally{busy=false;}});
document.addEventListener('change',async e=>{if(e.target.id==='fixtureId'){const g=S.fixtures.find(x=>x.id===e.target.value);$('fixtureOpponent').value=g?.opponent||'';$('fixtureDate').value=g?C.date(g.kickoff):'';$('fixtureTime').value=g?new Intl.DateTimeFormat('en-GB',{timeZone:C.TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(g.kickoff)):'16:00';$('fixtureStatus').value=g?.status||'confirmed';}if(e.target.id==='importFile'){const generation=++importReadGeneration,f=e.target.files?.[0];imported=null;if(!f){render(false);return;}try{if(f.size>10*1024*1024)throw Error('Backup exceeds 10 MB; keep original for assisted recovery');const raw=JSON.parse(await f.text());if(generation!==importReadGeneration)return;imported={name:f.name,state:WS.bind(window.D1Titan.upgrade(C.migrate(raw)),WORKSPACE.id,C)};message('Preview ready. No state changed.');render(false);}catch(err){if(generation!==importReadGeneration)return;imported=null;message('Import rejected: '+err.message);render(false);}}});
document.addEventListener('input',e=>{const f=e.target.closest('form[data-form]');if(!f||noDraft.has(f.dataset.form))return;f.dataset.dirty='true';clearTimeout(draftTimer);draftTimer=setTimeout(captureDrafts,350);});
document.addEventListener('change',e=>{const f=e.target.closest('form[data-form]');if(f&&!noDraft.has(f.dataset.form)){f.dataset.dirty='true';captureDrafts();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){captureDrafts();clearInterval(timer);timer=null;}else{if(page==='runner')startTimer();else render(false);probeOffline();}});
window.addEventListener('pagehide',captureDrafts);
window.addEventListener('storage',e=>{if([K,J].includes(e.key)&&e.newValue){try{S=window.D1Titan.upgrade(C.merge(S,C.validate(JSON.parse(e.newValue))));message('Another tab changed data. Records merged; export before closing.');render(false);}catch{message('Another tab wrote unreadable data. Use Panic export.');}}});
window.addEventListener('error',e=>{message('Application error: '+e.message+'. Use Panic export to protect your record.');});
init();

</script></body></html>
