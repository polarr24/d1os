function sourcePage(){return `<span class="eyebrow">Evidence ledger / checked September 25–26, 2026</span><h1>What supports this?</h1><p>Clinical guidance, research and coaching choices are labeled separately. Some research records were accessible only as indexed abstracts; full-text verification is not claimed.</p>${CONTENT.sources.map(([id,title,url,tier,pop,claim,verification,limit])=>`<section class="section" id="src-${id}"><span class="eyebrow">${id} · ${tier}</span><h2>${title}</h2><p>${claim}</p><p class="small">Population: ${pop}. ${limit}</p><p class="small">Checked ${['AAPFULL','REDS','BURNOUT','NCAA','DESIGN'].includes(id)?'2026-09-26':'2026-09-25'} · ${verification}.</p>${url.startsWith('https')?`<a href="${url}" target="_blank" rel="noopener noreferrer">Open original source ↗</a>`:'<p>See bundled PROTOCOL.md.</p>'}</section>`).join('')}<p class="small">External source links leave this local app. No background retrieval or analytics.</p>`;}
function pathPage(){const unknown=Object.entries(S.facts).filter(([k,f])=>!C.live(f,now()));return `<span class="eyebrow">Path / honest record</span><h1>Zayden.<br>Build the player.</h1><p>${esc(S.facts.level.value)} · Basic High School · Class ${S.facts.classYear.value}. Winter wrestling / spring track are recorded; those seasons need new schedules before programming.</p><div class="status"><b>${esc(S.facts.eligibility.value)}</b><p>No administrative or medical documentation has been independently inspected.</p></div>${btn('Weekly review & coach brief','go:review','primary wide')}${btn('College path & school follow-up','go:college','wide')}${btn('Schedule & bye week','go:schedule','wide')}${btn('Facts & unknowns · '+unknown.length,'go:facts','wide')}${btn('Safety & professional follow-up','go:safety','wide')}${section('Development path',`<p>Current priorities: possession, acceleration and carrier recognition. No fabricated recruiting ranking, D1 threshold or offer probability.</p><form data-form="path">${select('pathType','Record type',['academics','coach question','recruiting task','season transition'])}${area('pathNote','Actual task / deadline / answer')}<button class="wide">Save path note</button></form>${details('Your notes',history('path'))}<p class="small">Grades, courses, NCAA eligibility status, verified film and recruiting contacts are unknown. Track actual records; ask your school counselor about current requirements.</p>`)}${section('Data & settings',`<p><b>${storage==='mirrored'?'Local save + IndexedDB copy checked':storage==='local'?'Local save checked; secondary copy unavailable':storage}</b> · ${S.events.length} live events · ${S.archives.length} archives · ${S.conflicts.length} preserved conflicts</p><div class="grid2">${btn('Export JSON','export','primary')}${btn('Panic export','panic')}</div>${btn('Import / restore with preview','go:import','wide')}${details('Complete event archive',S.events.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).map(e=>`<div class="history break"><b>${esc(e.type)} · ${esc(e.ts)}</b><p>${esc(JSON.stringify(e.payload))}</p></div>`).join('')||'<p>No events yet.</p>')}${btn('Field Mode: '+(S.settings.field?'on':'off'),'field','wide')}${btn('Large text: '+(S.settings.large?'on':'off'),'large','wide')}<p class="small" id="offline">Local core · no external runtime dependencies</p><p class="small">v${C.VERSION}. Back up before changing browser, origin or build. Browser storage can be evicted.</p>`)}`;}
function schedulePage(){const g=C.nextGame(S,now()),p=S.facts.practice.value;return `<span class="eyebrow">Calendar / Pacific time</span><h1>The real week.</h1><p>Edit an existing fixture to move or cancel it. Newer timestamps win; conflicting originals stay archived.</p><form data-form="fixture">${select('fixtureId','Fixture',[['new','New fixture'],...S.fixtures.map(x=>[x.id,x.opponent+' · '+C.date(x.kickoff)])],g?.id||'new')}${input('fixtureOpponent','Opponent','text',g?.opponent||'','required')}${input('fixtureDate','Game date (Pacific)','date',g?C.date(g.kickoff):'','required')}${input('fixtureTime','Kickoff (Pacific)','time',g?new Intl.DateTimeFormat('en-GB',{timeZone:C.TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(g.kickoff)):'16:00','required')}${select('fixtureStatus','Status',['confirmed','tentative','cancelled'],g?.status||'confirmed')}${select('fixtureSource','Who provided this?',['athlete','coach','school'])}<button class="primary wide">Save fixture →</button></form>${btn('Confirm no game in the next 7 days','bye','wide')}${section('Team practice',`<form data-form="schedule"><div class="grid2">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>check('dow'+i,d,p.days.includes(i))).join('')}</div><div class="grid2">${input('practiceStart','Start','time',p.start,'required')}${input('practiceEnd','End','time',p.end,'required')}</div>${check('teamLift','Team lifts now occur (holds extra gym until reviewed)',S.facts.teamLifts.value)}<button class="wide">Confirm practice schedule</button></form>`)}${weekly()}`;}
function factsPage(){return `<span class="eyebrow">Reported ≠ estimated ≠ verified</span><h1>Know what’s unknown.</h1><form data-form="fact">${select('factId','Update a fact',[['priorities','Current coach development priorities'],['film','Film availability'],['scheme','Defensive terminology / assigned key'],['eligibility','Eligibility / participating'],['level','Level / positions']])}${input('factValue','Exact answer; leave blank if unknown')}${select('factSource','Source',['athlete','coach reported to athlete','school reported to athlete','clinician reported to athlete'])}<button class="primary wide">Save dated fact</button></form>${Object.entries(S.facts).map(([id,f])=>details(`${esc(id)} · ${esc(C.status(f,now()))}`,`<p class="break">${esc(typeof f.value==='object'?JSON.stringify(f.value):f.value??'unknown')}</p><p class="small">Source: ${esc(f.source)} · ${esc(f.confidence)}<br>Confirmed ${esc(f.lastConfirmed)} · expires after ${f.ttl} days.</p>`)).join('')}`;}
function importPage(){let preview=imported?`<div class="status"><b>Preview only — nothing committed</b><p>${imported.state.events.filter(e=>!S.events.some(x=>x.id===e.id)).length} new event IDs; ${imported.state.archives.length} archived originals.</p><p>Changed facts: ${esc(Object.keys(imported.state.facts).filter(k=>C.canon(S.facts[k])!==C.canon(imported.state.facts[k])).join(', ')||'none')}. Newer facts win; conflicts retained.</p>${btn('Commit previewed import','commit','primary wide')}</div>`:'';return `<span class="eyebrow">Recovery / keep your originals</span><h1>Bring your record.</h1><p>Supports v14, v13 and older D1OS backups. Older unrecognized fields are archived intact, not silently promoted into recommendations. Export first.</p>${input('importFile','Choose JSON backup','file','','accept=".json,application/json"')}${preview}${btn('Export current record','export','wide')}${btn('Panic export all available copies','panic','wide')}<p class="small">If every stored copy is damaged, a previewed valid import can replace the working state after you download the recovery package. Original damaged bytes remain in the recovery package; this app does not claim to repair arbitrary JSON.</p>`;}
function safetyPage(){const active=C.activeSymptoms(S,now());return `<span class="eyebrow">Safety / performance waits</span><h1>Stop when something changes.</h1><div class="status stop"><b>Emergency signs</b><p>Collapse/fainting, chest pain, severe unexplained breathlessness, confusion, neurological symptoms, worsening headache after impact, or suspected heat stroke: stop, get an adult and urgent medical help. Call 911 for severe or worsening symptoms. Do not move someone with a suspected serious neck injury.</p></div><p>New symptoms after a head/body impact: leave play immediately; no same-day return. Tell a parent, coach and athletic trainer and obtain healthcare evaluation. Swelling, altered gait, worsening night pain or movement-changing pain: stop the affected activity and contact the trainer/clinician.</p><form data-form="symptom">${select('symptomType','Concern',['head impact + symptoms','neck pain','confusion / neurological symptoms','worsening headache','fainting / collapse','chest pain','severe unexplained breathlessness','heat illness signs','joint swelling','recurring focal bone / joint / tendon pain','altered gait / movement pain','worsening night pain','other suspected injury'])}${area('symptomNote','What happened? (optional)')}<button class="danger wide">Stop activity & record concern</button></form>${active.map(e=>details('Follow-up: '+esc(e.payload.kind||e.payload.label),`<p>App hold stays active until a later-day professional return-to-activity record is entered. This records a report; it cannot provide medical clearance.</p><form data-form="resolution" data-target="${esc(e.id)}">${input('professional','Athletic trainer / clinician name','text','','required')}${input('clearedDate','Actual return-to-activity authorization date','date','','required')}${area('directions','Professional’s directions / limitations')}<button class="wide">Record professional follow-up</button></form>`)).join('')}${evidence('CONCUSSION HEAT YOUTH')}`;}
function render(scroll=true){document.documentElement.classList.toggle('large',S.settings.large);document.body.classList.toggle('field',S.settings.field);const pages={execution:executionPage,review:reviewPage,preflight:preflightPage,activity:activityPage,progression:progressionPage,college:collegePage,today:todayPage,field:fieldPage,train:trainPage,lab:labPage,path:pathPage,checkin:checkinPage,practice:practicePage,fuel:fuelPage,hydration:hydrationPage,supplements:supplementsPage,tests:testsPage,numbers:numbersPage,sources:sourcePage,schedule:schedulePage,facts:factsPage,import:importPage,safety:safetyPage,runner:runnerPage,'session-preview':sessionPreview};try{$('screen').innerHTML=headerState()+(pages[page]||todayPage)();$('toast').textContent=notice;$('saveState').textContent=storage==='mirrored'?'LOCAL + COPY':storage==='local'?'LOCAL':storage.toUpperCase();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.act==='go:'+({execution:'today',review:'path',preflight:'train',activity:'train',progression:'train',college:'path',checkin:'today',practice:'train',fuel:'today',hydration:'today',supplements:'path',tests:'train',numbers:'train',sources:'lab',schedule:'path',facts:'path',import:'path',safety:'path',runner:'train','session-preview':'train'}[page]||page)?'page':'false'));if(scroll)window.scrollTo(0,0);}catch(e){$('screen').innerHTML='<h1>Screen could not load.</h1><p>'+esc(e.message)+'</p>'+btn('Panic export','panic');}}
function required(v,label){if(v===null||v===''||!Number.isFinite(v))throw Error('Enter '+label);return v;}
function bounded(id,lo,hi){let v=required(num(id),id);if(v<lo||v>hi)throw Error('Check '+id+' range');return v;}
function validLink(s){return !s||!s.includes('://')||/^https?:\/\//i.test(s);}
async function submit(form){if(await journeySubmit(form)){render(false);return;}const f=form.dataset.form;let next,payload;
 if(f==='checkin'){if(!value('fresh')||!value('energy')||!value('pain')||!value('illness'))throw Error('Answer freshness, energy, pain and illness');payload={sleep:bounded('sleep',0,24),fresh:bounded('fresh',1,5),energy:bounded('energy',1,5),pain:value('pain'),supervised:checked('supervised'),speedIncluded:value('speedIncluded'),illness:value('illness'),extraLoadReviewed:checked('extraLoadReviewed'),appetite:value('appetite'),stress:value('stress')};next=C.event(S,'readiness',payload,now(),'readiness-'+day());next.facts.injury=C.fact(payload.pain==='yes'?'New injury, focal pain or movement-changing pain reported':'No new injury, focal pain or movement-changing pain reported',1,'reported','Today check-in',now().toISOString());if(payload.pain==='yes')next=C.event(next,'symptom',{kind:'New injury, recurring focal pain or movement pain',active:true},now());await save(next);page=payload.pain==='yes'?'safety':'today';}
 else if(f==='practice'){payload={minutes:checked('missed')?0:bounded('minutes',0,360),rpe:checked('missed')?0:bounded('rpe',0,10),contact:value('contact'),legs:value('legs'),missed:checked('missed'),coach:value('coach')};await log('practice',payload,'practice-'+day());page='train';}
 else if(f==='ball'){let reps=bounded('reps',1,200),errors=bounded('errors',0,reps),d=CONTENT.drills.find(x=>x.id===value('drill'));if(d.level==='coach'&&!checked('coachPresent'))throw Error('Only log this progression after coach supervision');if(!validLink(value('filmLink')))throw Error('Use an http(s) link or plain timestamp');if(errors&&value('errorType')==='None observed')throw Error('Choose the observed error type');await log('ball',{drill:d.id,reps,errors,error:value('errorType'),setting:value('setting'),film:value('filmLink'),coach:value('feedback'),supervised:checked('coachPresent')});}
 else if(f==='exposure'){await log('exposure',{kind:value('exposure'),reps:bounded('sprintReps',0,100),yards:bounded('distance',0,200),rest:bounded('rest',0,900),note:value('speedNote')});}
 else if(f==='mlb'){let attempts=bounded('attempts',1,50),correct=bounded('correct',0,attempts);await log('mlb',{basis:value('basis'),attempts,correct,key:value('assignedKey'),cue:value('mlbCue')});}
 else if(f==='film'){if(!value('observed').trim())throw Error('Describe an actual observation or memory');if(!validLink(value('reviewLink')))throw Error('Use http(s) or a timestamp');await log('film',{basis:value('reviewBasis'),topic:value('topic'),link:value('reviewLink'),observation:value('observed'),cue:value('nextCue')});}
 else if(f==='game-review'){if(!value('opponent').trim()||!value('gameNotes').trim())throw Error('Enter opponent and an actual observation');await log('game-review',{opponent:value('opponent'),source:value('gameBasis'),notes:value('gameNotes'),ball:value('ballReview'),speed:value('speedReview'),read:value('readReview')});}
 else if(f==='test'){let test=value('test'),method=value('method');if((test.includes('jump')||test==='vertical')&&!['tape measure','jump reach device','video frames'].includes(method))throw Error('Use a jump measurement method');if(test.includes('yd')&&['tape measure','jump reach device'].includes(method))throw Error('Sprints require a timing method');await log('test',{test,result:bounded('result',.01,200),method,surface:value('surface'),footwear:value('footwear').trim(),start:value('start').trim(),device:value('device').trim(),protocol:value('protocol').trim(),trial:bounded('trial',1,10)});}
 else if(f==='weight'){const d=value('weightDate');if(!C.validDate(d)||d>day())throw Error('Use a real measurement date, not a future date');const lb=bounded('weight',70,350);next=C.event(S,'weight',{date:d,lb,note:value('weightNote')},now(),'weight-'+d);if(d>=C.date(S.facts.weight.lastConfirmed))next.facts.weight=C.fact(lb,14,'reported','Morning measurement entered by athlete',C.zoned(d,'08:00'));await save(next);}
 else if(f==='strength'){let load=bounded('liftLoad',1,700),reps=bounded('liftReps',1,10);if(!Number.isInteger(reps))throw Error('Whole repetitions only');payload={lift:value('lift'),load,reps,method:value('liftMethod'),estimate:C.e1rm(load,reps),estimateState:reps===1?'reported single':'estimated Epley'};next=C.event(S,'strength',payload,now());if(checked('best')){if(reps!==1)throw Error('Only an actual reported single updates the best; estimates stay separate');next.facts[payload.lift]=C.fact(load,60,'reported',payload.method,now().toISOString());}await save(next);}
 else if(f==='intake'){let d=value('intakeDate');if(!C.validDate(d)||d>day())throw Error('Use a real past/current date');let calories=num('calories'),protein=num('protein');if(checked('complete')&&(calories===null||calories<=0))throw Error('Complete quantitative log needs actual total calories');await log('intake',{date:d,calories,protein,notes:value('mealNotes'),complete:checked('complete')},'intake-'+d);}
 else if(f==='sweat'){const result=C.sweat(bounded('pre',70,350),bounded('post',70,350),bounded('fluid',0,10),bounded('urine',0,5),bounded('sweatMinutes',1,360));await log('sweat',{...result,pre:num('pre'),post:num('post'),fluid:num('fluid'),urine:num('urine'),minutes:num('sweatMinutes')});}
 else if(f==='supplement'){next=C.clone(S);selectedSupplement=value('product');if(value('reviewDate')&&value('reviewDate')>day())throw Error('Review date cannot be future');const x={brand:value('brand'),label:value('label'),serving:value('serving'),dose:num('dose'),k2:num('k2'),cert:value('cert'),startDate:value('startDate'),tolerance:value('tolerance'),parent:checked('parent'),clinician:value('clinician'),reviewDate:value('reviewDate'),approvedAmount:value('approvedAmount'),ts:now().toISOString()};if(next.supplements[selectedSupplement])next.archives=C.union(next.archives,[{id:'supplement-'+C.hash(next.supplements[selectedSupplement]),raw:next.supplements[selectedSupplement]}]);next.supplements[selectedSupplement]=x;next.meta.updated=x.ts;await save(next);}
 else if(f==='fixture'){let id=value('fixtureId');const kickoff=C.zoned(value('fixtureDate'),value('fixtureTime'));if(id==='new')id='fixture-'+C.hash([kickoff,value('fixtureOpponent')]);const g={id,opponent:value('fixtureOpponent').trim(),kickoff,status:value('fixtureStatus'),source:value('fixtureSource')+' report entered by athlete; not independently verified',lastConfirmed:now().toISOString(),ttl:14,ts:now().toISOString()};next=C.event(S,'fixture-update',g,now());const old=next.fixtures.find(x=>x.id===id);if(old)next.archives=C.union(next.archives,[{id:'fixture-old-'+C.hash(old),raw:old}]);next.fixtures=C.union(next.fixtures,[g]);next.facts.bye=C.fact(false,7,'reported','Fixture updated',now().toISOString());await save(next);}
 else if(f==='schedule'){const start=value('practiceStart'),end=value('practiceEnd'),min=t=>Number(t.slice(0,2))*60+Number(t.slice(3));if(min(end)<=min(start))throw Error('Practice end must follow start');next=C.clone(S);next.facts.practice=C.fact({days:[0,1,2,3,4,5,6].filter(i=>checked('dow'+i)),start,end,minutes:min(end)-min(start)},21,'reported','Athlete schedule update',now().toISOString());next.facts.teamLifts=C.fact(checked('teamLift'),21,'reported','Athlete schedule update',now().toISOString());next=C.event(next,'schedule-change',{practice:next.facts.practice.value,teamLifts:checked('teamLift')},now());await save(next);}
 else if(f==='fact'){next=C.clone(S);next.facts[value('factId')]=C.fact(value('factValue').trim()||null,value('factId')==='film'?14:30,value('factValue').trim()?'reported':'unknown',value('factSource'),now().toISOString());next=C.event(next,'fact-update',{field:value('factId'),value:value('factValue')},now());await save(next);}
 else if(f==='path'){if(!value('pathNote').trim())throw Error('Enter an actual task or answer');await log('path',{kind:value('pathType'),note:value('pathNote')});}
 else if(f==='symptom'){await log('symptom',{kind:value('symptomType'),note:value('symptomNote'),active:true});}
 else if(f==='resolution'){const original=S.events.find(e=>e.id===form.dataset.target);if(!C.validDate(value('clearedDate'))||value('clearedDate')>day()||value('clearedDate')<=original.payload.date)throw Error('No same-day app return. Record a real later-day professional authorization');if(value('professional').trim().length<3)throw Error('Name the actual professional');await log('resolution',{target:original.id,date:value('clearedDate'),professional:value('professional'),directions:value('directions')});}
 else if(f==='set'){const p=C.plan(S,now());if(!p.allowed)throw Error('Training window closed. Stop and recheck readiness/schedule.');if(!runner)throw Error('Session missing');const e=runner.sets[runner.index],reps=bounded('setReps',0,50),load=bounded('setLoad',0,1000),rir=value('rir'),technique=value('setTechnique');await log('set',{session:runner.id,exercise:e.id,name:e.name,set:runner.index+1,load,reps,rir,technique,note:value('setNote'),completed:true,target:{reps:e.reps,calculatedLoad:e.load,percentage:e.pct||null,rest:e.rest,tempo:e.tempo,structures:e.structures,reason:e.why,substitution:e.sub}},runner.id+'-'+runner.index);runner.index++;if(['0','1'].includes(rir)||technique==='deteriorated'){runner=null;page='train';message('Set saved. Session ended after low reps-in-reserve or deteriorating technique; recover and review the load with coach.');}else{restUntil=Date.now()+e.rest*1000;startTimer();}}
 render(false);
}
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(page!=='runner'||document.hidden){clearInterval(timer);timer=null;return;}const el=$('restTimer');if(el)el.textContent=restUntil>Date.now()?Math.ceil((restUntil-Date.now())/1000)+'s':'Rest complete · check how you feel';if(restUntil<=Date.now()){clearInterval(timer);timer=null;}},1000);}
async function action(a){if(a==='coach-brief'){download('d1os-coach-brief-'+day()+'.txt',coachBrief(),'text/plain');message('Coach brief downloaded. Review it before sharing.');return;}if(a.startsWith('go:')){page=a.slice(3);render();return;}if(a.startsWith('tab:')){page='field';tab=a.slice(4);render();return;}if(a.startsWith('source:')){page='sources';render();$('src-'+a.slice(7))?.scrollIntoView();return;}if(a.startsWith('drill:')){const d=CONTENT.drills.find(x=>x.id===a.slice(6));$('drill').value=d.id;$('reps').value=d.reps;$('drill').scrollIntoView({block:'center'});return;}
 if(a==='export'||a==='panic'){exportData(a==='panic');return;}
 if(a==='field'||a==='large'){let next=C.clone(S);next.settings[a]=!next.settings[a];next.meta.updated=now().toISOString();await save(next);return;}
 if(a==='bye'){let next=C.clone(S);next.facts.bye=C.fact(true,7,'reported','Athlete confirmed no game next 7 days',now().toISOString());next=C.event(next,'bye-confirmed',{until:C.add(day(),7)},now());await save(next);message('Bye recorded. Existing confirmed fixtures must be cancelled individually if no longer valid.');return;}
 if(a==='start-session'){const p=C.plan(S,now()),mode=value('sessionMode')||requestedSessionMode;if(mode==='brutal'){message('Brutal-practice version: no gym. Log practice load, eat and recover.');page='practice';render();return;}if(!p.allowed){message(p.notes.join(' ')||p.reason);page='checkin';render();return;}const warm=C.latest(S,'preflight',day());if(!warm||warm.kind!==p.code||!warm.familiar||!warm.warm){requestedSessionMode=mode;page='preflight';render();return;}let m=mode==='none'?'none':p.readiness==='amber'||C.loadReview(S,now()).other.length?'short':mode;const exercises=exerciseList(p.code,m);runner={id:'session-'+day()+'-'+p.code,kind:p.code,mode:m,index:0,sets:exercises.flatMap(e=>Array.from({length:e.sets},()=>({...e})))};const prior=S.events.find(e=>e.type==='session-plan'&&e.payload.id===runner.id);if(prior)runner={...C.clone(prior.payload),index:0};else await log('session-plan',runner,runner.id);while(runner.index<runner.sets.length&&S.events.some(e=>e.id==='set-'+runner.id+'-'+runner.index))runner.index++;page='runner';render();return;}
 if(a==='plates'){const load=num('setLoad'),bar=num('bar');if(!load){$('plateResult').textContent='Bodyweight / no bar.';return;}const p=C.plates(load,bar);$('plateResult').textContent=p.actual+' lb total including '+bar+' lb bar. Per side: '+(p.items.map(([p,n])=>n+' × '+p+' lb').join(' + ')||'empty bar')+'. Rounded down to loadable weight.';return;}
 if(a==='rest'){const e=runner?.sets[runner.index];if(e){restUntil=Date.now()+e.rest*1000;startTimer();}return;}
 if(a==='substitute'){const e=runner.sets[runner.index];for(let i=runner.index;i<runner.sets.length;i++)if(runner.sets[i].id===e.id)runner.sets[i]={...runner.sets[i],id:e.id+'-sub',name:e.sub,load:0,pct:null,reps:6};await log('session-plan',runner,runner.id);render(false);return;}
 if(a==='runner-pain'){runner=null;await log('symptom',{kind:'Movement-changing pain during lifting',active:true});page='safety';render();return;}
 if(a==='end-session'){await log('session-ended',{session:runner?.id,setsCompleted:runner?.index});runner=null;page='train';render();return;}
 if(a==='load-product'){selectedSupplement=value('product');render(false);return;}
 if(a==='adherence'){const x=S.supplements[selectedSupplement];if(!x?.serving)throw Error('Record the actual product and amount first');await log('adherence',{product:selectedSupplement,reportedAmount:x.serving,reviewRecorded:!!(x.parent&&x.clinician&&x.reviewDate&&x.approvedAmount)},'adherence-'+day()+'-'+selectedSupplement);return;}
 if(a==='commit'){if(!imported)throw Error('Choose a valid backup first');if(storage==='recovery'){exportData(true);storage='local';S=imported.state;try{localStorage.removeItem(K);}catch{}}await save(C.merge(S,imported.state));imported=null;message('Import committed; original and conflicting records retained.');render(false);return;}
}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b||busy)return;busy=true;try{await action(b.dataset.act);}catch(err){message(err.message);}finally{busy=false;}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(busy)return;busy=true;try{await submit(f);}catch(err){message('Not saved: '+err.message);}finally{busy=false;}});
document.addEventListener('change',async e=>{if(e.target.id==='fixtureId'){const g=S.fixtures.find(x=>x.id===e.target.value);$('fixtureOpponent').value=g?.opponent||'';$('fixtureDate').value=g?C.date(g.kickoff):'';$('fixtureTime').value=g?new Intl.DateTimeFormat('en-GB',{timeZone:C.TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(g.kickoff)):'16:00';$('fixtureStatus').value=g?.status||'confirmed';}if(e.target.id==='importFile'){try{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('Backup exceeds 10 MB; keep original for assisted recovery');const raw=JSON.parse(await f.text());imported={name:f.name,state:C.migrate(raw)};message('Preview ready. No state changed.');render(false);}catch(err){imported=null;message('Import rejected: '+err.message);}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(timer);timer=null;}else if(page==='runner')startTimer();else render(false);});
window.addEventListener('storage',e=>{if([K,J].includes(e.key)&&e.newValue){try{S=C.merge(S,C.validate(JSON.parse(e.newValue)));message('Another tab changed data. Records merged; export before closing.');render(false);}catch{message('Another tab wrote unreadable data. Use Panic export.');}}});
window.addEventListener('error',e=>{message('Application error: '+e.message+'. Use Panic export to protect your record.');});
init();

</script></body></html>
