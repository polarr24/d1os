function buildDossier(){
  const p=S.profile, cr=coreRead(), ss=seasonStats(), mom=Model.momentum(), hf=hudlFresh();
  const lift=k=>Math.max(S.prs[k]||0,(mom.bestE1rm||{})[k]||0)||null;
  const lm=k=>{const a=(S.metrics||[]).filter(m2=>m2.key===k);return a.length?a[a.length-1].val:null;};
  const pre=todayISO()<GATE_D1_CONTACT;
  const L=[];
  L.push((pre?'PROSPECT UPDATE (questionnaire follow-up format — direct contact opens '+GATE_D1_CONTACT+')':'PROSPECT DOSSIER'));
  L.push(`${(p.name||'Zayden').toUpperCase()} — ${p.pos} · Class of ${p.classOf} · Henderson, NV (Basic Academy)`);
  L.push('');
  L.push('VERIFIED NUMBERS (logged with dates, not claimed):');
  const rows=[['Squat',lift('squat'),'lb'],['Bench',lift('bench'),'lb'],['Deadlift',lift('dead'),'lb'],['Vertical',lm('vert'),'in'],['Bodyweight',lm('wt'),'lb'],['Height',lm('ht'),'in'],['Standing reach',lm('reach'),'in'],['Wingspan',lm('wing'),'in'],['40yd',lm('forty'),'s (hand-timed)']];
  for(const[k,v,u]of rows) if(v!=null) L.push(`  ${k}: ${v} ${u}`);
  if(ss.n) L.push(`SEASON: ${ss.n} games — ${ss.t.car} car, ${ss.t.yds} yds${ss.ypc?' ('+ss.ypc+'/carry)':''}, ${ss.t.td} TD, ${ss.t.tkl} tackles`);
  if(cr.gpa!=null) L.push(`ACADEMICS: NCAA core GPA ${cr.gpa.toFixed(2)} (${cr.credits}/16 credits logged)`);
  L.push(`FILM: ${(S.clips||[]).length} tagged clips${hf.last?' · Hudl updated '+fmtD(hf.last):' · Hudl link goes here'}`);
  L.push('');
  L.push('Every number above comes from a timestamped training log kept since Jul 2026.');
  return L.join('\n');
}

/* ===== v7.30: ONE logging sheet — inline number bar, per-entry date chip, no native dialogs ===== */
/* ===== v7.64 CAPTURE: arbitrary backdating + same-day collision sheet =====
   The old model toggled today<->yesterday only, so missing two days made that data permanently
   uncapturable — the app was hardest to use in exactly the weeks worth measuring. numOff is a
   day-offset scrubber (0..MAX_BACKFILL) and numOpen ALWAYS resets it: inheriting the last
   entry's offset is how someone silently logs a week onto the wrong day. */
const MAX_BACKFILL=14;
let pendNum=null, numOff=0, pendCamp=false, pendVoid=null, liftYest=false, pendDup=null, pendCond=null;
function numISO(){ return addDays(todayISO(),-numOff); }
function numDateLabel(){ if(numOff===0) return 'TODAY'; if(numOff===1) return 'YESTERDAY';
  try{ return new Date(numISO()+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return numISO(); } }
function numOpen(key,label,step,fallback){
  const last=[...(S.metrics||[])].reverse().find(m=>m.key===key);
  pendNum={key,label,step,big:step>=1?5:+(step*10).toFixed(2),val:last?last.val:fallback}; numOff=0; pendDup=null; showNumBar();
}
function numCur(){ let el=null; try{ el=document.querySelector('#numVal'); }catch(e){}
  const v=el?parseFloat(el.value):NaN; return isNaN(v)?pendNum.val:v; }
function numStep(d){ if(!pendNum) return; pendNum.val=+(numCur()+d).toFixed(2); showNumBar(); }
function numBack(dir){ numOff=Math.max(0,Math.min(MAX_BACKFILL,numOff+dir)); showNumBar(); }
function numToday(){ numOff=0; showNumBar(); }
/* compat shim: the old today<->yesterday chip is gone (replaced by the scrubber), but keep the
   entry point mapping onto the scrubber so nothing that referenced it breaks. */
function numDateFlip(){ numOff=numOff?0:1; showNumBar(); }
function numClose(){ pendNum=null; pendDup=null; pendCond=null; numOff=0; try{ const b=document.querySelector('#numBar'); if(b&&b.remove) b.remove(); }catch(e){} }
function _numBarWrap(inner){ return `<div id="numBar" style="position:fixed;left:0;right:0;bottom:58px;z-index:98;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.4);padding:10px 12px">${inner}</div>`; }
function _numMount(html){ try{ const old=document.querySelector('#numBar'); if(old&&old.remove) old.remove(); document.body.insertAdjacentHTML('beforeend',html); }catch(e){} }
function showNumBar(){ if(!pendNum) return;
  const back=numOff>0;
  const spelled = numOff>=2 ? `<div class="note" style="margin:6px 0 0;font-style:normal;color:var(--cyan)">Logging to <b>${esc(numDateLabel())}</b> — not today.</div>` : '';
  const inner=`
    <div class="row" style="gap:6px;align-items:center"><b style="font-size:12px;letter-spacing:.06em">${esc(pendNum.label.toUpperCase())}</b>
      <span class="grow"></span><button class="btn sm ghost" onclick="numClose()">✕</button></div>
    <div class="row" style="gap:6px;align-items:center;margin-top:8px">
      <button class="btn sm ${numOff>=MAX_BACKFILL?'ghost':''}" ${numOff>=MAX_BACKFILL?'disabled':''} onclick="numBack(1)" aria-label="earlier day">‹</button>
      <button class="btn sm" style="min-width:118px;${back?'background:var(--cyan);color:#04212b;border-color:var(--cyan)':''}" onclick="numToday()">${esc(numDateLabel())}</button>
      <button class="btn sm ${numOff<=0?'ghost':''}" ${numOff<=0?'disabled':''} onclick="numBack(-1)" aria-label="later day">›</button>
      <span class="grow"></span></div>${spelled}
    <div class="row" style="gap:6px;align-items:center;margin-top:8px">
      <button class="btn sm" onclick="numStep(-${pendNum.big})">−${pendNum.big}</button><button class="btn sm" onclick="numStep(-${pendNum.step})">−${pendNum.step}</button>
      <input id="numVal" inputmode="decimal" value="${pendNum.val}" style="flex:1;text-align:center;font-size:18px;font-weight:800;min-width:70px">
      <button class="btn sm" onclick="numStep(${pendNum.step})">+${pendNum.step}</button><button class="btn sm" onclick="numStep(${pendNum.big})">+${pendNum.big}</button>
      <button class="btn sm ${back?'':'amber'}" style="${back?'background:var(--cyan);color:#04212b;border-color:var(--cyan)':''}" onclick="numSave()">SAVE</button></div>`;
  _numMount(_numBarWrap(inner));
}
/* same-day collision: metricOn already RESOLVES duplicates by timestamp (detection). This is
   RESOLUTION — surfaced before the write, because backdating makes collisions common. */
function numSave(){ if(!pendNum) return; const v=numCur(); if(!v||v<=0){ toast('Enter a real number'); return; }
  const d=numISO(), key=pendNum.key;
  const cand=(S.metrics||[]).map((m,i)=>({m,i})).filter(o=>o.m.key===key&&o.m.d===d);
  if(cand.length && !pendDup){
    cand.sort((a,b)=>((a.m.t||0)-(b.m.t||0))); const p=cand[cand.length-1]; // the value metricOn currently returns
    pendDup={v,d,key,prevVal:p.m.val,prevIdx:p.i}; showCollision(); return;
  }
  numCommit(v,d,key,false);
}
function numCommit(v,d,key,dup){
  const o={d,key,val:v}; if(numOff>0) o.src='backfill'; if(dup) o.dup=1;
  /* v7.77: test conditions ride onto the entry itself — recorded WITH the number, never after,
     so the verification gate can tell a clean baseline from a post-practice reading. */
  if(pendCond) o.cond=pendCond;
  pushMetric(o); logEvent('metric',{key,val:v,d});
  /* celebration is SUPPRESSED on a backfill: a bloom for a streak the athlete didn't feel would
     be a lie the product can't afford. The quiet confirmation toast is the whole feedback. */
  const back=numOff>0; numClose(); save();
  toast(key.toUpperCase()+' '+v+(back?(' → '+fmtD(d)+' ✓'):' ✓'));
  try{ RENDER[curView](); }catch(e){}
}
function showCollision(){ if(!pendDup) return; const p=pendDup;
  const inner=`
    <div class="row" style="gap:6px;align-items:center"><b style="font-size:12px;letter-spacing:.06em">${esc(p.key.toUpperCase())} · ${esc(fmtD(p.d))}</b><span class="grow"></span></div>
    <div class="note" style="margin:8px 0;font-style:normal">You already logged <b>${esc(p.key.toUpperCase())} ${esc(p.prevVal)}</b> for <b>${esc(fmtD(p.d))}</b>. New value: <b>${esc(p.v)}</b>.</div>
    <div class="row" style="gap:6px">
      <button class="btn sm grow amber" onclick="collideReplace()">Replace it</button>
      <button class="btn sm grow" onclick="collideKeepBoth()">Keep both</button>
      <button class="btn sm ghost" onclick="numClose()">Cancel</button></div>`;
  _numMount(_numBarWrap(inner));
}
function collideReplace(){ if(!pendDup) return; const p=pendDup;
  if(p.prevIdx>=0 && S.metrics[p.prevIdx]) voidEntry('metric',p.prevIdx); // append-only correction: the old value stays on the record as a void
  numCommit(p.v,p.d,p.key,false); }
function collideKeepBoth(){ if(!pendDup) return; const p=pendDup;
  /* tag the NEW entry dup:1. The prior entry is immutable (append-only law), so we do NOT
     mutate it; metricOn still resolves the pair deterministically by timestamp. */
  numCommit(p.v,p.d,p.key,true); }

/* ===== v7.64 CAPTURE: nightly close-out — an event, not a modal =====
   The top-ranked experiment that never had a capture surface. Writes energy + session-quality
   as first-class metrics (the exact series the sleep->sq and energy->sq knowledge edges have
   been starving for) plus a 'closeout' completion event. Never blocks the screen; never
   auto-backfills a missed night — an invented energy score is worse than a gap, because
   knowledgeEdge cannot tell a guess from real data and the whole engine rests on never being fed one. */
let pendCloseout=null;
function closeoutDone(d,s=S){ return (s.events||[]).some(e=>e.type==='closeout'&&e.d===d); }
function hasSessionToday(d,s=S){ return (s.lifts||[]).some(l=>l.d===d)||(((s.sessions||{})[d])||[]).some(Boolean); }
function closeoutCardHTML(o1rec){
  try{
    const ch=(S.settings&&S.settings.closeoutHour!=null)?S.settings.closeoutHour:21;
    const hr=new Date().getHours();
    const d=todayISO();
    if(hr<ch || closeoutDone(d)) return '';
    if(!pendCloseout) pendCloseout={rec:(o1rec&&o1rec.followed)||null, energy:metricOn(S,'energy',d), sq:metricOn(S,'sq',d), recId:o1rec?o1rec.id:null, recText:o1rec?o1rec.text:null};
    else if(o1rec){ pendCloseout.recId=o1rec.id; pendCloseout.recText=o1rec.text; if(pendCloseout.rec==null) pendCloseout.rec=o1rec.followed||null; }
    return _closeoutInner(d);
  }catch(e){ return ''; }
}
function _closeoutInner(d){
  const p=pendCloseout; if(!p) return '';
  const hasS=hasSessionToday(d);
  const enRow=[1,2,3,4,5].map(v=>`<button class="btn sm grow ${p.energy===v?'amber':'ghost'}" onclick="coEnergy(${v})">${v}</button>`).join('');
  const sqRow=[1,2,3,4,5].map(v=>`<button class="btn sm grow ${p.sq===v?'amber':'ghost'}" onclick="coSq(${v})">${v}</button>`).join('');
  const recRow=p.recId?`<div style="margin-top:8px"><div class="note" style="margin:0 0 4px;font-style:normal">Today's one thing: ${esc(p.recText||'')}</div>
    <div class="row" style="gap:6px"><button class="btn sm grow ${p.rec==='followed'?'amber':'ghost'}" onclick="coRec('followed')">Did it</button><button class="btn sm grow ${p.rec==='partial'?'amber':'ghost'}" onclick="coRec('partial')">Partly</button><button class="btn sm grow ${p.rec==='ignored'?'amber':'ghost'}" onclick="coRec('ignored')">Didn't</button></div></div>`:'';
  const ready=p.energy!=null && (!hasS || p.sq!=null);
  const co=(S.events||[]).filter(e=>e.type==='closeout').length, NEED=7, left=Math.max(0,NEED-co);
  const unlock = left>0
    ? `<div class="note" style="margin-top:8px;font-style:normal;color:var(--faint)">${co} close-out${co===1?'':'s'} logged · ${left} more paired day${left===1?'':'s'} and the app can tell you whether sleep and energy actually move your sessions.</div>`
    : `<div class="note" style="margin-top:8px;font-style:normal;color:var(--green)">Enough paired days logged — see what the app has learned in TRACK.</div>`;
  return `<div class="card" id="closeoutCard" style="border-color:#294551;background:linear-gradient(150deg,rgba(90,169,214,.12),var(--card) 60%)">
    <h3>Nightly close-out <span class="r">30 seconds · close the day honestly</span></h3>
    ${recRow}
    <div style="margin-top:8px"><div class="note" style="margin:0 0 4px;font-style:normal">Energy today</div><div class="row" style="gap:6px">${enRow}</div></div>
    ${hasS?`<div style="margin-top:8px"><div class="note" style="margin:0 0 4px;font-style:normal">Session quality</div><div class="row" style="gap:6px">${sqRow}</div></div>`:''}
    <button class="btn ${ready?'amber':'ghost'}" style="width:100%;margin-top:10px" ${ready?'':'disabled'} onclick="coSave()">Log close-out</button>
    ${unlock}

}
function coEnergy(v){ if(pendCloseout){ pendCloseout.energy=v; _coRepaint(); } }
function coSq(v){ if(pendCloseout){ pendCloseout.sq=v; _coRepaint(); } }
function coRec(state){ if(pendCloseout){ pendCloseout.rec=state; _coRepaint(); } }
function _coRepaint(){ try{ const el=document.querySelector('#closeoutCard'); if(el) el.outerHTML=_closeoutInner(todayISO()); }catch(e){} }
function coSave(){ if(!pendCloseout) return; const d=todayISO();
  if(closeoutDone(d)){ pendCloseout=null; try{ RENDER[curView](); }catch(e){} return; } // one close-out per day, hard
  const rec=pendCloseout.rec, energy=pendCloseout.energy, sq=pendCloseout.sq, recId=pendCloseout.recId;
  if(energy==null){ toast('Tap your energy 1–5 first'); return; }
  const hasS=hasSessionToday(d);
  if(recId && rec){ const r=(S.recs||[]).find(x=>x.id===recId); if(r){ r.followed=rec; r.followedOn=d; logEvent('recfollow',{id:recId,state:rec}); } } // reuse the learning loop without a mid-save re-render
  if(energy!=null && energy!==metricOn(S,'energy',d)) pushMetric({d,key:'energy',val:energy,src:'closeout'});
  if(hasS && sq!=null && sq!==metricOn(S,'sq',d)) pushMetric({d,key:'sq',val:sq,src:'closeout'});
  logEvent('closeout',{d,rec:rec||null,energy,sq:hasS?(sq==null?null:sq):null});
  pendCloseout=null; save();
  toast('Day closed ✓ — the app learned from it');
  try{ RENDER[curView](); }catch(e){}
}
